type: vertical-stack
cards:
  - type: markdown
    title: Brewfather Recipe
    content: |
      {% set stage_entity = 'sensor.brewfather_brew_tracker_stage' %}
      {% set status_entity = 'sensor.brewfather_brew_tracker_status' %}
      {% set raw_entity = 'sensor.brewfather_brew_tracker_raw' %}
      {% set recipe_data = state_attr(raw_entity, 'recipe') %}
      {% set recipe = (recipe_data.get('name') if recipe_data is mapping else none) or state_attr(status_entity, 'brew_tracker_recipe_name') or state_attr(stage_entity, 'brew_tracker_recipe_name') or state_attr(raw_entity, 'recipe_name') or state_attr(raw_entity, 'brew_tracker_recipe_name') or '—' %}
      {% set batch = state_attr(status_entity, 'brew_tracker_batch_name') or state_attr(stage_entity, 'brew_tracker_batch_name') or state_attr(raw_entity, 'batch_name') or state_attr(raw_entity, 'brew_tracker_batch_name') or '—' %}
      {% set batch_id = state_attr(status_entity, 'brew_tracker_batch_id') or state_attr(stage_entity, 'brew_tracker_batch_id') or state_attr(raw_entity, 'batch_id') or '—' %}
      {% set batch_status = state_attr(status_entity, 'brew_tracker_batch_status') or state_attr(raw_entity, 'brew_tracker_batch_status') or '—' %}
      {% set current = state_attr(stage_entity, 'current_step') %}
      {% set nxt = state_attr(stage_entity, 'next_step') %}

      ## {{ recipe }}
      **Batch:** {{ batch }} · **Status:** {{ batch_status }}  
      **Batch ID:** `{{ batch_id }}`

      {% if current is mapping %}
      **Now:** {{ current.get('description') or current.get('tooltip') or current.get('name') or '—' }}
      {% endif %}
      {% if nxt is mapping %}
      **Next:** {{ nxt.get('description') or nxt.get('tooltip') or nxt.get('name') or '—' }}
      {% endif %}

      {% if recipe_data is mapping %}
      {% set boil_time = recipe_data.get('boilTime') %}
      {% set batch_size = recipe_data.get('batchSize') %}
      {% set og = recipe_data.get('og') %}
      {% set fg = recipe_data.get('fg') %}
      {% set ibu = recipe_data.get('ibu') %}
      {% if boil_time is not none or batch_size is not none or og is not none or fg is not none or ibu is not none %}
      **Recipe overview:**{% if batch_size is not none %} {{ batch_size }} L{% endif %}{% if boil_time is not none %} · boil {{ boil_time }} min{% endif %}{% if og is not none %} · OG {{ '%.3f' | format(og | float) }}{% endif %}{% if fg is not none %} · FG {{ '%.3f' | format(fg | float) }}{% endif %}{% if ibu is not none %} · {{ ibu | round(0) | int }} IBU{% endif %}
      {% endif %}
      {% else %}
      _Full recipe data is waiting for the Brewfather adapter._
      {% endif %}

      ### 🌾 Mash schedule
      {% set mash = recipe_data.get('mash') if recipe_data is mapping else none %}
      {% set mash_steps = mash.get('steps', []) if mash is mapping else [] %}
      {% if mash_steps | length > 0 %}
      {% for step in mash_steps if step is mapping %}
        {% set name = step.get('name') or step.get('type') or ('Step ' ~ loop.index) %}
        {% set temp = step.get('stepTemp') %}
        {% set hold = step.get('stepTime') %}
        {% set ramp = step.get('rampTime') %}
      - **{{ name }}**{% if temp is not none %} · {{ temp }} °C{% endif %}{% if hold is not none %} · {{ hold }} min{% endif %}{% if ramp is not none and ramp | float(0) > 0 %} · ramp {{ ramp }} min{% endif %}
      {% endfor %}
      {% else %}
      _No mash schedule is available in the full recipe data yet._
      {% endif %}

      ### 🌿 Hop additions
      {% set hops = recipe_data.get('hops', []) if recipe_data is mapping else [] %}
      {% if hops | length > 0 %}
      {% for hop in hops if hop is mapping %}
        {% set name = hop.get('name') or ('Hop ' ~ loop.index) %}
        {% set amount = hop.get('amount') %}
        {% set use = hop.get('use') or '—' %}
        {% set time = hop.get('time') %}
        {% set time_unit = hop.get('timeUnit') or ('min' if time is not none else '') %}
        {% set temp = hop.get('temp') or hop.get('temperature') %}
      - **{{ name }}**{% if amount is not none %} · {{ amount }} g{% endif %} · {{ use }}{% if time is not none %} · {{ time }} {{ time_unit }}{% endif %}{% if temp is not none %} · {{ temp }} °C{% endif %}
      {% endfor %}
      {% else %}
      _No hop additions are available in the full recipe data yet._
      {% endif %}

  - type: custom:expander-card
    title: BrewTracker execution schedule
    cards:
      - type: markdown
        content: |
          {% set raw_entity = 'sensor.brewfather_brew_tracker_raw' %}
          {% set runtime_entity = 'sensor.brewassistant_brewday_runtime_summary' %}
          {% set tracker = state_attr(raw_entity, 'data') %}
          {% set runtime_timeline = state_attr(runtime_entity, 'timeline') or [] %}
          {% set raw_stages = tracker.get('stages', []) if tracker is mapping else [] %}
          {% set timeline = runtime_timeline if runtime_timeline | length > 0 else raw_stages %}
          {% set current_stage_index = tracker.get('stage') if tracker is mapping else none %}
          {% if timeline | length == 0 %}
          _BrewTracker has not exposed an execution schedule yet._
          {% endif %}
          {% for stage in timeline if stage is mapping %}
            {% set stage_index = loop.index0 %}
            {% set stage_name = stage.get('name') or ('Stage ' ~ loop.index) %}
            {% set stage_name_l = stage_name | lower %}
            {% set raw_step_index = stage.get('step') %}
            {% set stage_active = stage.get('active') or (current_stage_index is not none and current_stage_index | int == stage_index) %}
            {% set stage_paused = stage.get('paused') %}
            {% set stage_passed = current_stage_index is not none and stage_index < current_stage_index | int %}
            {% set stage_marker = '▶' if stage_active else '✓' if stage.get('completed') or stage_passed else '○' %}
            {% set stage_state = ' · paused' if stage_active and stage_paused else '' %}
          ### {{ stage_marker }} {{ stage_name }}{{ stage_state }}
          {% set stage_duration = stage.get('duration') | float(0) %}
          {% if stage_duration > 0 %}_{{ (stage_duration / 60) | round(0) | int }} min total_{% endif %}

            {% for step in stage.get('steps', []) if step is mapping %}
              {% set step_index = loop.index0 %}
              {% set raw_name = step.get('raw_name') or step.get('name') or '' %}
              {% set name_l = raw_name | lower %}
              {% set desc = step.get('description') or '' %}
              {% set desc_l = desc | lower %}
              {% set tooltip = step.get('tooltip') or '' %}
              {% set tooltip_l = tooltip | lower %}
              {% set kind = (step.get('type') or '') | lower %}
              {% set duration_seconds = step.get('duration') | float(0) %}
              {% set at_seconds = step.get('time') | float(0) %}
              {% set value = step.get('value') %}
              {% set value_num = value | float(0) if value is not none else 0 %}
              {% if value_num == (value_num | int) %}
                {% set temp_display = value_num | int %}
              {% else %}
                {% set temp_display = value_num | round(1) %}
              {% endif %}
              {% set raw_active = stage_active and raw_step_index is not none and raw_step_index | int == step_index %}
              {% set passed = stage_passed or (stage_active and raw_step_index is not none and step_index < raw_step_index | int) %}
              {% set marker = '▶' if step.get('active') or raw_active else '✓' if step.get('completed') or passed else '○' %}
              {% set active_state = ' · paused' if raw_active and stage_paused else '' %}
              {% set checkpoint = step.get('pause_before') or step.get('pauseBefore') or name_l.startswith('paus') %}

              {% if kind == 'mash' and name_l == 'start' %}
                {% set label = desc or 'Start mash timer' %}
              {% elif kind == 'boil' and name_l == 'start' %}
                {% set label = desc or 'Start boil timer' %}
              {% elif 'mash additions' in desc_l or 'mäsktillsatser' in desc_l %}
                {% set label = 'Mash additions' %}
              {% elif 'mash complete' in desc_l or 'mäskning slutförd' in desc_l %}
                {% set label = 'Mash complete' %}
              {% elif 'sparge complete' in desc_l or 'lakning slutförd' in desc_l %}
                {% set label = 'Sparge complete' %}
              {% elif name_l == 'sparge' or 'laka med' in desc_l %}
                {% set label = 'Sparge' %}
              {% elif 'boil complete' in desc_l or 'kokslut' in desc_l %}
                {% set label = 'Boil complete' %}
              {% elif stage_name_l == 'boil' and ('cinnamon' in desc_l or 'spice' in desc_l or 'kanel' in desc_l or 'krydd' in desc_l or 'cardamom' in desc_l or 'kardemumma' in desc_l or 'orange peel' in desc_l or 'pomerans' in desc_l) %}
                {% set label = 'Spices' %}
              {% elif stage_name_l == 'boil' and ('boil addition' in desc_l or 'boil addition' in tooltip_l or 'kokgiva' in desc_l or 'kokgiva' in tooltip_l) %}
                {% set label = 'Boil addition' %}
              {% elif kind in ['ramp', 'event'] and value_num > 0 %}
                {% set label = tooltip or desc or ('Heat to ' ~ temp_display ~ ' °C') %}
              {% elif raw_name %}
                {% set label = raw_name %}
              {% elif desc %}
                {% set label = desc %}
              {% else %}
                {% set label = 'Step ' ~ loop.index %}
              {% endif %}

              {% set detail = desc %}
              {% if label in ['Mash additions', 'Boil addition', 'Spices'] and '</br>' in desc %}
                {% set detail = desc.split('</br>', 1)[1] %}
              {% endif %}
              {% set show_temp = value is not none and value_num > 0 and not (kind in ['ramp', 'event'] and (tooltip or desc)) %}
              {% set show_anchor = at_seconds > 0 and duration_seconds <= 0 and not (name_l == 'start' and kind in ['mash', 'boil']) and not (kind in ['ramp', 'event'] and value_num > 0) %}
          - {{ marker }} **{{ label }}**{{ active_state }}{% if checkpoint %} · confirm{% endif %}{% if show_temp %} · {{ temp_display }} °C{% endif %}{% if duration_seconds > 0 %} · {{ (duration_seconds / 60) | round(0) | int }} min{% elif show_anchor %} · at {{ (at_seconds / 60) | round(0) | int }} min remaining{% endif %}{% if detail and detail != label %}  
            _{{ detail }}_{% endif %}
            {% endfor %}
          {% endfor %}

  - type: custom:expander-card
    title: Brewfather recipe / source
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.brewfather_brew_tracker_stage
            name: Brew Tracker stage
          - entity: sensor.brewfather_brew_tracker_status
            name: Brew Tracker status
          - type: attribute
            entity: sensor.brewfather_brew_tracker_raw
            attribute: recipe
            name: Full recipe data
          - type: attribute
            entity: sensor.brewfather_brew_tracker_stage
            attribute: brew_tracker_recipe_name
            name: Recipe
          - type: attribute
            entity: sensor.brewfather_brew_tracker_stage
            attribute: brew_tracker_batch_name
            name: Batch
          - type: attribute
            entity: sensor.brewassistant_brewday_runtime_summary
            attribute: timeline
            name: Normalized BrewTracker execution schedule
          - type: attribute
            entity: sensor.brewfather_brew_tracker_stage
            attribute: current_step
            name: Current step payload
          - type: attribute
            entity: sensor.brewfather_brew_tracker_stage
            attribute: next_step
            name: Next step payload
