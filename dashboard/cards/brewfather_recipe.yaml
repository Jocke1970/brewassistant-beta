type: conditional
conditions:
  - entity: binary_sensor.brewassistant_runtime_brewfather_available
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: markdown
      title: Brewfather Recipe
      content: |
        {% set stage_entity = 'sensor.brewfather_brew_tracker_stage' %}
        {% set status_entity = 'sensor.brewfather_brew_tracker_status' %}
        {% set raw_entity = 'sensor.brewfather_brew_tracker_raw' %}
        {% set runtime_entity = 'sensor.brewassistant_brewday_runtime_summary' %}
        {% set recipe_data = state_attr(raw_entity, 'recipe') %}
        {% set recipe = (recipe_data.get('name') if recipe_data is mapping else none) or state_attr(status_entity, 'brew_tracker_recipe_name') or state_attr(stage_entity, 'brew_tracker_recipe_name') or state_attr(raw_entity, 'recipe_name') or state_attr(raw_entity, 'brew_tracker_recipe_name') or '—' %}
        {% set batch = state_attr(status_entity, 'brew_tracker_batch_name') or state_attr(stage_entity, 'brew_tracker_batch_name') or state_attr(raw_entity, 'batch_name') or state_attr(raw_entity, 'brew_tracker_batch_name') or '—' %}
        {% set batch_id = state_attr(status_entity, 'brew_tracker_batch_id') or state_attr(stage_entity, 'brew_tracker_batch_id') or state_attr(raw_entity, 'batch_id') or '—' %}
        {% set batch_status = state_attr(status_entity, 'brew_tracker_batch_status') or state_attr(raw_entity, 'brew_tracker_batch_status') or '—' %}
        {% set current = state_attr(stage_entity, 'current_step') %}
        {% set nxt = state_attr(stage_entity, 'next_step') %}
        {% set timeline = state_attr(runtime_entity, 'timeline') or [] %}

        ## {{ recipe }}
        **Batch:** {{ batch }} · **Status:** {{ batch_status }}  
        **Batch ID:** `{{ batch_id }}`

        {% if current is mapping %}
        **Now:** {{ current.get('description') or current.get('tooltip') or current.get('name') or '—' }}
        {% endif %}
        {% if nxt is mapping %}
        **Next:** {{ nxt.get('description') or nxt.get('tooltip') or nxt.get('name') or '—' }}
        {% endif %}

        {% if recipe_data is mapping %}
        {% set boil_time = recipe_data.get('boilTime') %}
        {% set batch_size = recipe_data.get('batchSize') %}
        {% set og = recipe_data.get('og') %}
        {% set fg = recipe_data.get('fg') %}
        {% set ibu = recipe_data.get('ibu') %}
        {% if boil_time is not none or batch_size is not none or og is not none or fg is not none or ibu is not none %}
        **Recipe overview:**{% if batch_size is not none %} {{ batch_size }} L{% endif %}{% if boil_time is not none %} · boil {{ boil_time }} min{% endif %}{% if og is not none %} · OG {{ og }}{% endif %}{% if fg is not none %} · FG {{ fg }}{% endif %}{% if ibu is not none %} · {{ ibu | round(0) | int }} IBU{% endif %}
        {% endif %}
        {% else %}
        _Full recipe data is waiting for the Brewfather adapter. The BrewTracker execution schedule is still shown below._
        {% endif %}

        ### 🌾 Mash schedule
        {% set mash = recipe_data.get('mash') if recipe_data is mapping else none %}
        {% set mash_steps = mash.get('steps', []) if mash is mapping else [] %}
        {% if mash_steps | length > 0 %}
        {% for step in mash_steps if step is mapping %}
          {% set name = step.get('name') or step.get('type') or ('Step ' ~ loop.index) %}
          {% set temp = step.get('stepTemp') %}
          {% set hold = step.get('stepTime') %}
          {% set ramp = step.get('rampTime') %}
        - **{{ name }}**{% if temp is not none %} · {{ temp }} °C{% endif %}{% if hold is not none %} · {{ hold }} min{% endif %}{% if ramp is not none and ramp | float(0) > 0 %} · ramp {{ ramp }} min{% endif %}
        {% endfor %}
        {% else %}
        _No mash schedule is available in the full recipe data yet._
        {% endif %}

        ### 🌿 Hop additions
        {% set hops = recipe_data.get('hops', []) if recipe_data is mapping else [] %}
        {% if hops | length > 0 %}
        {% for hop in hops if hop is mapping %}
          {% set name = hop.get('name') or ('Hop ' ~ loop.index) %}
          {% set amount = hop.get('amount') %}
          {% set use = hop.get('use') or '—' %}
          {% set time = hop.get('time') %}
          {% set time_unit = hop.get('timeUnit') or ('min' if time is not none else '') %}
          {% set temp = hop.get('temp') or hop.get('temperature') %}
        - **{{ name }}**{% if amount is not none %} · {{ amount }} g{% endif %} · {{ use }}{% if time is not none %} · {{ time }} {{ time_unit }}{% endif %}{% if temp is not none %} · {{ temp }} °C{% endif %}
        {% endfor %}
        {% else %}
        _No hop additions are available in the full recipe data yet._
        {% endif %}

    - type: custom:expander-card
      title: BrewTracker execution schedule
      cards:
        - type: markdown
          content: |
            {% set timeline = state_attr('sensor.brewassistant_brewday_runtime_summary', 'timeline') or [] %}
            {% if timeline | length == 0 %}
            _BrewTracker has not exposed an execution schedule yet._
            {% endif %}
            {% for stage in timeline if stage is mapping %}
            ### {{ '▶' if stage.get('active') else '✓' if stage.get('completed') else '○' }} {{ stage.get('name') or ('Stage ' ~ loop.index) }}
            {% set stage_duration = stage.get('duration') | float(0) %}
            {% if stage_duration > 0 %}_{{ (stage_duration / 60) | round(0) | int }} min total_{% endif %}

              {% for step in stage.get('steps', []) if step is mapping %}
                {% set name = step.get('raw_name') or step.get('name') or ('Step ' ~ loop.index) %}
                {% set desc = step.get('description') or '' %}
                {% set duration_seconds = step.get('duration') | float(0) %}
                {% set at_seconds = step.get('time') | float(0) %}
                {% set value = step.get('value') %}
                {% set marker = '▶' if step.get('active') else '✓' if step.get('completed') else '○' %}
                {% set pause = ' ⏸' if step.get('pause_before') or (name | lower).startswith('paus') else '' %}
            - {{ marker }} **{{ name }}**{{ pause }}{% if value is not none %} · {{ value }} °C{% endif %}{% if duration_seconds > 0 %} · {{ (duration_seconds / 60) | round(0) | int }} min{% elif at_seconds > 0 %} · at {{ (at_seconds / 60) | round(0) | int }} min remaining{% endif %}{% if desc and desc != name %}  
              _{{ desc }}_{% endif %}
              {% endfor %}
            {% endfor %}

    - type: custom:expander-card
      title: Brewfather recipe / source
      cards:
        - type: entities
          show_header_toggle: false
          entities:
            - entity: sensor.brewfather_brew_tracker_stage
              name: Brew Tracker stage
            - entity: sensor.brewfather_brew_tracker_status
              name: Brew Tracker status
            - type: attribute
              entity: sensor.brewfather_brew_tracker_raw
              attribute: recipe
              name: Full recipe data
            - type: attribute
              entity: sensor.brewfather_brew_tracker_stage
              attribute: brew_tracker_recipe_name
              name: Recipe
            - type: attribute
              entity: sensor.brewfather_brew_tracker_stage
              attribute: brew_tracker_batch_name
              name: Batch
            - type: attribute
              entity: sensor.brewassistant_brewday_runtime_summary
              attribute: timeline
              name: Normalized BrewTracker execution schedule
            - type: attribute
              entity: sensor.brewfather_brew_tracker_stage
              attribute: current_step
              name: Current step payload
            - type: attribute
              entity: sensor.brewfather_brew_tracker_stage
              attribute: next_step
              name: Next step payload
