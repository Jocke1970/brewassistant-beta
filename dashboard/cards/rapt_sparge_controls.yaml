# RAPT-only Sparge. UI is advisory: the backend independently rechecks source,
# session, step, readback and operator confirmation on every button press/write.
# Never treat a reported OFF as an electrical isolation guarantee.
type: conditional
conditions:
  - entity: binary_sensor.brewzilla_profile_active
    state: "on"
  - entity: sensor.brewassistant_brewday_runtime_source
    state: "RAPT BrewZilla Profile"
  - condition: or
    conditions:
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: "Sparge"
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: "Lakning"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: RAPT · Sparge
      icon: mdi:grain
      show_state: false
      show_label: true
      tap_action:
        action: more-info
      triggers_update:
        - button.brewassistant_confirm_sparge_lift
        - binary_sensor.brewzilla_profile_active
        - sensor.brewassistant_brewday_runtime_step
        - sensor.brewassistant_brewzilla_orchestration_mode
        - sensor.brewassistant_brewzilla_control_reason
        - switch.brewzilla_heater
        - switch.brewzilla_pump
        - number.brewzilla_heat_utilization
        - number.brewzilla_pump_utilization
      label: |
        [[[
          const a = entity?.attributes || {};
          const phase = String(a.phase || 'inactive');
          const off = a.outputs_confirmed_off === true;
          const heater = String(a.heater_readback ?? 'unknown').toUpperCase();
          const pump = String(a.pump_readback ?? 'unknown').toUpperCase();
          const mode = String(states['sensor.brewassistant_brewzilla_orchestration_mode']?.state || '');
          const controlReason = String(states['sensor.brewassistant_brewzilla_control_reason']?.state || '');
          if (phase === 'awaiting_lift') {
            return `AWAITING LIFT · heater ${heater} · pump ${pump} · output readback ${off ? 'OFF/0 confirmed in HA' : 'NOT confirmed'}. Verify locally before handling the malt pipe.`;
          }
          if (phase === 'heat_to_boil') {
            if (mode === 'sparge-local-target-conflict-blocked' || controlReason.includes('positive BA heating blocked')) {
              return `LIFT ACKNOWLEDGED · PREBOIL HEAT BLOCKED. RAPT's local target differs from BA's 95 °C or cannot be verified. Check the RAPT profile; do not start heating from BA.`;
            }
            return `LIFT ACKNOWLEDGED · pump stays OFF · BA preboil ceiling ${a.preboil_target_c ?? 95} °C. Heating still requires separate supervised CONFIRM.`;
          }
          return 'Source/step not verified. No lift authorization; check RAPT and BA.';
        ]]]
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: Confirm lifted malt pipe + wort coverage
      icon: mdi:check-decagram-outline
      show_state: false
      show_label: true
      label: Verify that the pipe is safely lifted AND the heating elements are submerged in wort. Heat will require separate supervised confirmation.
      tap_action:
        action: call-service
        service: button.press
        service_data:
          entity_id: button.brewassistant_confirm_sparge_lift
        confirmation:
          text: "I confirm BOTH: (1) the malt pipe is safely lifted, and (2) enough wort covers the heating elements. Proceed to the separate supervised preboil confirmation?"
      styles:
        card:
          - border: 1px solid var(--warning-color)
          - padding: 12px
        label:
          - white-space: normal
          - font-size: 12px
      state:
        - operator: template
          value: |
            [[[
              return entity?.attributes?.operator_confirmation_available !== true;
            ]]]
          styles:
            card:
              - opacity: 0.65
      hold_action:
        action: more-info
