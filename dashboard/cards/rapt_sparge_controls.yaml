# Beta.14: BA Sparge actions only when observation is OFF and the backend is rearmed.
# No hard-coded RCL profile entity ID; backend validates the session and step.
type: conditional
conditions:
  - entity: switch.brewassistant_brewzilla_observe_only
    state: "off"
  - entity: sensor.brewassistant_brewzilla_orchestration_mode
    state_not: observe-only
  - entity: sensor.brewassistant_brewday_runtime_source
    state: RAPT BrewZilla Profile
  - condition: or
    conditions:
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: Sparge
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: Lakning
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: RAPT · Sparge
      icon: mdi:grain
      show_state: false
      show_label: true
      triggers_update: all
      tap_action:
        action: more-info
      label: |
        [[[
          const a = entity?.attributes || {};
          const phase = String(a.phase || 'inactive');
          const off = a.outputs_confirmed_off === true;
          const heater = String(a.heater_readback ?? 'unknown').toUpperCase();
          const pump = String(a.pump_readback ?? 'unknown').toUpperCase();
          const profile = Object.values(states).find(s => s?.entity_id?.startsWith('binary_sensor.') && s?.attributes?.ba_source === 'rapt_cloud_link_brewzilla_profile_runtime' && s.state === 'on');
          if (!profile) return 'No active RCL profile sensor found. Do not confirm the lift; inspect RAPT locally.';
          if (phase === 'awaiting_lift') return `AWAITING LIFT · heater ${heater} · pump ${pump} · HA readback ${off ? 'OFF/0' : 'NOT confirmed'}. Verify physical outputs before lifting.`;
          if (phase === 'heat_to_boil') return 'LIFT ACKNOWLEDGED · keep pump OFF · pre-boil BA heating needs a separate supervised confirmation. Check RAPT target and power locally.';
          return 'No lift confirmation currently available. Backend controls safety.';
        ]]]
      styles:
        card:
          - border-radius: 16px
          - padding: 12px
        label:
          - white-space: normal
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: CONFIRM LIFT AND WORT LEVEL
      icon: mdi:check-decagram-outline
      show_state: false
      show_label: true
      triggers_update: all
      label: Confirm only when the grain pipe is secure and wort covers the elements. Heating requires separate confirmation.
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_confirm_sparge_lift
        confirmation:
          text: Have you physically verified BOTH the grain pipe is lifted safely AND the elements are covered by wort? This does not prove electrical isolation.
      styles:
        card:
          - display: |
              [[[
                const sw = states['switch.brewassistant_brewzilla_observe_only'];
                const orch = states['sensor.brewassistant_brewzilla_orchestration_mode'];
                return sw?.state === 'off' && orch?.attributes?.observe_only_effective === false && orch?.attributes?.hot_side_actuator_writes_allowed === true && entity?.attributes?.operator_confirmation_available === true ? 'block' : 'none';
              ]]]
          - border: 1px solid var(--warning-color)
          - padding: 12px
        label:
          - white-space: normal
          - font-size: 12px
      hold_action:
        action: more-info
