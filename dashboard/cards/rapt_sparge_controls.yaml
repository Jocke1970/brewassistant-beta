# Only a verified RAPT Sparge step, with BA observation OFF and explicit rearm.
# BA backend independently rechecks identity, output readback and permission.
type: conditional
conditions:
  - entity: switch.brewassistant_brewzilla_observe_only
    state: "off"
  - entity: sensor.brewassistant_brewzilla_orchestration_mode
    state_not: observe-only
  - entity: sensor.brewassistant_brewzilla_orchestration_mode
    state_not: unavailable
  - entity: sensor.brewassistant_brewzilla_orchestration_mode
    state_not: unknown
  - entity: sensor.brewassistant_brewday_runtime_source
    state: "RAPT BrewZilla Profile"
  - condition: or
    conditions:
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: "Sparge"
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: "Lakning"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: RAPT · Sparge
      icon: mdi:grain
      show_state: false
      show_label: true
      triggers_update: all
      tap_action:
        action: more-info
      label: |
        [[[
          const a = entity?.attributes || {};
          const phase = String(a.phase || 'inactive');
          const off = a.outputs_confirmed_off === true;
          const heater = String(a.heater_readback ?? 'unknown').toUpperCase();
          const pump = String(a.pump_readback ?? 'unknown').toUpperCase();
          const mode = String(states['sensor.brewassistant_brewzilla_orchestration_mode']?.state || '');
          const controlReason = String(states['sensor.brewassistant_brewzilla_control_reason']?.state || '');
          const profile = Object.values(states).find(s => s?.entity_id?.startsWith('binary_sensor.') && s?.attributes?.ba_source === 'rapt_cloud_link_brewzilla_profile_runtime' && s.state === 'on');
          if (!profile) return 'No active RCL profile sensor found. Do not confirm lift; inspect RAPT locally.';
          if (phase === 'awaiting_lift') return `AWAITING LIFT · heater ${heater} · pump ${pump} · HA readback ${off ? 'OFF/0' : 'NOT confirmed'}. Verify locally before lifting.`;
          if (phase === 'heat_to_boil') {
            if (mode === 'sparge-local-target-conflict-blocked' || controlReason.includes('positive BA heating blocked')) return 'LIFT ACKNOWLEDGED · PREBOIL HEAT BLOCKED. RAPT local target differs from BA 95 °C or cannot be verified; do not start BA heating.';
            return `LIFT ACKNOWLEDGED · pump stays OFF · BA preboil ceiling ${a.preboil_target_c ?? 95} °C. Heating still requires separate supervised CONFIRM.`;
          }
          return 'Source or step not verified. No lift confirmation; check RAPT and BA.';
        ]]]
      styles:
        card:
          - border-radius: 16px
          - padding: 12px
        label:
          - white-space: normal
    - type: markdown
      content: >-
        {% set reason = states('sensor.brewassistant_brewzilla_control_reason') %}
        **Reason:** {{ reason }}  
        **Heat utilization:** {{ states('number.brewzilla_heat_utilization') }} %  
        **Pump utilization:** {{ states('number.brewzilla_pump_utilization') }} %  
        HA OFF/0 readback is not proof of electrical isolation.
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: CONFIRM LIFT AND WORT COVERAGE
      icon: mdi:check-decagram-outline
      show_state: false
      show_label: true
      triggers_update: all
      label: Confirm only when the malt pipe is safely lifted AND wort covers the heating elements. Heating needs separate confirmation.
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_confirm_sparge_lift
        confirmation:
          text: Have you physically verified BOTH the malt pipe is safely lifted and the heating elements are covered with wort? This is not proof of electrical isolation.
      styles:
        card:
          - display: |
              [[[
                const sw = states['switch.brewassistant_brewzilla_observe_only'];
                const orch = states['sensor.brewassistant_brewzilla_orchestration_mode'];
                return sw?.state === 'off' && orch?.attributes?.observe_only_effective === false && orch?.attributes?.hot_side_actuator_writes_allowed === true && entity?.attributes?.operator_confirmation_available === true ? 'block' : 'none';
              ]]]
          - border: 1px solid var(--warning-color)
          - padding: 12px
        label:
          - white-space: normal
          - font-size: 12px
      hold_action:
        action: more-info
