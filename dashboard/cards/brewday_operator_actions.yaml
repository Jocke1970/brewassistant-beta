# Beta.14: BA action controls are hidden until observation is explicitly rearmed.
# UI visibility is not a substitute for the independent backend write guard.
type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state: observe-only
      card:
        type: markdown
        content: >-
          **OBSERVATION ONLY · CONTROL BREWZILLA LOCALLY** 🔒

          BA action buttons are hidden. Use BrewZilla's local controls for
          heat, pump and stop. Observation sends no OFF/0 % commands;
          verify physical outputs at the device. Switching the observation
          switch OFF still requires separate rearm in the operator panel.
    - type: conditional
      conditions:
        - entity: switch.brewassistant_brewzilla_observe_only
          state: "off"
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state_not: observe-only
      card:
        type: vertical-stack
        cards:
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewday_runtime_state
                state: idle
              - entity: sensor.brewfather_brew_tracker_status
                state_not: active
            card:
              type: custom:button-card
              name: PREPARE MANUAL BREWDAY
              icon: mdi:clipboard-check-outline
              show_label: true
              label: Prepare the manual brew session without starting it
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_prepare
              styles:
                card:
                  - border-radius: 16px
                  - padding: 12px
                  - background: rgba(255,152,0,.10)
                label:
                  - white-space: normal
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: unknown
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: unavailable
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: none
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: idle
            card:
              type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: button.brewassistant_confirm_supervised_apply
                  name: CONFIRM ACTION
                  icon: mdi:check-decagram
                  show_label: true
                  label: Current pending plan only
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_confirm_supervised_apply
                    confirmation:
                      text: Confirm the current BrewAssistant plan? Check plan and BrewZilla locally.
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 12px
                      - background: rgba(76,175,80,.20)
                    label:
                      - white-space: normal
                - type: custom:button-card
                  entity: button.brewassistant_cancel_supervised_apply
                  name: REJECT ACTION
                  icon: mdi:cancel
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_cancel_supervised_apply
                    confirmation:
                      text: Reject the currently pending BrewAssistant plan?
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 12px
                      - background: rgba(255,152,0,.10)
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewday_runtime_state
                state_not: idle
            card:
              type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: button.brewassistant_abort_brewday
                  name: ABORT BREWDAY
                  icon: mdi:alert-octagon-outline
                  show_label: true
                  label: Locks BA. Physical OFF is not guaranteed.
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_abort_brewday
                    confirmation:
                      text: Abort BA brewday and lock BA control? Separately check heater, pump and power at BrewZilla; physical shutdown is not guaranteed.
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 12px
                      - background: rgba(244,67,54,.16)
                    label:
                      - white-space: normal
                - type: conditional
                  conditions:
                    - entity: sensor.brewassistant_brewday_operator_control_state
                      state: aborted
                  card:
                    type: custom:button-card
                    entity: button.brewassistant_rearm_brewday_control
                    name: RELEASE ABORT LOCK
                    icon: mdi:shield-check-outline
                    show_label: true
                    label: Separate from observation-only rearm
                    tap_action:
                      action: call-service
                      service: button.press
                      target:
                        entity_id: button.brewassistant_rearm_brewday_control
                      confirmation:
                        text: Release BA's ABORT lock? Observation and all other safety guards remain separate. Verify BrewZilla locally.
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 12px
                        - background: rgba(255,193,7,.14)
                      label:
                        - white-space: normal
