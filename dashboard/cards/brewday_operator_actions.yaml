# Emergency ABORT is independent of BA read-only, runtime state and owner.
# UI visibility is not a safety boundary; the backend emergency lane is definitive.
type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: button.brewassistant_abort_brewday
      name: ABORT · EMERGENCY STOP
      icon: mdi:alert-octagon
      show_state: false
      show_label: true
      label: Always available · request active RAPT profile STOP and BZ OFF/0 · verify physical shutdown
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_abort_brewday
      styles:
        card:
          - border-radius: 16px
          - padding: 13px
          - min-height: 76px
          - background: rgba(244,67,54,.22)
          - border: 3px solid rgba(244,67,54,.85)
        label:
          - white-space: normal
          - font-size: 12px
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewday_operator_control_state
          state: "aborted"
      card:
        type: custom:button-card
        entity: button.brewassistant_rearm_brewday_control
        name: REARM AFTER ABORT
        icon: mdi:shield-check-outline
        show_label: true
        label: Separate operator acknowledgement · does not reactivate BA read-only switch
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brewassistant_rearm_brewday_control
          confirmation:
            text: Have you physically checked BrewZilla and want to release the ABORT latch? BA read-only and other safety interlocks remain separate.
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - background: rgba(255,193,7,.14)
          label:
            - white-space: normal
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state: observe-only
      card:
        type: markdown
        content: >-
          **BA READ-ONLY · MANUAL CONTROL ALLOWED** 🔒

          BA automatic target, heater and pump commands are denied.
          **ABORT/EMERGENCY STOP above always applies.** Direct BrewZilla control
          and explicit operator actions in the Manual Brewday UI remain available.
          An active RAPT profile must be stopped with confirmed STOP before
          Manual Brewday takeover; read-only does not stop RAPT automatically.
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewday_runtime_state
          state: "idle"
        - entity: sensor.brewfather_brew_tracker_status
          state_not: "active"
      card:
        type: custom:button-card
        name: PREPARE MANUAL BREWDAY
        icon: mdi:clipboard-check-outline
        show_state: false
        show_label: true
        label: Available while BA is read-only · active RAPT profile must first have confirmed STOP
        tap_action:
          action: call-service
          service: brewassistant.manual_brewday_prepare
        styles:
          card:
            - border-radius: 16px
            - padding: 12px
            - min-height: 64px
            - background: rgba(255,152,0,.10)
            - border: 1px solid rgba(255,152,0,.24)
          label:
            - white-space: normal
    - type: conditional
      conditions:
        - entity: switch.brewassistant_brewzilla_observe_only
          state: "off"
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state_not: observe-only
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state_not: unavailable
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state_not: unknown
      card:
        type: vertical-stack
        cards:
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: "unknown"
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: "unavailable"
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: "none"
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: "idle"
            card:
              type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: button.brewassistant_confirm_supervised_apply
                  triggers_update:
                    - sensor.brewassistant_brewzilla_pending_action
                  name: CONFIRM ACTION
                  icon: mdi:check-decagram
                  show_label: true
                  label: CONFIRMATION REQUIRED · current plan only
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_confirm_supervised_apply
                    confirmation:
                      text: Confirm the current pending BA action? Verify the plan and BrewZilla locally.
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 10px
                      - min-height: 58px
                      - background: rgba(76,175,80,.22)
                      - border: 2px solid rgba(76,175,80,.72)
                      - animation: ba-confirm-pulse 1.4s ease-in-out infinite
                    label:
                      - white-space: normal
                  extra_styles: |
                    @keyframes ba-confirm-pulse {
                      0%, 100% { transform: scale(1); box-shadow: 0 0 0 2px rgba(76,175,80,.10); }
                      50% { transform: scale(1.018); box-shadow: 0 0 0 6px rgba(76,175,80,.18); }
                    }
                    @media (prefers-reduced-motion: reduce) {
                      #card { animation: none !important; transform: none !important; }
                    }
                - type: custom:button-card
                  entity: button.brewassistant_cancel_supervised_apply
                  name: REJECT ACTION
                  icon: mdi:cancel
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_cancel_supervised_apply
                    confirmation:
                      text: Reject the current pending BrewAssistant plan?
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 12px
                      - background: rgba(255,152,0,.10)
