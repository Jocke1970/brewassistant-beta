type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewday_runtime_summary
      name: Manual Brewday
      icon: mdi:gesture-tap-button
      show_state: false
      show_label: true
      tap_action:
        action: more-info
      label: |
        [[[
          const clean = (v) => {
            if (v === undefined || v === null) return null;
            const s = String(v);
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
          };
          const num = (id) => {
            const v = Number(String(states[id]?.state ?? '').replace(',', '.'));
            return Number.isFinite(v) ? v : null;
          };
          const fmt = (v, unit = '', d = 1) => Number.isFinite(v) ? `${v.toFixed(d)}${unit ? ' ' + unit : ''}` : '—';
          const runtime = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
          const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || 'Idle';
          const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
          const temp = num('sensor.brewzilla_temperature');
          const target = num('number.brewzilla_target_temperature');
          const heat = num('number.brewzilla_heat_utilization');
          const pump = num('number.brewzilla_pump_utilization');
          const targetManual = states['switch.brewassistant_brewzilla_manual_target_override']?.state === 'on';
          const heatAuto = states['switch.brewassistant_brewzilla_allow_heater_control']?.state === 'on';
          const pumpAuto = states['switch.brewassistant_brewzilla_allow_pump_control']?.state === 'on';
          return `<div style="line-height:1.35;">
            <div style="font-size:12px;font-weight:800;opacity:.68;">${runtime} · ${stage} · ${step}</div>
            <div style="margin-top:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;">
              <div><b>${fmt(temp,'°C')}</b><br><span style="font-size:10px;opacity:.62;">temperature</span></div>
              <div><b>${fmt(target,'°C')}</b><br><span style="font-size:10px;opacity:.62;">target · ${targetManual ? 'MAN' : 'AUTO'}</span></div>
              <div><b>${fmt(heat,'%')}</b><br><span style="font-size:10px;opacity:.62;">heat · ${heatAuto ? 'AUTO' : 'MAN'}</span></div>
              <div><b>${fmt(pump,'%')}</b><br><span style="font-size:10px;opacity:.62;">pump · ${pumpAuto ? 'AUTO' : 'MAN'}</span></div>
            </div>
          </div>`;
        ]]]
      styles:
        card:
          - border-radius: 22px
          - padding: 14px
          - background: linear-gradient(135deg, rgba(127,127,127,.10), rgba(127,127,127,.035))
          - border: 1px solid rgba(127,127,127,.18)
        grid:
          - grid-template-areas: '"i n" "i l"'
          - grid-template-columns: 42px minmax(0,1fr)
          - column-gap: 12px
        icon:
          - width: 27px
          - height: 27px
        name:
          - justify-self: start
          - font-size: 15px
          - font-weight: 950
        label:
          - justify-self: stretch
          - text-align: left
          - white-space: normal

    - type: custom:expander-card
      title-card:
        type: custom:button-card
        name: BrewZilla · manual control
        icon: mdi:tune-variant
        show_state: false
        show_label: true
        label: |
          [[[
            const targetManual = states['switch.brewassistant_brewzilla_manual_target_override']?.state === 'on';
            const heatAuto = states['switch.brewassistant_brewzilla_allow_heater_control']?.state === 'on';
            const pumpAuto = states['switch.brewassistant_brewzilla_allow_pump_control']?.state === 'on';
            return `Target ${targetManual ? 'MAN' : 'AUTO'} · Heat ${heatAuto ? 'AUTO' : 'MAN'} · Pump ${pumpAuto ? 'AUTO' : 'MAN'}`;
          ]]]
        styles:
          card:
            - border-radius: 18px
            - padding: 12px
            - background: rgba(33,150,243,.06)
            - border: 1px solid rgba(33,150,243,.18)
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 34px minmax(0,1fr)
            - column-gap: 10px
          icon:
            - width: 22px
            - height: 22px
          name:
            - justify-self: start
            - font-size: 14px
            - font-weight: 950
          label:
            - justify-self: start
            - text-align: left
            - white-space: normal
            - font-size: 11.5px
            - font-weight: 750
            - opacity: 0.72
      cards:
        - type: markdown
          content: >-
            **Ownership in Manual Brew:** enable **Manual target override** to keep the
            BrewZilla target at the value below. When **BA may control heat/pump** is off,
            BrewAssistant leaves that channel entirely to the operator. Safety guards may
            still stop heater/pump on faults, stale data, or ABORT.
        - type: entities
          show_header_toggle: false
          entities:
            - entity: switch.brewassistant_brewzilla_manual_target_override
              name: Manual target override
              icon: mdi:hand-back-right-outline
            - entity: number.brewzilla_target_temperature
              name: Target temperature
            - type: divider
            - entity: switch.brewassistant_brewzilla_allow_heater_control
              name: BA may control heat (Auto)
              icon: mdi:robot-industrial-outline
            - entity: number.brewzilla_heat_utilization
              name: Heat utilization
            - entity: switch.brewzilla_heater
              name: Heater
            - type: divider
            - entity: switch.brewassistant_brewzilla_allow_pump_control
              name: BA may control pump (Auto)
              icon: mdi:robot-industrial-outline
            - entity: number.brewzilla_pump_utilization
              name: Pump utilization
            - entity: switch.brewzilla_pump
              name: Pump

    - type: custom:expander-card
      title-card:
        type: custom:button-card
        entity: sensor.brewassistant_brewday_runtime_summary
        name: Manual brewday controls
        icon: mdi:gesture-tap-button
        show_state: false
        show_label: true
        label: |
          [[[
            const runtime = states['sensor.brewassistant_brewday_runtime_state']?.state ?? 'idle';
            const stage = states['sensor.brewassistant_brewday_runtime_stage']?.state ?? 'Idle';
            const step = states['sensor.brewassistant_brewday_runtime_step']?.state ?? 'open for service controls';
            return `${runtime} · ${stage} · ${step}`;
          ]]]
        styles:
          card:
            - border-radius: 18px
            - padding: 12px
            - background: rgba(127,127,127,.055)
            - border: 1px solid rgba(127,127,127,.14)
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 34px minmax(0,1fr)
            - column-gap: 10px
          icon:
            - width: 22px
            - height: 22px
          name:
            - justify-self: start
            - font-size: 14px
            - font-weight: 950
          label:
            - justify-self: start
            - text-align: left
            - white-space: normal
            - font-size: 11.5px
            - font-weight: 750
            - opacity: 0.72
      cards:
        - type: grid
          columns: 3
          square: false
          cards:
            - type: button
              name: Prepare
              icon: mdi:clipboard-check-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_prepare
            - type: button
              name: Start
              icon: mdi:play-circle-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start
            - type: button
              name: Pause
              icon: mdi:pause-circle-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_pause
            - type: button
              name: Next
              icon: mdi:skip-next-circle-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_next
            - type: button
              name: Mash
              icon: mdi:barley
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start_mash
                confirmation:
                  text: Jump Manual Brewday to Mash?
            - type: button
              name: Boil
              icon: mdi:kettle-steam-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start_boil
                confirmation:
                  text: Jump Manual Brewday to Boil?
            - type: button
              name: Hopstand
              icon: mdi:leaf
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start_whirlpool
                confirmation:
                  text: Jump Manual Brewday to Whirlpool / Hopstand?
            - type: button
              name: Cooling
              icon: mdi:snowflake-thermometer
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start_cooling
                confirmation:
                  text: Jump Manual Brewday to Cooling?
            - type: button
              name: Finish
              icon: mdi:check-circle-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_finish
                confirmation:
                  text: Finish Manual Brewday?
        - type: horizontal-stack
          cards:
            - type: button
              name: Apply BZ target
              icon: mdi:target-account
              tap_action:
                action: call-service
                service: brewassistant.apply_brewzilla_target
                confirmation:
                  text: Apply the currently allowed BA control to BrewZilla?
            - type: button
              name: Reset
              icon: mdi:restart-alert
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_reset
                confirmation:
                  text: Reset the Manual Brewday runtime?
