type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewday_runtime_summary
      name: Manuell bryggdag
      icon: mdi:gesture-tap-button
      show_state: false
      show_label: true
      tap_action:
        action: more-info
      label: |
        [[[
          const clean = (v) => {
            if (v === undefined || v === null) return null;
            const s = String(v);
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
          };
          const num = (id) => {
            const v = Number(String(states[id]?.state ?? '').replace(',', '.'));
            return Number.isFinite(v) ? v : null;
          };
          const fmt = (v, unit = '', d = 1) => Number.isFinite(v) ? `${v.toFixed(d)}${unit ? ' ' + unit : ''}` : '—';
          const runtime = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
          const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || 'Idle';
          const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
          const temp = num('sensor.brewzilla_temperature');
          const target = num('number.brewzilla_target_temperature');
          const heat = num('number.brewzilla_heat_utilization');
          const pump = num('number.brewzilla_pump_utilization');
          const targetManual = states['switch.brewassistant_brewzilla_manual_target_override']?.state === 'on';
          const heatAuto = states['switch.brewassistant_brewzilla_allow_heater_control']?.state === 'on';
          const pumpAuto = states['switch.brewassistant_brewzilla_allow_pump_control']?.state === 'on';
          return `<div style="line-height:1.35;">
            <div style="font-size:12px;font-weight:800;opacity:.68;">${runtime} · ${stage} · ${step}</div>
            <div style="margin-top:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;">
              <div><b>${fmt(temp,'°C')}</b><br><span style="font-size:10px;opacity:.62;">temperatur</span></div>
              <div><b>${fmt(target,'°C')}</b><br><span style="font-size:10px;opacity:.62;">mål · ${targetManual ? 'MAN' : 'AUTO'}</span></div>
              <div><b>${fmt(heat,'%')}</b><br><span style="font-size:10px;opacity:.62;">värme · ${heatAuto ? 'AUTO' : 'MAN'}</span></div>
              <div><b>${fmt(pump,'%')}</b><br><span style="font-size:10px;opacity:.62;">pump · ${pumpAuto ? 'AUTO' : 'MAN'}</span></div>
            </div>
          </div>`;
        ]]]
      styles:
        card:
          - border-radius: 22px
          - padding: 14px
          - background: linear-gradient(135deg, rgba(127,127,127,.10), rgba(127,127,127,.035))
          - border: 1px solid rgba(127,127,127,.18)
        grid:
          - grid-template-areas: '"i n" "i l"'
          - grid-template-columns: 42px minmax(0,1fr)
          - column-gap: 12px
        icon:
          - width: 27px
          - height: 27px
        name:
          - justify-self: start
          - font-size: 15px
          - font-weight: 950
        label:
          - justify-self: stretch
          - text-align: left
          - white-space: normal

    - type: custom:expander-card
      title-card:
        type: custom:button-card
        name: BrewZilla · manuell styrning
        icon: mdi:tune-variant
        show_state: false
        show_label: true
        label: |
          [[[
            const targetManual = states['switch.brewassistant_brewzilla_manual_target_override']?.state === 'on';
            const heatAuto = states['switch.brewassistant_brewzilla_allow_heater_control']?.state === 'on';
            const pumpAuto = states['switch.brewassistant_brewzilla_allow_pump_control']?.state === 'on';
            return `Mål ${targetManual ? 'MAN' : 'AUTO'} · Värme ${heatAuto ? 'AUTO' : 'MAN'} · Pump ${pumpAuto ? 'AUTO' : 'MAN'}`;
          ]]]
        styles:
          card:
            - border-radius: 18px
            - padding: 12px
            - background: rgba(33,150,243,.06)
            - border: 1px solid rgba(33,150,243,.18)
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 34px minmax(0,1fr)
            - column-gap: 10px
          icon:
            - width: 22px
            - height: 22px
          name:
            - justify-self: start
            - font-size: 14px
            - font-weight: 950
          label:
            - justify-self: start
            - text-align: left
            - white-space: normal
            - font-size: 11.5px
            - font-weight: 750
            - opacity: 0.72
      cards:
        - type: markdown
          content: >-
            **Ägarskap i Manual Brew:** slå på **Manuellt temperaturmål** för att låsa
            BrewZilla-målet till värdet nedan. När **BA får styra värme/pump** är av
            lämnar BrewAssistant respektive kanal helt till operatören. Säkerhetsguardarna
            kan fortfarande stoppa värmare/pump vid fel, stale data eller ABORT.
        - type: entities
          show_header_toggle: false
          entities:
            - entity: switch.brewassistant_brewzilla_manual_target_override
              name: Manuellt temperaturmål
              icon: mdi:hand-back-right-outline
            - entity: number.brewzilla_target_temperature
              name: Temperaturmål
            - type: divider
            - entity: switch.brewassistant_brewzilla_allow_heater_control
              name: BA får styra värme (Auto)
              icon: mdi:robot-industrial-outline
            - entity: number.brewzilla_heat_utilization
              name: Heat utilization
            - entity: switch.brewzilla_heater
              name: Värmare
            - type: divider
            - entity: switch.brewassistant_brewzilla_allow_pump_control
              name: BA får styra pump (Auto)
              icon: mdi:robot-industrial-outline
            - entity: number.brewzilla_pump_utilization
              name: Pump utilization
            - entity: switch.brewzilla_pump
              name: Pump

    - type: custom:expander-card
      title-card:
        type: custom:button-card
        entity: sensor.brewassistant_brewday_runtime_summary
        name: Manuella bryggdagskontroller
        icon: mdi:gesture-tap-button
        show_state: false
        show_label: true
        label: |
          [[[
            const runtime = states['sensor.brewassistant_brewday_runtime_state']?.state ?? 'idle';
            const stage = states['sensor.brewassistant_brewday_runtime_stage']?.state ?? 'Idle';
            const step = states['sensor.brewassistant_brewday_runtime_step']?.state ?? 'öppna för serviceknappar';
            return `${runtime} · ${stage} · ${step}`;
          ]]]
        styles:
          card:
            - border-radius: 18px
            - padding: 12px
            - background: rgba(127,127,127,.055)
            - border: 1px solid rgba(127,127,127,.14)
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 34px minmax(0,1fr)
            - column-gap: 10px
          icon:
            - width: 22px
            - height: 22px
          name:
            - justify-self: start
            - font-size: 14px
            - font-weight: 950
          label:
            - justify-self: start
            - text-align: left
            - white-space: normal
            - font-size: 11.5px
            - font-weight: 750
            - opacity: 0.72
      cards:
        - type: grid
          columns: 3
          square: false
          cards:
            - type: button
              name: Förbered
              icon: mdi:clipboard-check-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_prepare
            - type: button
              name: Starta
              icon: mdi:play-circle-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start
            - type: button
              name: Pausa
              icon: mdi:pause-circle-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_pause
            - type: button
              name: Nästa
              icon: mdi:skip-next-circle-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_next
            - type: button
              name: Mäskning
              icon: mdi:barley
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start_mash
                confirmation:
                  text: Hoppa den manuella bryggdagen till Mäskning?
            - type: button
              name: Kok
              icon: mdi:kettle-steam-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start_boil
                confirmation:
                  text: Hoppa den manuella bryggdagen till Kok?
            - type: button
              name: Hopstand
              icon: mdi:leaf
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start_whirlpool
                confirmation:
                  text: Hoppa den manuella bryggdagen till Whirlpool / Hopstand?
            - type: button
              name: Kylning
              icon: mdi:snowflake-thermometer
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_start_cooling
                confirmation:
                  text: Hoppa den manuella bryggdagen till Kylning?
            - type: button
              name: Slutför
              icon: mdi:check-circle-outline
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_finish
                confirmation:
                  text: Slutför den manuella bryggdagen?
        - type: horizontal-stack
          cards:
            - type: button
              name: Verkställ BZ-mål
              icon: mdi:target-account
              tap_action:
                action: call-service
                service: brewassistant.apply_brewzilla_target
                confirmation:
                  text: Verkställ nuvarande tillåtna BA-styrning på BrewZilla?
            - type: button
              name: Återställ
              icon: mdi:restart-alert
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_reset
                confirmation:
                  text: Återställ den manuella bryggdagsruntimen?
