# Beta.14: strictly read-only HA/RCL readback. Do not embed editable switch/number rows:
# clicking them controls RCL directly, outside BA's observe-only guard.
type: conditional
conditions:
  - condition: state_not
    entity: sensor.brewassistant_brewzilla_orchestration_mode
    state: unavailable
card:
  type: vertical-stack
  cards:
    - type: markdown
      title: BrewZilla · local control readback
      content: >-
        {% set orch = 'sensor.brewassistant_brewzilla_orchestration_mode' %}
        {% set observing = state_attr(orch, 'observe_only_effective') %}
        {% set sw = states('switch.brewassistant_brewzilla_observe_only') %}
        {% if observing != false or sw != 'off' %}
        **🔒 READBACK ONLY – OPERATE BREWZILLA AT ITS OWN PANEL.**

        BA observation sends no commands, not even OFF/0 %. Verify physical
        shutdown at the device. Other Lovelace cards controlling RCL directly
        are independent of BA's guard.
        {% else %}
        **BA observation lock released.** Other safety locks remain in force;
        this card does not verify physical outputs.
        {% endif %}

        **Orchestration:** `{{ states(orch) }}`  
        **Control reason:** {{ states('sensor.brewassistant_brewzilla_control_reason') }}  
        **RCL connection:** {{ states('sensor.brewzilla_connection') }}  
        **Kettle temperature:** {{ states('sensor.brewzilla_temperature') }} °C  
        **Target readback:** {{ states('number.brewzilla_target_temperature') }} °C  
        **Heater readback:** {{ states('switch.brewzilla_heater') }}  
        **Pump readback:** {{ states('switch.brewzilla_pump') }}  
        **Heat utilization readback:** {{ states('number.brewzilla_heat_utilization') }} %  
        **Pump utilization readback:** {{ states('number.brewzilla_pump_utilization') }} %  
        **Power:** {{ states('sensor.brewassistant_brewzilla_power') }} W
    - type: custom:expander-card
      title: BA control model · diagnostic only
      cards:
        - type: markdown
          content: >-
            {% set orch = 'sensor.brewassistant_brewzilla_orchestration_mode' %}
            **BA write permission:** {{ state_attr(orch, 'hot_side_actuator_writes_allowed') }}  
            **Observation effective:** {{ state_attr(orch, 'observe_only_effective') }}  
            **Rearm required:** {{ state_attr(orch, 'observe_only_rearm_required') }}  
            **Requested target:** {{ states('sensor.brewassistant_brewzilla_requested_target') }} °C  
            **Applied target:** {{ states('sensor.brewassistant_brewzilla_applied_target') }} °C  
            **Target delta:** {{ states('sensor.brewassistant_brewzilla_target_delta') }}  
            **Wort/kettle:** {{ states('sensor.brewassistant_brewzilla_wort_temperature') }} °C  
            **Mash:** {{ states('sensor.brewassistant_brewzilla_mash_temperature') }} °C  
            **RCL degraded:** {{ state_attr(orch, 'rcl_degraded') }}  
            **Local control lease:** {{ state_attr(orch, 'local_control_lease_active') }}
