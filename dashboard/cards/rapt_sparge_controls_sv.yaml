# Only a verified RAPT Sparge step, with BA observation OFF and explicit rearm.
# BA backend independently rechecks identity, output readback and permission.
type: conditional
conditions:
  - entity: switch.brewassistant_brewzilla_observe_only
    state: "off"
  - entity: sensor.brewassistant_brewzilla_orchestration_mode
    state_not: observe-only
  - entity: sensor.brewassistant_brewzilla_orchestration_mode
    state_not: unavailable
  - entity: sensor.brewassistant_brewzilla_orchestration_mode
    state_not: unknown
  - entity: sensor.brewassistant_brewday_runtime_source
    state: "RAPT BrewZilla Profile"
  - condition: or
    conditions:
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: "Sparge"
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: "Lakning"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: RAPT · Lakning
      icon: mdi:grain
      show_state: false
      show_label: true
      triggers_update: all
      tap_action:
        action: more-info
      label: |
        [[[
          const a = entity?.attributes || {};
          const phase = String(a.phase || 'inactive');
          const off = a.outputs_confirmed_off === true;
          const heater = String(a.heater_readback ?? 'okänd').toUpperCase();
          const pump = String(a.pump_readback ?? 'okänd').toUpperCase();
          const mode = String(states['sensor.brewassistant_brewzilla_orchestration_mode']?.state || '');
          const controlReason = String(states['sensor.brewassistant_brewzilla_control_reason']?.state || '');
          const profile = Object.values(states).find(s => s?.entity_id?.startsWith('binary_sensor.') && s?.attributes?.ba_source === 'rapt_cloud_link_brewzilla_profile_runtime' && s.state === 'on');
          if (!profile) return 'Ingen aktiv RCL-profilsensor hittades. Ingen lyftkvittens; kontrollera RAPT lokalt.';
          if (phase === 'awaiting_lift') return `VÄNTAR PÅ LYFT · värme ${heater} · pump ${pump} · HA-avläsning ${off ? 'AV/0' : 'INTE verifierad'}. Kontrollera lokalt före lyft.`;
          if (phase === 'heat_to_boil') {
            if (mode === 'sparge-local-target-conflict-blocked' || controlReason.includes('positive BA heating blocked')) return 'LYFT KVITTERAT · FÖRKOKSVÄRME BLOCKERAD. RAPT:s lokala mål avviker från BA:s 95 °C eller är inte verifierat; ingen BA-värme får startas.';
            return `LYFT KVITTERAT · pumpen ska vara AV · BA förkok max ${a.preboil_target_c ?? 95} °C. Värme kräver separat övervakad BEKRÄFTA.`;
          }
          return 'Källa eller steg inte verifierat. Ingen lyftkvittens; kontrollera RAPT och BA.';
        ]]]
      styles:
        card:
          - border-radius: 16px
          - padding: 12px
        label:
          - white-space: normal
    - type: markdown
      content: >-
        {% set reason = states('sensor.brewassistant_brewzilla_control_reason') %}
        **Orsak:** {{ reason }}  
        **Värmeutnyttjande:** {{ states('number.brewzilla_heat_utilization') }} %  
        **Pumputnyttjande:** {{ states('number.brewzilla_pump_utilization') }} %  
        HA:s OFF/0-avläsning är inte ett bevis på elektrisk frånskiljning.
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: KVITTERA LYFT OCH VÖRTNIVÅ
      icon: mdi:check-decagram-outline
      show_state: false
      show_label: true
      triggers_update: all
      label: Kontrollera att maltpipan är säkert upplyft OCH att värmeelementen täcks av vört. Uppvärmning kräver separat kvittens.
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_confirm_sparge_lift
        confirmation:
          text: Har du fysiskt verifierat BÅDE att maltpipan är säkert upplyft och att vört täcker värmeelementen? Detta är inte ett bevis på elektrisk frånskiljning.
      styles:
        card:
          - display: |
              [[[
                const sw = states['switch.brewassistant_brewzilla_observe_only'];
                const orch = states['sensor.brewassistant_brewzilla_orchestration_mode'];
                return sw?.state === 'off' && orch?.attributes?.observe_only_effective === false && orch?.attributes?.hot_side_actuator_writes_allowed === true && entity?.attributes?.operator_confirmation_available === true ? 'block' : 'none';
              ]]]
          - border: 1px solid var(--warning-color)
          - padding: 12px
        label:
          - white-space: normal
          - font-size: 12px
      hold_action:
        action: more-info
