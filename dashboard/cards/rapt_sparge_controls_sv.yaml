# Beta.14: BA Sparge operator actions require observation OFF AND a rearmed backend.
# No hardcoded RCL profile-active entity; backend validates active session/step.
type: conditional
conditions:
  - entity: switch.brewassistant_brewzilla_observe_only
    state: "off"
  - entity: sensor.brewassistant_brewzilla_orchestration_mode
    state_not: observe-only
  - entity: sensor.brewassistant_brewday_runtime_source
    state: RAPT BrewZilla Profile
  - condition: or
    conditions:
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: Sparge
      - condition: state
        entity: sensor.brewassistant_brewday_runtime_step
        state: Lakning
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: RAPT · Lakning
      icon: mdi:grain
      show_state: false
      show_label: true
      triggers_update: all
      tap_action:
        action: more-info
      label: |
        [[[
          const a = entity?.attributes || {};
          const phase = String(a.phase || 'inactive');
          const off = a.outputs_confirmed_off === true;
          const heater = String(a.heater_readback ?? 'okänd').toUpperCase();
          const pump = String(a.pump_readback ?? 'okänd').toUpperCase();
          const profile = Object.values(states).find(s => s?.entity_id?.startsWith('binary_sensor.') && s?.attributes?.ba_source === 'rapt_cloud_link_brewzilla_profile_runtime' && s.state === 'on');
          if (!profile) return 'Ingen aktiv, verifierad RCL-profilsensor hittades. Ingen lyftkvittens; kontrollera RAPT lokalt.';
          if (phase === 'awaiting_lift') return `VÄNTAR PÅ LYFT · värme ${heater} · pump ${pump} · avläsning ${off ? 'OFF/0 återläst i HA' : 'INTE verifierad'}. Kontrollera fysiskt före lyft.`;
          if (phase === 'heat_to_boil') return 'LYFT KVITTERAT · pumpen ska vara AV · BA-förkoksvärme kräver separat övervakad kvittens. Kontrollera RAPT-target och effekt lokalt.';
          return 'Ingen aktuell lyftkvittens tillgänglig. Backend äger säkerhetskontrollen.';
        ]]]
      styles:
        card:
          - border-radius: 16px
          - padding: 12px
        label:
          - white-space: normal
    - type: custom:button-card
      entity: button.brewassistant_confirm_sparge_lift
      name: KVITTERA LYFT OCH VÖRTNIVÅ
      icon: mdi:check-decagram-outline
      show_state: false
      show_label: true
      triggers_update: all
      label: Kvittera endast om maltpipan är säker och vörten täcker värmeelementen. Värme kräver separat kvittens.
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_confirm_sparge_lift
        confirmation:
          text: Har du fysiskt verifierat BÅDE maltpipans lyft och vört över elementen? Detta är inte ett bevis på elektrisk frånskiljning.
      styles:
        card:
          - display: |
              [[[
                const sw = states['switch.brewassistant_brewzilla_observe_only'];
                const orch = states['sensor.brewassistant_brewzilla_orchestration_mode'];
                return sw?.state === 'off' && orch?.attributes?.observe_only_effective === false && orch?.attributes?.hot_side_actuator_writes_allowed === true && entity?.attributes?.operator_confirmation_available === true ? 'block' : 'none';
              ]]]
          - border: 1px solid var(--warning-color)
          - padding: 12px
        label:
          - white-space: normal
          - font-size: 12px
      hold_action:
        action: more-info
