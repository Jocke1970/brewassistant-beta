type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: 'on'
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewday_runtime_summary
      name: Bryggdagsruntime
      icon: |
        [[[
          const state = states['sensor.brewassistant_brewday_runtime_state']?.state ?? 'unknown';
          const stage = String(states['sensor.brewassistant_brewday_runtime_stage']?.state ?? '').toLowerCase();
          if (state === 'aborted') return 'mdi:alert-octagon-outline';
          if (state === 'paused') return 'mdi:pause-circle-outline';
          if (state === 'completed' || state === 'finished') return 'mdi:check-decagram-outline';
          if (stage.includes('mash')) return 'mdi:pot-steam-outline';
          if (stage.includes('boil')) return 'mdi:kettle-steam-outline';
          if (stage.includes('cool') || stage.includes('chill')) return 'mdi:snowflake-thermometer';
          if (state === 'running' || state === 'live') return 'mdi:play-circle-outline';
          return 'mdi:beer-outline';
        ]]]
      show_state: false
      show_label: true
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      label: |
        [[[
          function clean(v) {
            if (v === undefined || v === null) return null;
            const s = String(v);
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
          }
          function n(id) {
            const raw = states[id]?.state;
            const val = Number(String(raw ?? '').replace(',', '.'));
            return Number.isFinite(val) ? val : null;
          }
          function short(v, max = 48) {
            const s = String(v ?? '—');
            return s.length > max ? s.slice(0, max - 1) + '…' : s;
          }
          function stateLabel(v) {
            if (v === 'running' || v === 'live') return 'kör';
            if (v === 'paused') return 'pausad';
            if (v === 'completed' || v === 'finished') return 'klar';
            if (v === 'awaiting_snapshot') return 'väntar på snapshot';
            if (v === 'aborted') return 'ABORTERAD · styrning spärrad';
            if (v === 'idle') return 'vilar';
            return v;
          }

          const summary = clean(states['sensor.brewassistant_brewday_runtime_summary']?.state) || '—';
          const runtimeState = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
          const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || '—';
          const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
          const next = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
          const liveProgress = n('sensor.brewassistant_brewday_live_progress');
          const remaining = n('sensor.brewassistant_brewday_live_time_remaining_minutes');
          const stageEngine = clean(states['sensor.brewassistant_brewday_stage']?.state) || '—';
          const statusLine = clean(states['sensor.brewassistant_brewday_stage_status_line']?.state) || summary;
          const suggestedAction = clean(states['sensor.brewassistant_brewday_stage_suggested_action']?.state) || '—';
          const controlHint = clean(states['sensor.brewassistant_brewday_stage_control_hint']?.state) || '—';
          let headline = 'Bryggdag aktiv';
          let badge = 'Kör';
          let badgeIcon = 'mdi:play-circle-outline';
          let chipBg = 'rgba(76,175,80,.12)';
          let chipBorder = 'rgba(76,175,80,.24)';
          if (runtimeState === 'aborted') {
            headline = 'BRYGGDAG ABORTERAD'; badge = 'ABORT'; badgeIcon = 'mdi:alert-octagon-outline';
            chipBg = 'rgba(244,67,54,.18)'; chipBorder = 'rgba(244,67,54,.46)';
          } else if (runtimeState === 'paused') {
            headline = 'Bryggdag pausad'; badge = 'Pausad'; badgeIcon = 'mdi:pause-circle-outline';
            chipBg = 'rgba(255,193,7,.14)'; chipBorder = 'rgba(255,193,7,.28)';
          } else if (runtimeState === 'completed' || runtimeState === 'finished') {
            headline = 'Bryggdag klar'; badge = 'Klar'; badgeIcon = 'mdi:check-decagram-outline';
            chipBg = 'rgba(76,175,80,.13)'; chipBorder = 'rgba(76,175,80,.28)';
          } else if (runtimeState === 'awaiting_snapshot') {
            headline = 'Väntar på snapshot'; badge = 'Väntar'; badgeIcon = 'mdi:cloud-sync-outline';
            chipBg = 'rgba(33,150,243,.12)'; chipBorder = 'rgba(33,150,243,.24)';
          } else if (runtimeState === 'idle') {
            headline = 'Vilar'; badge = 'Vilar'; badgeIcon = 'mdi:sleep';
            chipBg = 'rgba(127,127,127,.12)'; chipBorder = 'rgba(127,127,127,.20)';
          }

          const progressMain = Number.isFinite(liveProgress) ? `${liveProgress.toFixed(0)} %` : '—';
          const remainingMain = Number.isFinite(remaining) ? `${remaining.toFixed(0)} min` : '—';
          const progressWidth = Number.isFinite(liveProgress) ? Math.max(0, Math.min(100, liveProgress)) : 0;
          const progressColor = runtimeState === 'aborted'
            ? 'rgba(244,67,54,.82)'
            : runtimeState === 'paused'
              ? 'rgba(255,193,7,.82)'
              : progressWidth >= 80
                ? 'rgba(76,175,80,.82)'
                : 'rgba(33,150,243,.82)';
          const progressDetail = Number.isFinite(liveProgress)
            ? `${progressMain} av aktuellt steg${Number.isFinite(remaining) ? ` · ${remainingMain} kvar` : ''} · ${short(step, 54)}`
            : `Förlopp saknas för aktuellt steg · ${short(step, 54)}`;
          const metric = (title, main, sub, icon, kind = 'neutral') => {
            const bg = kind === 'blue' ? 'rgba(33,150,243,.09)' : kind === 'cyan' ? 'rgba(0,188,212,.10)' : kind === 'green' ? 'rgba(76,175,80,.11)' : kind === 'yellow' ? 'rgba(255,193,7,.13)' : kind === 'red' ? 'rgba(244,67,54,.11)' : 'rgba(127,127,127,.08)';
            const border = kind === 'blue' ? 'rgba(33,150,243,.20)' : kind === 'cyan' ? 'rgba(0,188,212,.22)' : kind === 'green' ? 'rgba(76,175,80,.24)' : kind === 'yellow' ? 'rgba(255,193,7,.26)' : kind === 'red' ? 'rgba(244,67,54,.24)' : 'rgba(127,127,127,.14)';
            return `<div style="min-width:0;border-radius:13px;padding:7px 6px;background:${bg};border:1px solid ${border};display:grid;grid-template-columns:18px minmax(0,1fr);gap:5px;align-items:center;"><ha-icon icon="${icon}" style="width:15px;height:15px;opacity:.82;"></ha-icon><div style="min-width:0;text-align:center;"><div style="font-size:8.7px;font-weight:950;opacity:.55;letter-spacing:.045em;text-transform:uppercase;">${title}</div><div style="font-size:12.8px;font-weight:950;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${main}</div><div style="font-size:9px;font-weight:800;opacity:.58;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${sub}</div></div></div>`;
          };

          const statusBg = runtimeState === 'aborted' ? 'rgba(244,67,54,.12)' : 'rgba(76,175,80,.10)';
          const statusBorder = runtimeState === 'aborted' ? 'rgba(244,67,54,.32)' : 'rgba(76,175,80,.24)';
          const statusIcon = runtimeState === 'aborted' ? 'mdi:alert-octagon-outline' : 'mdi:check-circle-outline';
          const statusText = runtimeState === 'aborted' ? summary : statusLine;

          return `<div style="line-height:1.25;min-width:0;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;"><div style="min-width:0;"><div style="font-size:12px;font-weight:850;opacity:.66;">Operatörscockpit · runtime · fas · processöversikt</div><div style="font-size:12px;font-weight:850;opacity:.66;">${short(summary, 62)}</div></div><div style="display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:${chipBg};border:1px solid ${chipBorder};font-size:11px;font-weight:950;white-space:nowrap;"><ha-icon icon="${badgeIcon}" style="width:14px;height:14px;"></ha-icon><span>${badge}</span></div></div>
            <div style="margin-top:8px;text-align:center;"><div style="font-size:23px;font-weight:950;letter-spacing:-.04em;line-height:1.02;">${headline}</div><div style="margin-top:5px;font-size:12px;font-weight:800;opacity:.74;">${stateLabel(runtimeState)} · ${stage} · ${short(step, 48)}</div></div>
            <div style="margin-top:11px;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:9px;font-weight:950;letter-spacing:.06em;opacity:.58;text-transform:uppercase;"><span>Förlopp · aktuellt steg</span><span>${progressMain}</span></div>
              <div style="margin-top:5px;height:8px;border-radius:999px;background:rgba(127,127,127,.16);overflow:hidden;"><div style="width:${progressWidth}%;height:8px;border-radius:999px;background:${progressColor};transition:width .35s ease, background .35s ease;"></div></div>
              <div style="margin-top:5px;font-size:10.8px;font-weight:800;opacity:.68;text-align:center;">${progressDetail}</div>
            </div>
            <div style="margin-top:11px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;">
              ${metric('Fas', short(stage, 12), stageEngine, 'mdi:map-marker-path', 'blue')}
              ${metric('Steg', short(step, 14), 'nuvarande', 'mdi:format-list-checks', 'cyan')}
              ${metric('Nästa', short(next, 14), 'nästa', 'mdi:skip-next-circle-outline', 'neutral')}
            </div>
            <div style="margin-top:7px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;">
              ${metric('Åtgärd', short(suggestedAction, 22), 'föreslagen', 'mdi:gesture-tap-button', suggestedAction !== '—' ? 'yellow' : 'neutral')}
              ${metric('Styrning', short(controlHint, 22), 'råd', 'mdi:shield-check-outline', 'neutral')}
            </div>
            <div style="margin-top:10px;display:grid;grid-template-columns:20px minmax(0,1fr);gap:7px;align-items:center;border-radius:14px;padding:8px 9px;background:${statusBg};border:1px solid ${statusBorder};"><ha-icon icon="${statusIcon}" style="width:15px;height:15px;opacity:.76;"></ha-icon><div style="font-size:11.5px;line-height:1.25;font-weight:800;opacity:.78;text-align:left;white-space:normal;">${short(statusText, 120)}</div></div>
          </div>`;
        ]]]
      styles:
        card:
          - border-radius: 22px
          - padding: 14px
          - overflow: hidden
          - background: >-
              linear-gradient(135deg, rgba(33,150,243,.10),
              rgba(127,127,127,.035))
          - border: 1px solid rgba(33,150,243,.20)
          - box-shadow: 0 2px 10px rgba(0,0,0,.08)
        grid:
          - grid-template-areas: '"i n" "i l"'
          - grid-template-columns: 42px minmax(0,1fr)
          - grid-template-rows: min-content min-content
          - column-gap: 12px
        icon:
          - width: 27px
          - height: 27px
        img_cell:
          - width: 42px
          - height: 42px
          - border-radius: 50%
          - background: rgba(33,150,243,.15)
          - color: rgb(33,150,243)
        name:
          - justify-self: start
          - align-self: end
          - font-size: 15px
          - font-weight: 950
        label:
          - justify-self: stretch
          - text-align: left
          - white-space: normal
          - margin-top: 4px
    - type: vertical-stack
      cards:
        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
              state: 'on'
          card:
            type: custom:button-card
            entity: button.brewassistant_mash_in_complete
            name: Inmäskning startad · vänta på BF FORTSÄTT
            icon: mdi:barley
            show_state: false
            show_label: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.brewassistant_mash_in_complete
              confirmation:
                text: >-
                  Manuell reservväg. I normalflödet trycker du FORTSÄTT i
                  Brewfather när inmäskningen är klar. BA väntar på verklig
                  BF-progression och markerar inmäskningen klar automatiskt. Använd denna knapp
                  bara om BF inte triggar.
            hold_action:
              action: more-info
            label: |
              [[[
                const pending = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                const target = pending?.attributes?.last_target ?? '—';
                const step = pending?.attributes?.last_step ?? 'Mash-in';
                const button = states['button.brewassistant_mash_in_complete'];
                const buttonState = button ? 'reservknapp redo' : 'knapp saknas';
                return `${step} · mål ${target} °C<br>Primärt: tryck FORTSÄTT i Brewfather. BA slutför inmäskningen och startar pump/cirkulation automatiskt.<br>Manuell reservväg: ${buttonState}`;
              ]]]
            styles:
              card:
                - min-height: 88px
                - padding: 12px
                - border-radius: 16px
                - background: rgba(255,193,7,.12)
                - border: 1px solid rgba(255,193,7,.42)
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 34px minmax(0,1fr)
                - column-gap: 10px
              icon:
                - width: 23px
                - color: rgb(255,193,7)
              name:
                - justify-self: start
                - font-size: 13px
                - font-weight: 950
              label:
                - justify-self: start
                - text-align: left
                - white-space: normal
                - font-size: 10.7px
                - font-weight: 760
                - line-height: 1.22
                - opacity: 0.82
        - type: custom:button-card
          entity: button.brewassistant_start_mash_circulation
          name: Starta mäskcirkulation
          icon: mdi:pump
          show_state: false
          show_label: true
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.brewassistant_start_mash_circulation
          hold_action:
            action: more-info
          label: |
            [[[
              const pump = states['switch.brewzilla_pump']?.state ?? '—';
              const util = states['number.brewzilla_pump_utilization']?.state ?? '—';
              const button = states['button.brewassistant_start_mash_circulation'];
              const buttonState = button ? 'knapp redo' : 'knapp saknas';
              return `Pump ${pump} · utnyttjande ${util} %<br>Visas endast i aktiv Mash efter avslutad inmäskning, när pumpen är OFF/0 · ${buttonState}`;
            ]]]
          styles:
            card:
              - display: |
                  [[[
                    const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    const pending = gate?.state === 'on';
                    const gateState = gate?.attributes?.state || '';
                    const completed = gate?.attributes?.completed_once === true || gateState === 'mash_in_complete' || !!gate?.attributes?.confirmed_at;

                    const runtimeState = String(states['sensor.brewassistant_brewday_runtime_state']?.state ?? '').toLowerCase();
                    const runtimeStage = String(states['sensor.brewassistant_brewday_runtime_stage']?.state ?? '').toLowerCase();
                    const activeMash = ['running','live','paused','awaiting_confirm','awaiting_snapshot'].includes(runtimeState)
                      && runtimeStage.includes('mash');

                    const pumpOn = states['switch.brewzilla_pump']?.state === 'on';
                    const utilRaw = states['number.brewzilla_pump_utilization']?.state;
                    const util = Number.parseFloat(utilRaw);
                    const pumpStopped = !pumpOn && !Number.isNaN(util) && util <= 0.1;

                    return (!pending && completed && activeMash && pumpStopped) ? 'block' : 'none';
                  ]]]
              - min-height: 72px
              - padding: 11px
              - border-radius: 16px
              - background: rgba(33,150,243,.10)
              - border: 1px solid rgba(33,150,243,.28)
            grid:
              - grid-template-areas: '"i n" "i l"'
              - grid-template-columns: 34px minmax(0,1fr)
              - column-gap: 10px
            icon:
              - width: 22px
              - color: rgb(33,150,243)
            name:
              - justify-self: start
              - font-size: 13px
              - font-weight: 950
            label:
              - justify-self: start
              - text-align: left
              - white-space: normal
              - font-size: 10.7px
              - font-weight: 760
              - line-height: 1.22
              - opacity: 0.78
    - type: conditional
      conditions:
        - condition: or
          conditions:
            - condition: state
              entity: sensor.brewassistant_brewfather_batch_phase
              state: planning
            - condition: state
              entity: sensor.brewassistant_brewfather_batch_phase
              state: brewing
      card:
        type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.brewassistant_brewday_runtime_summary
            name: BrewTracker-runtime
            icon: mdi:timer-play-outline
            show_state: false
            show_label: true
            triggers_update:
              - sensor.brewassistant_brewfather_batch_phase
              - sensor.brewassistant_brewday_runtime_summary
              - sensor.brewassistant_brewday_runtime_state
              - sensor.brewassistant_brewday_runtime_status
              - sensor.brewassistant_brewday_runtime_stage
              - sensor.brewassistant_brewday_runtime_step
              - sensor.brewassistant_brewday_runtime_next_step
              - sensor.brewassistant_brewday_live_progress
              - sensor.brewassistant_brewday_live_time_remaining_minutes
              - sensor.brewassistant_brewday_snapshot_age_minutes
              - sensor.brewassistant_brewday_target_temperature
              - sensor.brewfather_brew_tracker_status
              - sensor.brewassistant_brewzilla_control_reason
            tap_action:
              action: more-info
            hold_action:
              action: call-service
              service: brewassistant.force_brewfather_refresh
            label: |
              [[[
                const clean = (v) => {
                  if (v === undefined || v === null) return null;
                  const s = String(v);
                  return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
                };
                const num = (id) => {
                  const n = Number(String(states[id]?.state ?? '').replace(',', '.'));
                  return Number.isFinite(n) ? n : null;
                };
                const attrNum = (attrs, key) => {
                  const n = Number(String(attrs?.[key] ?? '').replace(',', '.'));
                  return Number.isFinite(n) ? n : null;
                };
                const boolish = (v) => {
                  const s = String(v ?? '').toLowerCase();
                  return v === true || ['on','true','yes','1'].includes(s);
                };
                const fmt = (n, u = '', d = 1) => Number.isFinite(n) ? `${n.toFixed(d)}${u ? ' ' + u : ''}` : '—';
                const short = (v, m = 56) => String(v ?? '—').length > m ? String(v ?? '—').slice(0, m - 1) + '…' : String(v ?? '—');

                const phase = clean(states['sensor.brewassistant_brewfather_batch_phase']?.state) || 'inactive';
                const bfEntity = states['sensor.brewfather_brew_tracker_status'];
                const bfStatus = clean(bfEntity?.state) || 'inactive';
                const runtime = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
                const status = clean(states['sensor.brewassistant_brewday_runtime_status']?.state) || runtime;
                const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || '—';
                const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
                const next = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
                const progress = num('sensor.brewassistant_brewday_live_progress');
                const remaining = num('sensor.brewassistant_brewday_live_time_remaining_minutes');
                const age = num('sensor.brewassistant_brewday_snapshot_age_minutes');
                const target = num('sensor.brewassistant_brewday_target_temperature');
                const progressWidth = Number.isFinite(progress) ? Math.max(0, Math.min(100, progress)) : 0;

                const planning = phase === 'planning';
                const prestart = phase === 'brewing' && runtime === 'idle' && String(bfStatus).toLowerCase() === 'paused';

                const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                const cleanHeat = boolish(oz.clean_heat_strike_active);
                const heatLatch = boolish(oz.heat_strike_latch_active);
                const physicalPhase = clean(oz.advice_physical_phase) || '';
                const mashGateState = clean(oz.mash_in_gate_state) || 'idle';
                const preMashHeatstrike = !planning && !prestart && (cleanHeat || (heatLatch && String(physicalPhase).startsWith('pre_mash_in')));
                const strikeTarget = attrNum(oz, 'heat_strike_target') ?? attrNum(oz, 'heat_strike_clean_control_target') ?? target;
                const gateTemp = attrNum(oz, 'clean_heat_strike_gate_temperature');
                const gateDelta = attrNum(oz, 'clean_heat_strike_gate_delta_to_target');
                const safetyTemp = attrNum(oz, 'clean_heat_strike_safety_temperature');
                const heat = attrNum(oz, 'desired_heat_utilization');
                const pump = attrNum(oz, 'desired_pump_utilization');

                let statusText;
                let activeTitle;
                let activeSub;
                let nextBox;

                if (planning) {
                  statusText = 'PLANNING · Brewfather ansluten · BrewTracker ännu inte startad';
                  activeTitle = 'BrewTracker redo';
                  activeSub = 'Recept/batch är förberedd · ingen hot-side ownership';
                  nextBox = 'Nästa: sätt batchen till Brewing. BrewAssistant tar fortfarande inte över förrän BrewTracker faktiskt startas med Play.';
                } else if (prestart) {
                  statusText = 'BREWING · PAUSAD PÅ START · väntar på Play';
                  activeTitle = 'Väntar på BrewTracker Play';
                  activeSub = 'Batchfasen är Brewing, men BrewAssistant äger inte hot-side ännu.';
                  nextBox = 'Nästa: tryck Play / Starta mäsktimer i Brewfather. Först då får BrewTracker hot-side ownership.';
                } else if (preMashHeatstrike) {
                  statusText = `BF ${bfStatus} · BA styr fysisk heatstrike`;
                  activeTitle = `BA Heatstrike ${fmt(strikeTarget, '°C')}`;
                  activeSub = `Mash/BLE-gate ${fmt(gateTemp, '°C')} · Δ ${fmt(gateDelta, '°C')} · vörtsäkerhet ${fmt(safetyTemp, '°C')}`;
                  nextBox = `Fysiskt nästa: nå strike → inmäskning → BF FORTSÄTT efter inmäskning`;
                } else {
                  const paused = String(bfStatus).toLowerCase() === 'paused' || String(status).toLowerCase() === 'paused';
                  statusText = paused ? 'PAUSAD · väntar på operatör/BF FORTSÄTT' : `BF ${bfStatus} · ${runtime} / ${status} · ${stage}`;
                  activeTitle = short(step, 64);
                  activeSub = `Nuvarande steg · ${fmt(progress, '%', 0)} · ${fmt(remaining, 'min', 0)} kvar`;
                  nextBox = `Nästa: ${short(next, 72)}`;
                }

                const phaseLabel = planning ? 'planning' : prestart ? 'pre-start' : phase;
                const chipBg = planning
                  ? 'rgba(255,193,7,.13)'
                  : prestart
                    ? 'rgba(76,175,80,.22)'
                    : phase === 'brewing'
                      ? 'rgba(244,67,54,.22)'
                      : 'rgba(33,150,243,.11)';
                const chipBorder = planning
                  ? 'rgba(255,193,7,.28)'
                  : prestart
                    ? 'rgba(76,175,80,.50)'
                    : phase === 'brewing'
                      ? 'rgba(244,67,54,.50)'
                      : 'rgba(33,150,243,.24)';
                const fourthMain = preMashHeatstrike ? fmt(pump, '%', 0) : fmt(age, 'min');
                const fourthLabel = preMashHeatstrike ? 'pumpblandning' : 'snapshot';

                return `<div style="line-height:1.25;min-width:0;">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
                    <div style="min-width:0;"><div style="font-size:11px;font-weight:900;letter-spacing:.06em;opacity:.62;text-transform:uppercase;">BrewTracker · bryggdag</div><div style="margin-top:3px;font-size:11px;font-weight:850;opacity:.72;">${statusText}</div></div>
