type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: custom:button-card
  entity: sensor.brewassistant_brewday_runtime_summary
  name: Brewday
  icon: |
    [[[
      const state = states['sensor.brewassistant_brewday_runtime_state']?.state ?? 'unknown';
      const stage = String(states['sensor.brewassistant_brewday_runtime_stage']?.state ?? '').toLowerCase();
      if (state === 'aborted') return 'mdi:alert-octagon-outline';
      if (state === 'paused') return 'mdi:pause-circle-outline';
      if (state === 'completed' || state === 'finished') return 'mdi:check-decagram-outline';
      if (stage.includes('mash')) return 'mdi:pot-steam-outline';
      if (stage.includes('boil')) return 'mdi:kettle-steam-outline';
      if (stage.includes('cool') || stage.includes('chill')) return 'mdi:snowflake-thermometer';
      if (state === 'running' || state === 'live') return 'mdi:play-circle-outline';
      return 'mdi:beer-outline';
    ]]]
  show_state: false
  show_label: true
  triggers_update:
    - sensor.brewassistant_brewday_runtime_summary
    - sensor.brewassistant_brewday_runtime_source
    - sensor.brewassistant_brewday_runtime_state
    - sensor.brewassistant_brewday_runtime_stage
    - sensor.brewassistant_brewday_runtime_step
    - sensor.brewassistant_brewday_runtime_next_step
    - sensor.brewassistant_brewday_live_progress
    - sensor.brewassistant_brewday_live_time_remaining_minutes
    - sensor.brewassistant_brewday_stage_suggested_action
    - sensor.brewassistant_brewday_stage_control_hint
    - binary_sensor.brewzilla_profile_active
  tap_action:
    action: more-info
  hold_action:
    action: more-info
  label: |
    [[[
      const clean = (v) => {
        if (v === undefined || v === null) return null;
        const s = String(v);
        return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
      };
      const num = (id) => {
        const n = Number(String(states[id]?.state ?? '').replace(',', '.'));
        return Number.isFinite(n) ? n : null;
      };
      const short = (v, max = 54) => {
        const s = String(v ?? '—');
        return s.length > max ? s.slice(0, max - 1) + '…' : s;
      };
      const source = clean(states['sensor.brewassistant_brewday_runtime_source']?.state) || 'None';
      const state = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
      const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || '—';
      const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
      const next = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
      const progress = num('sensor.brewassistant_brewday_live_progress');
      const remaining = num('sensor.brewassistant_brewday_live_time_remaining_minutes');
      const action = clean(states['sensor.brewassistant_brewday_stage_suggested_action']?.state) || '—';
      const control = clean(states['sensor.brewassistant_brewday_stage_control_hint']?.state) || '—';
      const rapt = states['binary_sensor.brewzilla_profile_active'];
      const raptObserved = rapt?.state === 'on' && rapt?.attributes?.ba_source === 'rapt_cloud_link_brewzilla_profile_runtime';
      const lockedRapt = state === 'aborted' && source === 'None' && raptObserved;
      const sourceIsRapt = source === 'RAPT BrewZilla Profile' || lockedRapt;

      const sourceLabel = lockedRapt
        ? 'RAPT PROFILE · OBSERVERAD'
        : source === 'RAPT BrewZilla Profile'
          ? 'RAPT PROFILE'
          : source === 'Brewfather Brew Tracker'
            ? 'BREWTRACKER'
            : source === 'Manual Brewday'
              ? 'MANUAL'
              : 'INGEN KÄLLA';
      const sourceIcon = sourceIsRapt
        ? 'mdi:playlist-play'
        : source === 'Brewfather Brew Tracker'
          ? 'mdi:timer-play-outline'
          : source === 'Manual Brewday'
            ? 'mdi:hand-back-right-outline'
            : 'mdi:minus-circle-outline';
      const baLabel = state === 'aborted' ? 'BREWASSISTANT LÅST' : 'BREWASSISTANT';
      const chip = (text, icon, bg, border) => `<span style="display:inline-flex;align-items:center;gap:4px;padding:5px 7px;border-radius:999px;background:${bg};border:1px solid ${border};font-size:9.5px;font-weight:950;white-space:nowrap;"><ha-icon icon="${icon}" style="width:12px;height:12px;"></ha-icon>${text}</span>`;

      let headline = 'Bryggdag aktiv';
      let badge = 'Kör';
      let badgeBg = 'rgba(76,175,80,.12)';
      let badgeBorder = 'rgba(76,175,80,.26)';
      if (state === 'aborted') {
        headline = 'BRYGGDAG ABORTERAD'; badge = 'ABORT'; badgeBg = 'rgba(244,67,54,.18)'; badgeBorder = 'rgba(244,67,54,.46)';
      } else if (state === 'paused') {
        headline = 'Bryggdag pausad'; badge = 'Pausad'; badgeBg = 'rgba(255,193,7,.14)'; badgeBorder = 'rgba(255,193,7,.30)';
      } else if (state === 'completed' || state === 'finished') {
        headline = 'Bryggdag klar'; badge = 'Klar';
      } else if (state === 'awaiting_snapshot') {
        headline = 'Väntar på snapshot'; badge = 'Väntar'; badgeBg = 'rgba(33,150,243,.12)'; badgeBorder = 'rgba(33,150,243,.26)';
      } else if (state === 'source_unavailable') {
        headline = 'Processkälla saknas'; badge = 'KÄLLA SAKNAS'; badgeBg = 'rgba(244,67,54,.15)'; badgeBorder = 'rgba(244,67,54,.36)';
      } else if (state === 'inactive') {
        headline = 'Processkälla stoppad'; badge = 'Stoppad'; badgeBg = 'rgba(127,127,127,.12)'; badgeBorder = 'rgba(127,127,127,.22)';
      } else if (state === 'idle') {
        headline = 'Vilar'; badge = 'Vilar'; badgeBg = 'rgba(127,127,127,.12)'; badgeBorder = 'rgba(127,127,127,.22)';
      }

      const pct = Number.isFinite(progress) ? `${progress.toFixed(0)} %` : '—';
      const rem = Number.isFinite(remaining) ? `${remaining.toFixed(0)} min` : '—';
      const sourceNote = lockedRapt ? '<br>RAPT-profil observerad · BA:s styrspärr är fortfarande aktiv' : '';
      const metric = (title, main, sub) => `<div style="min-width:0;border-radius:12px;padding:7px 5px;background:rgba(127,127,127,.07);border:1px solid rgba(127,127,127,.14);text-align:center;"><div style="font-size:8.5px;font-weight:950;opacity:.55;text-transform:uppercase;">${title}</div><div style="font-size:11.5px;font-weight:950;line-height:1.12;white-space:normal;overflow-wrap:anywhere;">${main}</div><div style="font-size:9px;font-weight:780;opacity:.58;margin-top:2px;">${sub}</div></div>`;

      return `<div style="line-height:1.25;min-width:0;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;"><div style="font-size:11px;font-weight:850;opacity:.64;">Översikt · processkälla · runtime</div><div style="padding:5px 8px;border-radius:999px;background:${badgeBg};border:1px solid ${badgeBorder};font-size:10px;font-weight:950;white-space:nowrap;">${badge}</div></div>
        <div style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;">${chip(sourceLabel,sourceIcon,sourceIsRapt ? 'rgba(156,39,176,.10)' : 'rgba(33,150,243,.09)',sourceIsRapt ? 'rgba(156,39,176,.25)' : 'rgba(33,150,243,.21)')}<span style="opacity:.45;">→</span>${chip(baLabel,'mdi:brain',state === 'aborted' ? 'rgba(244,67,54,.10)' : 'rgba(33,150,243,.09)',state === 'aborted' ? 'rgba(244,67,54,.25)' : 'rgba(33,150,243,.21)')}<span style="opacity:.45;">→</span>${chip('RCL','mdi:cloud-sync-outline','rgba(0,188,212,.08)','rgba(0,188,212,.20)')}<span style="opacity:.45;">→</span>${chip('BREWZILLA','mdi:kettle-steam-outline','rgba(76,175,80,.08)','rgba(76,175,80,.20)')}</div>
        <div style="margin-top:9px;text-align:center;"><div style="font-size:22px;font-weight:950;letter-spacing:-.035em;">${headline}</div><div style="margin-top:4px;font-size:11.5px;font-weight:800;opacity:.72;">${stage} · ${short(step)}<br>nästa: ${short(next, 64)}${sourceNote}</div></div>
        <div style="margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;">${metric('Fas',stage,'nu')}${metric('Förlopp',pct,rem + ' kvar')}${metric('Åtgärd',short(action,24),'föreslagen')}${metric('Styrning',short(control,24),'råd')}</div>
      </div>`;
    ]]]
  styles:
    card:
      - border-radius: 22px
      - padding: 14px
      - overflow: hidden
      - background: linear-gradient(135deg, rgba(33,150,243,.10), rgba(127,127,127,.035))
      - border: 1px solid rgba(33,150,243,.20)
      - box-shadow: 0 2px 10px rgba(0,0,0,.08)
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 42px minmax(0,1fr)
      - column-gap: 12px
    icon:
      - width: 27px
      - height: 27px
    img_cell:
      - width: 42px
      - height: 42px
      - border-radius: 50%
      - background: rgba(33,150,243,.15)
      - color: rgb(33,150,243)
    name:
      - justify-self: start
      - font-size: 15px
      - font-weight: 950
    label:
      - justify-self: stretch
      - text-align: left
      - white-space: normal
      - margin-top: 4px
