    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewday_runtime_source
          state: RAPT BrewZilla Profile
      card:
        type: custom:button-card
        entity: binary_sensor.brewzilla_profile_active
        name: RAPT Profile Runtime
        icon: mdi:playlist-play
        show_state: false
        show_label: true
        tap_action:
          action: more-info
        triggers_update:
          - binary_sensor.brewzilla_profile_active
          - sensor.brewassistant_brewday_runtime_source
          - sensor.brewassistant_brewday_runtime_state
          - sensor.brewassistant_brewday_runtime_stage
          - sensor.brewassistant_brewday_runtime_step
          - sensor.brewassistant_brewday_runtime_next_step
          - sensor.brewassistant_brewday_target_temperature
          - sensor.brewassistant_brewday_snapshot_age_minutes
          - sensor.brewassistant_brewzilla_control_reason
        label: |
          [[[
            const clean = (v) => {
              if (v === undefined || v === null) return null;
              const s = String(v);
              return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
            };
            const num = (v) => {
              const n = Number(String(v ?? '').replace(',', '.'));
              return Number.isFinite(n) ? n : null;
            };
            const fmtTemp = (v) => {
              const n = num(v);
              return n === null ? '—' : `${n.toFixed(1)} °C`;
            };
            const short = (v, m = 52) => {
              const s = String(v ?? '—');
              return s.length > m ? `${s.slice(0, m - 1)}…` : s;
            };

            const a = states['binary_sensor.brewzilla_profile_active']?.attributes || {};
            const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
            const runtimeState = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
            const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || '—';
            const runtimeStep = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
            const nextRuntime = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
            const baTarget = num(states['sensor.brewassistant_brewday_target_temperature']?.state);
            const age = num(states['sensor.brewassistant_brewday_snapshot_age_minutes']?.state);

            const profile = clean(a.profile_name) || 'RAPT BrewZilla Profile';
            const stepName = clean(a.step_name) || runtimeStep;
            const stepNo = num(a.step_number);
            const stepCount = num(a.step_count);
            const rawTarget = num(a.step_target_temperature);
            const nextName = clean(a.next_step_name) || nextRuntime;
            const nextTarget = num(a.next_step_target_temperature);
            const endType = clean(a.step_end_type) || '—';
            const durationType = clean(a.step_duration_type) || '—';
            const length = num(a.step_length);
            const gate = String(oz.mash_in_gate_state || 'idle').toLowerCase();
            const manual = String(endType).toLowerCase() === 'manual';
            const cooling = String(stage).toLowerCase().includes('cool') || String(stepName).toLowerCase().includes('chill');
            const hold = oz.rapt_mash_in_strike_hold_active === true;

            let statusText = 'RAPT supplies process directives · BrewAssistant controls target/heat/pump';
            let actionText = manual
              ? 'RAPT is waiting for a manual button press on BrewZilla.'
              : `Next: ${short(nextName, 62)}${nextTarget !== null ? ` · ${fmtTemp(nextTarget)}` : ''}`;
            const badge = runtimeState === 'source_unavailable' ? 'SOURCE LOST' : runtimeState === 'inactive' ? 'STOPPED' : 'RAPT → BA';
            const badgeBg = runtimeState === 'source_unavailable' ? 'rgba(244,67,54,.16)' : 'rgba(156,39,176,.13)';
            const badgeBorder = runtimeState === 'source_unavailable' ? 'rgba(244,67,54,.38)' : 'rgba(156,39,176,.30)';

            if (String(stepName).toLowerCase().includes('mash in')) {
              if (gate === 'ready_for_mash_in') {
                actionText = 'Strike ready · press MASH-IN STARTED in BrewAssistant when grain addition begins.';
              } else if (gate === 'mash_in_started') {
                actionText = 'Mash-in in progress · BA uses the mash target but keeps the pump paused until MASH-IN COMPLETE.';
              } else if (gate === 'mash_in_complete') {
                actionText = 'BA mash-in is complete · continue the manual RAPT step on BrewZilla to Mash Rest.';
              }
            }

            if (hold) {
              statusText = `RAPT advanced to Mash In (${fmtTemp(rawTarget)}) · BA is still holding strike ${fmtTemp(baTarget)}`;
            }

            if (cooling) {
              statusText = `ChillOut is a process marker · RAPT target ${fmtTemp(rawTarget)} is not sent as a hot-side target`;
              actionText = 'BA stops heat/heat utilization and releases BrewZilla pump ownership to Cooling Runtime/operator.';
            }

            const duration = length !== null ? `${length.toFixed(0)} min` : '—';
            const stepIndex = stepNo !== null && stepCount !== null ? `${stepNo.toFixed(0)}/${stepCount.toFixed(0)}` : '—';
            const timerText = String(endType).toLowerCase() === 'duration'
              ? `${duration} · timer ${String(durationType).toLowerCase() === 'target' ? 'from target' : durationType}`
              : endType;

            return `<div style="line-height:1.25;min-width:0;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;"><div style="min-width:0;"><div style="font-size:10px;font-weight:950;letter-spacing:.07em;opacity:.60;text-transform:uppercase;">RAPT · process source</div><div style="margin-top:2px;font-size:17px;font-weight:950;letter-spacing:-.025em;">${short(profile, 58)}</div></div><div style="padding:6px 9px;border-radius:999px;background:${badgeBg};border:1px solid ${badgeBorder};font-size:10px;font-weight:950;white-space:nowrap;">${badge}</div></div>
              <div style="margin-top:10px;text-align:center;"><div style="font-size:10px;font-weight:950;letter-spacing:.07em;opacity:.58;text-transform:uppercase;">ACTIVE DIRECTIVE</div><div style="margin-top:3px;font-size:23px;font-weight:950;letter-spacing:-.035em;">${short(stepName, 54)}</div><div style="margin-top:4px;font-size:11.5px;font-weight:800;opacity:.70;">${statusText}</div></div>
              <div style="margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;"><div style="padding:7px 4px;border-radius:13px;background:rgba(156,39,176,.08);border:1px solid rgba(156,39,176,.20);text-align:center;"><b>${fmtTemp(rawTarget)}</b><br><span style="font-size:9px;opacity:.62;">RAPT target</span></div><div style="padding:7px 4px;border-radius:13px;background:rgba(33,150,243,.08);border:1px solid rgba(33,150,243,.20);text-align:center;"><b>${fmtTemp(baTarget)}</b><br><span style="font-size:9px;opacity:.62;">BA target</span></div><div style="padding:7px 4px;border-radius:13px;background:rgba(0,188,212,.08);border:1px solid rgba(0,188,212,.20);text-align:center;"><b>${stepIndex}</b><br><span style="font-size:9px;opacity:.62;">profile step</span></div><div style="padding:7px 4px;border-radius:13px;background:rgba(127,127,127,.07);border:1px solid rgba(127,127,127,.14);text-align:center;"><b>${age !== null ? `${age.toFixed(1)} min` : '—'}</b><br><span style="font-size:9px;opacity:.62;">snapshot</span></div></div>
              <div style="margin-top:8px;padding:8px 9px;border-radius:13px;background:${manual || cooling ? 'rgba(255,193,7,.10)' : 'rgba(127,127,127,.055)'};border:1px solid ${manual || cooling ? 'rgba(255,193,7,.28)' : 'rgba(127,127,127,.13)'};font-size:11.2px;font-weight:820;text-align:center;">${actionText}</div>
              <div style="margin-top:7px;font-size:9.8px;font-weight:780;opacity:.58;text-align:center;">End condition: ${timerText} · control ${clean(a.step_control_type) || '—'} · BA does not follow RAPT heat/pump utilization</div>
            </div>`;
          ]]]
        styles:
          card:
            - border-radius: 22px
            - padding: 14px
            - background: >-
                linear-gradient(135deg, rgba(156,39,176,.10),
                rgba(33,150,243,.035))
            - border: 1px solid rgba(156,39,176,.22)
            - box-shadow: 0 2px 10px rgba(0,0,0,.08)
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 42px minmax(0,1fr)
            - column-gap: 12px
          icon:
            - width: 27px
            - height: 27px
            - color: rgb(156,39,176)
          img_cell:
            - width: 42px
            - height: 42px
            - border-radius: 50%
            - background: rgba(156,39,176,.13)
          name:
            - justify-self: start
            - font-size: 15px
            - font-weight: 950
          label:
            - justify-self: stretch
            - text-align: left
            - white-space: normal
            - margin-top: 4px

    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewday_runtime_source
          state_not: RAPT BrewZilla Profile
        - condition: or
          conditions:
            - condition: state
              entity: sensor.brewassistant_brewfather_batch_phase
              state: planning
            - condition: state
              entity: sensor.brewassistant_brewfather_batch_phase
              state: brewing
      card:
        type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.brewassistant_brewday_runtime_summary
            name: BrewTracker Runtime
            icon: mdi:timer-play-outline
            show_state: false
            show_label: true
            triggers_update:
              - sensor.brewassistant_brewfather_batch_phase
              - sensor.brewassistant_brewday_runtime_source
              - sensor.brewassistant_brewday_runtime_summary
              - sensor.brewassistant_brewday_runtime_state
              - sensor.brewassistant_brewday_runtime_status
              - sensor.brewassistant_brewday_runtime_stage
              - sensor.brewassistant_brewday_runtime_step
              - sensor.brewassistant_brewday_runtime_next_step
              - sensor.brewassistant_brewday_live_progress
              - sensor.brewassistant_brewday_live_time_remaining_minutes
              - sensor.brewassistant_brewday_snapshot_age_minutes
              - sensor.brewassistant_brewday_target_temperature
              - sensor.brewfather_brew_tracker_status
              - sensor.brewassistant_brewzilla_control_reason
            tap_action:
              action: more-info
            hold_action:
              action: call-service
              service: brewassistant.force_brewfather_refresh
            label: |
              [[[
                const clean = (v) => {
                  if (v === undefined || v === null) return null;
                  const s = String(v);
                  return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
                };
                const num = (id) => {
                  const n = Number(String(states[id]?.state ?? '').replace(',', '.'));
                  return Number.isFinite(n) ? n : null;
                };
                const attrNum = (attrs, key) => {
                  const n = Number(String(attrs?.[key] ?? '').replace(',', '.'));
                  return Number.isFinite(n) ? n : null;
                };
                const boolish = (v) => {
                  const s = String(v ?? '').toLowerCase();
                  return v === true || ['on','true','yes','1'].includes(s);
                };
                const fmt = (n, u = '', d = 1) => Number.isFinite(n) ? `${n.toFixed(d)}${u ? ' ' + u : ''}` : '—';
                const short = (v, m = 56) => String(v ?? '—').length > m ? String(v ?? '—').slice(0, m - 1) + '…' : String(v ?? '—');

                const phase = clean(states['sensor.brewassistant_brewfather_batch_phase']?.state) || 'inactive';
                const bfEntity = states['sensor.brewfather_brew_tracker_status'];
                const bfStatus = clean(bfEntity?.state) || 'inactive';
                const runtime = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
                const status = clean(states['sensor.brewassistant_brewday_runtime_status']?.state) || runtime;
                const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || '—';
                const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
                const next = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
                const progress = num('sensor.brewassistant_brewday_live_progress');
                const remaining = num('sensor.brewassistant_brewday_live_time_remaining_minutes');
                const age = num('sensor.brewassistant_brewday_snapshot_age_minutes');
                const target = num('sensor.brewassistant_brewday_target_temperature');
                const progressWidth = Number.isFinite(progress) ? Math.max(0, Math.min(100, progress)) : 0;

                const planning = phase === 'planning';
                const prestart = phase === 'brewing' && runtime === 'idle' && String(bfStatus).toLowerCase() === 'paused';

                const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                const cleanHeat = boolish(oz.clean_heat_strike_active);
                const heatLatch = boolish(oz.heat_strike_latch_active);
                const physicalPhase = clean(oz.advice_physical_phase) || '';
                const mashGateState = clean(oz.mash_in_gate_state) || 'idle';
                const preMashHeatstrike = !planning && !prestart && (cleanHeat || (heatLatch && String(physicalPhase).startsWith('pre_mash_in')));
                const strikeTarget = attrNum(oz, 'heat_strike_target') ?? attrNum(oz, 'heat_strike_clean_control_target') ?? target;
                const gateTemp = attrNum(oz, 'clean_heat_strike_gate_temperature');
                const gateDelta = attrNum(oz, 'clean_heat_strike_gate_delta_to_target');
                const safetyTemp = attrNum(oz, 'clean_heat_strike_safety_temperature');
                const heat = attrNum(oz, 'desired_heat_utilization');
                const pump = attrNum(oz, 'desired_pump_utilization');

                let statusText;
                let activeTitle;
                let activeSub;
                let nextBox;

                if (planning) {
                  statusText = 'PLANNING · Brewfather connected · BrewTracker not started yet';
                  activeTitle = 'BrewTracker ready';
                  activeSub = 'Recipe/batch prepared · no hot-side ownership';
                  nextBox = 'Next: move the batch to Brewing. BrewAssistant still does not take over until BrewTracker is actually started with Play.';
                } else if (prestart) {
                  statusText = 'BREWING · PAUSED AT START · waiting for Play';
                  activeTitle = 'Waiting for BrewTracker Play';
                  activeSub = 'Batch phase is Brewing, but BrewAssistant does not own hot-side yet.';
                  nextBox = 'Next: press Play / Start mash timer in Brewfather. Only then does BrewTracker get hot-side ownership.';
                } else if (preMashHeatstrike) {
                  statusText = `BF ${bfStatus} · BA controls physical heat strike`;
                  activeTitle = `BA Heat strike ${fmt(strikeTarget, '°C')}`;
                  activeSub = `Mash/BLE gate ${fmt(gateTemp, '°C')} · Δ ${fmt(gateDelta, '°C')} · wort safety ${fmt(safetyTemp, '°C')}`;
                  nextBox = `Physical next: reach strike → mash in → BF CONTINUE after mash-in`;
                } else {
                  const paused = String(bfStatus).toLowerCase() === 'paused' || String(status).toLowerCase() === 'paused';
                  statusText = paused ? 'PAUSED · waiting for operator/BF CONTINUE' : `BF ${bfStatus} · ${runtime} / ${status} · ${stage}`;
                  activeTitle = short(step, 64);
                  activeSub = `Current step · ${fmt(progress, '%', 0)} · ${fmt(remaining, 'min', 0)} remaining`;
                  nextBox = `Next: ${short(next, 72)}`;
                }

                const phaseLabel = planning ? 'planning' : prestart ? 'pre-start' : phase;
                const chipBg = planning
                  ? 'rgba(255,193,7,.13)'
                  : prestart
                    ? 'rgba(76,175,80,.22)'
                    : phase === 'brewing'
                      ? 'rgba(244,67,54,.22)'
                      : 'rgba(33,150,243,.11)';
                const chipBorder = planning
                  ? 'rgba(255,193,7,.28)'
                  : prestart
                    ? 'rgba(76,175,80,.50)'
                    : phase === 'brewing'
                      ? 'rgba(244,67,54,.50)'
                      : 'rgba(33,150,243,.24)';
                const fourthMain = preMashHeatstrike ? fmt(pump, '%', 0) : fmt(age, 'min');
                const fourthLabel = preMashHeatstrike ? 'pump mix' : 'snapshot';

                return `<div style="line-height:1.25;min-width:0;">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
                    <div style="min-width:0;"><div style="font-size:11px;font-weight:900;letter-spacing:.06em;opacity:.62;text-transform:uppercase;">BrewTracker · process source · BT → BA</div><div style="margin-top:3px;font-size:11px;font-weight:850;opacity:.72;">${statusText}</div></div>
                    <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:${chipBg};border:1px solid ${chipBorder};font-size:11px;font-weight:950;white-space:nowrap;"><ha-icon icon="${planning || prestart ? 'mdi:timer-sand' : 'mdi:timer-play-outline'}" style="width:14px;height:14px;"></ha-icon><span>${phaseLabel}</span></div>
                  </div>
                  <div style="margin-top:10px;font-size:10px;font-weight:950;letter-spacing:.08em;opacity:.70;text-align:center;text-transform:uppercase;">ACTIVE NOW</div>
                  <div style="margin-top:3px;font-size:24px;font-weight:950;letter-spacing:-.04em;text-align:center;">${activeTitle}</div>
                  <div style="margin:10px auto 0;max-width:320px;height:7px;border-radius:999px;background:rgba(127,127,127,.18);overflow:hidden;"><div style="width:${planning || prestart ? 0 : progressWidth}%;height:7px;border-radius:999px;background:rgba(33,150,243,.78);"></div></div>
                  <div style="margin-top:7px;font-size:12px;font-weight:800;opacity:.72;text-align:center;">${activeSub}</div>
                  <div style="margin-top:8px;border-radius:14px;padding:8px;background:${planning || prestart || preMashHeatstrike ? 'rgba(255,193,7,.10)' : 'rgba(127,127,127,.07)'};border:1px solid ${planning || prestart || preMashHeatstrike ? 'rgba(255,193,7,.26)' : 'rgba(127,127,127,.13)'};font-size:12px;font-weight:800;opacity:.82;text-align:center;">${nextBox}</div>
                  <div style="margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;">
                    <div style="border-radius:13px;padding:7px;background:rgba(33,150,243,.09);border:1px solid rgba(33,150,243,.20);text-align:center;"><b>${fmt(progress, '%', 0)}</b><br><span style="font-size:10px;opacity:.65;">progress</span></div>
                    <div style="border-radius:13px;padding:7px;background:rgba(0,188,212,.10);border:1px solid rgba(0,188,212,.22);text-align:center;"><b>${fmt(remaining, 'min', 0)}</b><br><span style="font-size:10px;opacity:.65;">remaining</span></div>
                    <div style="border-radius:13px;padding:7px;background:rgba(76,175,80,.10);border:1px solid rgba(76,175,80,.22);text-align:center;"><b>${fmt(strikeTarget ?? target, '°C')}</b><br><span style="font-size:10px;opacity:.65;">${preMashHeatstrike ? 'strike target' : 'target'}</span></div>
                    <div style="border-radius:13px;padding:7px;background:rgba(127,127,127,.08);border:1px solid rgba(127,127,127,.14);text-align:center;"><b>${fourthMain}</b><br><span style="font-size:10px;opacity:.65;">${fourthLabel}</span></div>
                  </div>
                  ${preMashHeatstrike ? `<div style="margin-top:7px;font-size:10.8px;font-weight:800;opacity:.66;text-align:center;">Heat ${fmt(heat, '%', 0)} · pump ${fmt(pump, '%', 0)} · gate ${mashGateState}</div>` : ''}
                </div>`;
              ]]]
            styles:
              card:
                - border-radius: 22px
                - padding: 14px
                - background: >-
                    linear-gradient(135deg, rgba(33,150,243,.10),
                    rgba(127,127,127,.035))
                - border: 1px solid rgba(33,150,243,.20)
                - box-shadow: 0 2px 10px rgba(0,0,0,.08)
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 42px minmax(0,1fr)
                - column-gap: 12px
              label:
                - justify-self: stretch
                - text-align: left
                - white-space: normal
          - type: custom:button-card
