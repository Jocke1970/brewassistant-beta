type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: 'on'
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewday_runtime_summary
      name: Brewday
      icon: |
        [[[
          const state = states['sensor.brewassistant_brewday_runtime_state']?.state ?? 'unknown';
          const stage = String(states['sensor.brewassistant_brewday_runtime_stage']?.state ?? '').toLowerCase();
          if (state === 'aborted') return 'mdi:alert-octagon-outline';
          if (state === 'paused') return 'mdi:pause-circle-outline';
          if (state === 'completed' || state === 'finished') return 'mdi:check-decagram-outline';
          if (stage.includes('mash')) return 'mdi:pot-steam-outline';
          if (stage.includes('boil')) return 'mdi:kettle-steam-outline';
          if (stage.includes('cool') || stage.includes('chill')) return 'mdi:snowflake-thermometer';
          if (state === 'running' || state === 'live') return 'mdi:play-circle-outline';
          return 'mdi:beer-outline';
        ]]]
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewday_runtime_summary
        - sensor.brewassistant_brewday_runtime_source
        - sensor.brewassistant_brewday_runtime_state
        - sensor.brewassistant_brewday_runtime_stage
        - sensor.brewassistant_brewday_runtime_step
        - sensor.brewassistant_brewday_runtime_next_step
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      label: |
        [[[
          function clean(v) {
            if (v === undefined || v === null) return null;
            const s = String(v);
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
          }
          function n(id) {
            const raw = states[id]?.state;
            const val = Number(String(raw ?? '').replace(',', '.'));
            return Number.isFinite(val) ? val : null;
          }
          function short(v, max = 48) {
            const s = String(v ?? '—');
            return s.length > max ? s.slice(0, max - 1) + '…' : s;
          }
          function stateLabel(v) {
            if (v === 'running' || v === 'live') return 'running';
            if (v === 'paused') return 'paused';
            if (v === 'completed' || v === 'finished') return 'complete';
            if (v === 'awaiting_snapshot') return 'waiting for snapshot';
            if (v === 'source_unavailable') return 'RAPT source unavailable · no new BA writes';
            if (v === 'inactive') return 'stopped';
            if (v === 'aborted') return 'ABORTED · control locked';
            if (v === 'idle') return 'idle';
            return v;
          }

          const summary = clean(states['sensor.brewassistant_brewday_runtime_summary']?.state) || '—';
          const runtimeSource = clean(states['sensor.brewassistant_brewday_runtime_source']?.state) || 'None';
          const runtimeState = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
          const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || '—';
          const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
          const next = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
          const liveProgress = n('sensor.brewassistant_brewday_live_progress');
          const remaining = n('sensor.brewassistant_brewday_live_time_remaining_minutes');
          const stageEngine = clean(states['sensor.brewassistant_brewday_stage']?.state) || '—';
          const statusLine = clean(states['sensor.brewassistant_brewday_stage_status_line']?.state) || summary;
          const suggestedAction = clean(states['sensor.brewassistant_brewday_stage_suggested_action']?.state) || '—';
          const controlHint = clean(states['sensor.brewassistant_brewday_stage_control_hint']?.state) || '—';
          let headline = 'Brewday active';
          let badge = 'Running';
          let badgeIcon = 'mdi:play-circle-outline';
          let chipBg = 'rgba(76,175,80,.12)';
          let chipBorder = 'rgba(76,175,80,.24)';
          if (runtimeState === 'aborted') {
            headline = 'BREWDAY ABORTED'; badge = 'ABORT'; badgeIcon = 'mdi:alert-octagon-outline';
            chipBg = 'rgba(244,67,54,.18)'; chipBorder = 'rgba(244,67,54,.46)';
          } else if (runtimeState === 'paused') {
            headline = 'Brewday paused'; badge = 'Paused'; badgeIcon = 'mdi:pause-circle-outline';
            chipBg = 'rgba(255,193,7,.14)'; chipBorder = 'rgba(255,193,7,.28)';
          } else if (runtimeState === 'completed' || runtimeState === 'finished') {
            headline = 'Brewday complete'; badge = 'Done'; badgeIcon = 'mdi:check-decagram-outline';
            chipBg = 'rgba(76,175,80,.13)'; chipBorder = 'rgba(76,175,80,.28)';
          } else if (runtimeState === 'awaiting_snapshot' || runtimeState === 'source_unavailable') {
            headline = runtimeState === 'source_unavailable' ? 'RAPT source temporarily unavailable' : 'Waiting for snapshot';
            badge = runtimeState === 'source_unavailable' ? 'SOURCE LOST' : 'Waiting';
            badgeIcon = runtimeState === 'source_unavailable' ? 'mdi:cloud-alert-outline' : 'mdi:cloud-sync-outline';
            chipBg = runtimeState === 'source_unavailable' ? 'rgba(244,67,54,.15)' : 'rgba(33,150,243,.12)';
            chipBorder = runtimeState === 'source_unavailable' ? 'rgba(244,67,54,.34)' : 'rgba(33,150,243,.24)';
          } else if (runtimeState === 'idle' || runtimeState === 'inactive') {
            headline = runtimeState === 'inactive' ? 'Process source stopped' : 'Idle';
            badge = runtimeState === 'inactive' ? 'Stopped' : 'Idle';
            badgeIcon = 'mdi:sleep';
            chipBg = 'rgba(127,127,127,.12)'; chipBorder = 'rgba(127,127,127,.20)';
          }

          const directiveLabel = runtimeSource === 'RAPT BrewZilla Profile'
            ? 'RAPT PROFILE'
            : runtimeSource === 'Brewfather Brew Tracker'
              ? 'BREWTRACKER'
              : runtimeSource === 'Manual Brewday'
                ? 'MANUAL'
                : 'NO SOURCE';
          const directiveIcon = runtimeSource === 'RAPT BrewZilla Profile'
            ? 'mdi:playlist-play'
            : runtimeSource === 'Brewfather Brew Tracker'
              ? 'mdi:timer-play-outline'
              : runtimeSource === 'Manual Brewday'
                ? 'mdi:hand-back-right-outline'
                : 'mdi:minus-circle-outline';
          const directiveBg = runtimeSource === 'RAPT BrewZilla Profile' ? 'rgba(156,39,176,.10)' : 'rgba(33,150,243,.09)';
          const directiveBorder = runtimeSource === 'RAPT BrewZilla Profile' ? 'rgba(156,39,176,.25)' : 'rgba(33,150,243,.21)';
          const chainChip = (text, icon, bg, border) => `<span style="display:inline-flex;align-items:center;gap:4px;padding:5px 7px;border-radius:999px;background:${bg};border:1px solid ${border};font-size:9.5px;font-weight:950;white-space:nowrap;"><ha-icon icon="${icon}" style="width:12px;height:12px;"></ha-icon>${text}</span>`;

          const progressMain = Number.isFinite(liveProgress) ? `${liveProgress.toFixed(0)} %` : '—';
          const remainingMain = Number.isFinite(remaining) ? `${remaining.toFixed(0)} min` : '—';
          const progressWidth = Number.isFinite(liveProgress) ? Math.max(0, Math.min(100, liveProgress)) : 0;
          const progressColor = runtimeState === 'aborted' || runtimeState === 'source_unavailable'
            ? 'rgba(244,67,54,.82)'
            : runtimeState === 'paused'
              ? 'rgba(255,193,7,.82)'
              : progressWidth >= 80
                ? 'rgba(76,175,80,.82)'
                : 'rgba(33,150,243,.82)';
          const progressDetail = Number.isFinite(liveProgress)
            ? `${progressMain} of current step${Number.isFinite(remaining) ? ` · ${remainingMain} remaining` : ''} · ${short(step, 54)}`
            : `No progress for current step · ${short(step, 54)}`;
          const metric = (title, main, sub, icon, kind = 'neutral') => {
            const bg = kind === 'blue' ? 'rgba(33,150,243,.09)' : kind === 'cyan' ? 'rgba(0,188,212,.10)' : kind === 'green' ? 'rgba(76,175,80,.11)' : kind === 'yellow' ? 'rgba(255,193,7,.13)' : kind === 'red' ? 'rgba(244,67,54,.11)' : 'rgba(127,127,127,.08)';
            const border = kind === 'blue' ? 'rgba(33,150,243,.20)' : kind === 'cyan' ? 'rgba(0,188,212,.22)' : kind === 'green' ? 'rgba(76,175,80,.24)' : kind === 'yellow' ? 'rgba(255,193,7,.26)' : kind === 'red' ? 'rgba(244,67,54,.24)' : 'rgba(127,127,127,.14)';
            return `<div style="min-width:0;min-height:58px;border-radius:13px;padding:7px 6px;background:${bg};border:1px solid ${border};display:grid;grid-template-columns:18px minmax(0,1fr);gap:5px;align-items:center;"><ha-icon icon="${icon}" style="width:15px;height:15px;opacity:.82;"></ha-icon><div style="min-width:0;text-align:center;"><div style="font-size:8.7px;font-weight:950;opacity:.55;letter-spacing:.045em;text-transform:uppercase;">${title}</div><div style="font-size:12px;font-weight:950;line-height:1.12;white-space:normal;overflow-wrap:anywhere;">${main}</div><div style="font-size:9px;font-weight:800;opacity:.58;line-height:1.12;margin-top:2px;white-space:normal;overflow-wrap:anywhere;">${sub}</div></div></div>`;
          };

          const statusBg = runtimeState === 'aborted' || runtimeState === 'source_unavailable' ? 'rgba(244,67,54,.12)' : 'rgba(76,175,80,.10)';
          const statusBorder = runtimeState === 'aborted' || runtimeState === 'source_unavailable' ? 'rgba(244,67,54,.32)' : 'rgba(76,175,80,.24)';
          const statusIcon = runtimeState === 'aborted' || runtimeState === 'source_unavailable' ? 'mdi:alert-octagon-outline' : 'mdi:check-circle-outline';
          const statusText = runtimeState === 'aborted' ? summary : statusLine;

          return `<div style="line-height:1.25;min-width:0;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;"><div style="min-width:0;"><div style="font-size:12px;font-weight:850;opacity:.66;">Operator cockpit · source · runtime · physical process</div><div style="font-size:12px;font-weight:850;opacity:.66;">${short(summary, 62)}</div></div><div style="display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:${chipBg};border:1px solid ${chipBorder};font-size:11px;font-weight:950;white-space:nowrap;"><ha-icon icon="${badgeIcon}" style="width:14px;height:14px;"></ha-icon><span>${badge}</span></div></div>
            <div style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;">${chainChip(directiveLabel,directiveIcon,directiveBg,directiveBorder)}<span style="opacity:.45;">→</span>${chainChip('BREWASSISTANT','mdi:brain','rgba(33,150,243,.09)','rgba(33,150,243,.21)')}<span style="opacity:.45;">→</span>${chainChip('RCL','mdi:cloud-sync-outline','rgba(0,188,212,.08)','rgba(0,188,212,.20)')}<span style="opacity:.45;">→</span>${chainChip('BREWZILLA','mdi:kettle-steam-outline','rgba(76,175,80,.08)','rgba(76,175,80,.20)')}</div>
            <div style="margin-top:8px;text-align:center;"><div style="font-size:23px;font-weight:950;letter-spacing:-.04em;line-height:1.02;">${headline}</div><div style="margin-top:5px;font-size:12px;font-weight:800;opacity:.74;">${stateLabel(runtimeState)} · ${stage} · ${short(step, 48)}</div></div>
            <div style="margin-top:11px;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:9px;font-weight:950;letter-spacing:.06em;opacity:.58;text-transform:uppercase;"><span>Progress · current step</span><span>${progressMain}</span></div>
              <div style="margin-top:5px;height:8px;border-radius:999px;background:rgba(127,127,127,.16);overflow:hidden;"><div style="width:${progressWidth}%;height:8px;border-radius:999px;background:${progressColor};transition:width .35s ease, background .35s ease;"></div></div>
              <div style="margin-top:5px;font-size:10.8px;font-weight:800;opacity:.68;text-align:center;">${progressDetail}</div>
            </div>
            <div style="margin-top:11px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;">
              ${metric('Stage', stage, stageEngine, 'mdi:map-marker-path', 'blue')}
              ${metric('Step', step, 'current', 'mdi:format-list-checks', 'cyan')}
              ${metric('Next', next, 'next', 'mdi:skip-next-circle-outline', 'neutral')}
            </div>
            <div style="margin-top:7px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;">
              ${metric('Action', suggestedAction, 'suggested', 'mdi:gesture-tap-button', suggestedAction !== '—' ? 'yellow' : 'neutral')}
              ${metric('Control', controlHint, 'hint', 'mdi:shield-check-outline', 'neutral')}
            </div>
            <div style="margin-top:10px;display:grid;grid-template-columns:20px minmax(0,1fr);gap:7px;align-items:center;border-radius:14px;padding:8px 9px;background:${statusBg};border:1px solid ${statusBorder};"><ha-icon icon="${statusIcon}" style="width:15px;height:15px;opacity:.76;"></ha-icon><div style="font-size:11.5px;line-height:1.25;font-weight:800;opacity:.78;text-align:left;white-space:normal;">${short(statusText, 120)}</div></div>
          </div>`;
        ]]]
      styles:
        card:
          - border-radius: 22px
          - padding: 14px
          - overflow: hidden
          - background: >-
              linear-gradient(135deg, rgba(33,150,243,.10),
              rgba(127,127,127,.035))
          - border: 1px solid rgba(33,150,243,.20)
          - box-shadow: 0 2px 10px rgba(0,0,0,.08)
        grid:
          - grid-template-areas: '"i n" "i l"'
          - grid-template-columns: 42px minmax(0,1fr)
          - grid-template-rows: min-content min-content
          - column-gap: 12px
        icon:
          - width: 27px
          - height: 27px
        img_cell:
          - width: 42px
          - height: 42px
          - border-radius: 50%
          - background: rgba(33,150,243,.15)
          - color: rgb(33,150,243)
        name:
          - justify-self: start
          - align-self: end
          - font-size: 15px
          - font-weight: 950
        label:
          - justify-self: stretch
          - text-align: left
          - white-space: normal
          - margin-top: 4px

    - type: vertical-stack
      cards:
        - type: custom:button-card
          entity: button.brewassistant_mash_in_started
          name: STRIKE READY · START MASH-IN
          icon: mdi:barley
          show_state: false
          show_label: true
          triggers_update:
            - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
            - sensor.brewassistant_brewzilla_control_reason
            - sensor.brewassistant_brewday_runtime_source
            - sensor.brewfather_brew_tracker_status
            - switch.brewzilla_pump
            - number.brewzilla_pump_utilization
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.brewassistant_mash_in_started
            confirmation:
              text: >-
                Start mash-in now? BrewAssistant stops the pump, releases the
                strike latch toward the process source mash target and enters
                mash_in_started while grain is added.
          hold_action:
            action: more-info
          label: |
            [[[
              const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
              const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
              const state = String(oz.mash_in_gate_state || gate?.attributes?.state || gate?.attributes?.mash_in_gate_state || 'idle');
              if (state !== 'ready_for_mash_in') return '';
              const rawTarget = oz.mash_in_gate_current_target ?? oz.mash_in_gate_last_target ?? gate?.attributes?.last_target ?? gate?.attributes?.mash_in_gate_current_target;
              const rawTemp = oz.mash_in_gate_current_temperature ?? gate?.attributes?.current_temperature ?? gate?.attributes?.mash_in_gate_current_temperature;
              const target = Number(rawTarget);
              const temp = Number(rawTemp);
              const pump = String(states['switch.brewzilla_pump']?.state ?? '—');
              const util = Number.parseFloat(states['number.brewzilla_pump_utilization']?.state ?? '');
              const ftemp = (n) => Number.isFinite(n) ? `${n.toFixed(1)} °C` : '—';
              const utilText = Number.isFinite(util) ? `${util.toFixed(0)} %` : '—';
              return `<b>Strike ready · time to mash in</b> · target ${ftemp(target)} · process ${ftemp(temp)}<br>Circulation ${pump.toUpperCase()} · ${utilText}<br><b>Press the card when grain addition starts.</b>`;
            ]]]
          styles:
            card:
              - display: |
                  [[[
                    const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    const state = String(oz.mash_in_gate_state || gate?.attributes?.state || gate?.attributes?.mash_in_gate_state || 'idle');
                    return state === 'ready_for_mash_in' ? 'block' : 'none';
                  ]]]
              - min-height: 78px
              - padding: 10px 12px
              - border-radius: 16px
              - background: rgba(255,193,7,.14)
              - border: 1px solid rgba(255,193,7,.48)
              - box-shadow: 0 1px 6px rgba(255,193,7,.08)
            grid:
              - grid-template-areas: '"i n" "i l"'
              - grid-template-columns: 32px minmax(0,1fr)
              - column-gap: 9px
            icon:
              - width: 22px
              - color: rgb(255,183,0)
            name:
              - justify-self: start
              - font-size: 12.5px
              - font-weight: 950
            label:
              - justify-self: start
              - text-align: left
              - white-space: normal
              - font-size: 10.5px
              - font-weight: 790
              - line-height: 1.22
              - opacity: 0.86

        - type: custom:button-card
          entity: sensor.brewfather_brew_tracker_status
          name: |
            [[[
              const source = states['sensor.brewassistant_brewday_runtime_source']?.state;
              if (source !== 'Brewfather Brew Tracker') return '';
              const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
              const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
              const state = String(oz.mash_in_gate_state || gate?.attributes?.state || gate?.attributes?.mash_in_gate_state || 'idle');
              if (state !== 'mash_in_started') return '';
              const pumpOn = states['switch.brewzilla_pump']?.state === 'on';
              const util = Number.parseFloat(states['number.brewzilla_pump_utilization']?.state ?? '');
              const pumpBad = pumpOn || (Number.isFinite(util) && util > 0.1);
              return pumpBad
                ? 'MASH-IN ACTIVE · ⚠ PUMP IS NOT OFF'
                : 'MASH-IN ACTIVE · WAITING FOR BF CONTINUE';
            ]]]
          icon: mdi:barley
          show_state: false
          show_label: true
          triggers_update:
            - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
            - sensor.brewassistant_brewzilla_control_reason
            - sensor.brewassistant_brewday_runtime_source
            - sensor.brewfather_brew_tracker_status
            - switch.brewzilla_pump
            - number.brewzilla_pump_utilization
          tap_action:
            action: more-info
          hold_action:
            action: more-info
          label: |
            [[[
              const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
              const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
              const state = String(oz.mash_in_gate_state || gate?.attributes?.state || gate?.attributes?.mash_in_gate_state || 'idle');
              if (state !== 'mash_in_started') return '';
              const bf = String(states['sensor.brewfather_brew_tracker_status']?.state ?? '—');
              const pump = String(states['switch.brewzilla_pump']?.state ?? '—');
              const util = Number.parseFloat(states['number.brewzilla_pump_utilization']?.state ?? '');
              const utilText = Number.isFinite(util) ? `${util.toFixed(0)} %` : '—';
              const pumpBad = pump === 'on' || (Number.isFinite(util) && util > 0.1);
              const instruction = bf.toLowerCase() === 'paused'
                ? 'Mix in the grain. When complete, press CONTINUE in Brewfather.'
                : 'Brewfather has left Paused · waiting for BA to complete the handoff.';
              return `Brewfather ${bf} · Pump ${pump.toUpperCase()} · ${utilText}<br>${instruction}${pumpBad ? '<br><b>⚠ Pump must be OFF / 0 % during mash-in.</b>' : ''}`;
            ]]]
          styles:
            card:
              - display: |
                  [[[
                    const source = states['sensor.brewassistant_brewday_runtime_source']?.state;
                    const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    const state = String(oz.mash_in_gate_state || gate?.attributes?.state || gate?.attributes?.mash_in_gate_state || 'idle');
                    return source === 'Brewfather Brew Tracker' && state === 'mash_in_started' ? 'block' : 'none';
                  ]]]
              - min-height: 78px
              - padding: 10px 12px
              - border-radius: 16px
              - background: |
                  [[[
                    const pumpOn = states['switch.brewzilla_pump']?.state === 'on';
                    const util = Number.parseFloat(states['number.brewzilla_pump_utilization']?.state ?? '');
                    return pumpOn || (Number.isFinite(util) && util > 0.1)
                      ? 'rgba(244,67,54,.16)'
                      : 'rgba(255,152,0,.16)';
                  ]]]
              - border: |
                  [[[
                    const pumpOn = states['switch.brewzilla_pump']?.state === 'on';
                    const util = Number.parseFloat(states['number.brewzilla_pump_utilization']?.state ?? '');
                    return pumpOn || (Number.isFinite(util) && util > 0.1)
                      ? '2px solid rgba(244,67,54,.58)'
                      : '1px solid rgba(255,152,0,.52)';
                  ]]]
              - animation: ba-mashin-wait-pulse 1.45s ease-in-out infinite
            grid:
              - grid-template-areas: '"i n" "i l"'
              - grid-template-columns: 32px minmax(0,1fr)
              - column-gap: 9px
            icon:
              - width: 22px
              - color: |
                  [[[
                    const pumpOn = states['switch.brewzilla_pump']?.state === 'on';
                    const util = Number.parseFloat(states['number.brewzilla_pump_utilization']?.state ?? '');
                    return pumpOn || (Number.isFinite(util) && util > 0.1)
                      ? 'rgb(244,67,54)'
                      : 'rgb(255,152,0)';
                  ]]]
            name:
              - justify-self: start
              - font-size: 12.5px
              - font-weight: 950
            label:
              - justify-self: start
              - text-align: left
              - white-space: normal
              - font-size: 10.5px
              - font-weight: 790
              - line-height: 1.22
              - opacity: 0.88
          extra_styles: |
            @keyframes ba-mashin-wait-pulse {
              0%, 100% { transform: scale(1); filter: brightness(1); }
              50% { transform: scale(1.008); filter: brightness(1.07); }
            }
            @media (prefers-reduced-motion: reduce) {
              #card { animation: none !important; transform: none !important; }
            }

        - type: custom:button-card
          entity: button.brewassistant_mash_in_complete
          name: MASH-IN COMPLETE · RAPT
          icon: mdi:check-bold
          show_state: false
          show_label: true
          triggers_update:
            - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
            - sensor.brewassistant_brewzilla_control_reason
            - sensor.brewassistant_brewday_runtime_source
            - sensor.brewassistant_brewday_runtime_step
            - switch.brewzilla_pump
            - number.brewzilla_pump_utilization
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.brewassistant_mash_in_complete
            confirmation:
              text: >-
                Is the grain fully mixed in? BrewAssistant completes the Mash-In
                gate and moves to normal mash circulation. Then advance the manual
                Mash In step on BrewZilla so RAPT moves to Mash Rest.
          hold_action:
            action: more-info
          label: |
            [[[
              const step = states['sensor.brewassistant_brewday_runtime_step']?.state ?? 'Mash In';
