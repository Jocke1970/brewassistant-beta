type: conditional
conditions:
  - entity: switch.brewzilla
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: button.brewassistant_mash_in_started
      name: BrewZilla inmäskningskontroller
      icon: mdi:barley
      show_state: false
      show_label: true
      triggers_update:
        - button.brewassistant_mash_in_override
        - button.brewassistant_mash_in_started
        - button.brewassistant_mash_in_complete
        - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
        - sensor.brewassistant_brewzilla_control_reason
      tap_action:
        action: more-info
      label: |
        [[[
          function clean(v) {
            if (v === undefined || v === null) return null;
            const s = String(v).trim();
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
          }
          function numAttr(attrs, key) {
            const n = Number(String(attrs?.[key] ?? '').replace(',', '.'));
            return Number.isFinite(n) ? n : null;
          }
          function fmt(v, unit = '°C', d = 1) {
            return Number.isFinite(v) ? `${v.toFixed(d)} ${unit}` : '—';
          }
          function boolish(v) {
            const s = String(v ?? '').toLowerCase();
            return v === true || ['on','true','yes','1'].includes(s);
          }
          const start = states['button.brewassistant_mash_in_started'];
          const complete = states['button.brewassistant_mash_in_complete'];
          const override = states['button.brewassistant_mash_in_override'];
          const oa = override?.attributes || {};
          const a = start?.attributes || complete?.attributes || {};
          const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
          const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
          const gateState = clean(a.state || a.mash_in_gate_state || gate?.attributes?.state || gate?.attributes?.mash_in_gate_state || oz.mash_in_gate_state) || 'idle';
          const startedVisible = a.mash_in_started_visible === true;
          const completeVisible = a.mash_in_complete_visible === true || gateState === 'mash_in_started';
          const cleanHeat = boolish(oz.clean_heat_strike_active);
          const strike = numAttr(oz, 'heat_strike_target') ?? numAttr(oz, 'heat_strike_clean_control_target');
          const gateTemp = numAttr(oz, 'clean_heat_strike_gate_temperature');
          const gateDelta = numAttr(oz, 'clean_heat_strike_gate_delta_to_target');
          const safetyTemp = numAttr(oz, 'clean_heat_strike_safety_temperature');
          const safetyDelta = numAttr(oz, 'clean_heat_strike_safety_delta_to_target');
          const heat = numAttr(oz, 'desired_heat_utilization');
          const pump = numAttr(oz, 'desired_pump_utilization');
          const pumpReason = clean(oz.clean_heat_strike_pump_reason) || '—';
          const effective = clean(a.effective_target || a.mash_in_effective_target || gate?.attributes?.effective_target || gate?.attributes?.mash_in_effective_target) || '—';
          const next = clean(a.next_target || a.mash_in_next_target || gate?.attributes?.next_target || gate?.attributes?.mash_in_next_target) || '—';
          const process = Number(oa.mash_in_override_process_temperature);
          const processAge = Number(oa.mash_in_override_process_temperature_age_seconds);
          const processFresh = oa.mash_in_override_process_temperature_fresh === true;
          const overrideAvailable = oa.mash_in_override_available === true;
          const ageText = Number.isFinite(processAge) ? `${Math.floor(processAge / 60)}m ${Math.round(processAge % 60)}s` : 'okänd';
          const startOk = !!start;
          const completeOk = !!complete;
          let msg = 'Väntar på beredskap för inmäskning.';
          if (!startOk || !completeOk || !override) {
            msg = 'De nya knapp-entiteterna saknas ännu — kör pull + full HA-omstart.';
          } else if (oa.mash_in_override_in_scope === true && !processFresh) {
            msg = `RAPT Cloud MASH-data är stale (${ageText}). BrewZilla reglerar lokalt. ${overrideAvailable ? 'Manuell strike-kvittens är tillgänglig efter fysisk kontroll.' : 'Väntar tills WORT/lokalt target ligger inom säkert override-band.'}`;
          } else if (cleanHeat && gateState !== 'mash_in_started') {
            msg = 'Heatstrike pågår. Färsk MASH/process-data ger automatisk READY inom ±1,0 °C. Manuell reservväg visas först inom ±2,0 °C.';
          } else if (startedVisible) {
            msg = 'Strike är redo. Tryck INMÄSKNING PÅBÖRJAD i BA när du börjar hälla i malten. Därefter är Brewfather FORTSÄTT primär kvittens.';
          } else if (completeVisible) {
            msg = 'Inmäskning påbörjad. Tillsätt malt och rör om. När du är klar: tryck FORTSÄTT i Brewfather. BA slutför inmäskningen och startar cirkulation automatiskt.';
          } else if (gateState === 'mash_in_complete') {
            msg = 'Inmäskningen är klar. Brewfather är igång och BA har släppt vidare till normal mäskcirkulation.';
          }
          const staleLine = oa.mash_in_override_in_scope === true && !processFresh
            ? `<br>MASH ${fmt(process)} · stale ${ageText} · WORT ${fmt(Number(oa.mash_in_override_wort_temperature))} · lokalt target ${fmt(Number(oa.mash_in_override_local_target))}`
            : '';
          const heatLine = cleanHeat
            ? `<br>strike ${fmt(strike)} · gate ${fmt(gateTemp)} / Δ ${fmt(gateDelta)} · säkerhet ${fmt(safetyTemp)} / Δ ${fmt(safetyDelta)} · värme ${Number.isFinite(heat) ? heat.toFixed(0) + ' %' : '—'} · pump ${Number.isFinite(pump) ? pump.toFixed(0) + ' %' : '—'} (${pumpReason})`
            : '';
          return `${msg}<br>status ${gateState} · effektivt mål ${effective}°C · nästa ${next}°C${staleLine}${heatLine}`;
        ]]]
      styles:
        card:
          - border-radius: 18px
          - padding: 12px
          - background: rgba(127,127,127,.075)
          - border: 1px solid rgba(127,127,127,.18)
        grid:
          - grid-template-areas: '"i n" "i l"'
          - grid-template-columns: 36px minmax(0,1fr)
          - column-gap: 10px
        icon:
          - width: 24px
          - opacity: 0.82
        name:
          - justify-self: start
          - font-size: 13px
          - font-weight: 950
        label:
          - justify-self: start
          - text-align: left
          - white-space: normal
          - font-size: 11px
          - font-weight: 760
          - line-height: 1.25
          - opacity: 0.78

    - type: custom:button-card
      entity: button.brewassistant_mash_in_override
      name: GODKÄNN STRIKE MANUELLT
      icon: mdi:hand-okay
      show_state: false
      show_label: true
      label: Kvitterar endast READY-gaten · max ±2,0 °C
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_mash_in_override
        confirmation:
          text: >-
            Kontrollera strike-temperaturen fysiskt på BrewZilla/termometern.
            Knappen kvitterar endast Mash-In READY och ändrar inte heat, pump
            eller target. Fortsätt sedan med INMÄSKNING PÅBÖRJAD.
      styles:
        card:
          - display: |
              [[[
                return entity?.attributes?.mash_in_override_available === true ? 'block' : 'none';
              ]]]
          - border-radius: 18px
          - padding: 12px
          - background: rgba(255,152,0,.16)
          - border: 1px solid rgba(255,152,0,.42)
        name:
          - font-size: 12px
          - font-weight: 950
        label:
          - white-space: normal
          - font-size: 10.5px
          - font-weight: 750
          - opacity: 0.76

    - type: horizontal-stack
      cards:
        - type: custom:button-card
          entity: button.brewassistant_mash_in_started
          name: INMÄSKNING PÅBÖRJAD
          icon: mdi:barley
          show_state: false
          show_label: true
          triggers_update:
            - button.brewassistant_mash_in_started
            - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
            - sensor.brewassistant_brewzilla_control_reason
          label: |
            [[[
              const a = states['button.brewassistant_mash_in_started']?.attributes || {};
              const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
              const target = oz.heat_strike_target ?? oz.heat_strike_clean_control_target ?? a.effective_target ?? a.mash_in_effective_target ?? '—';
              const gate = oz.clean_heat_strike_gate_temperature ?? '—';
              const safety = oz.clean_heat_strike_safety_temperature ?? '—';
              return `Starta fysisk inmäskning · strike ${target}°C · gate ${gate}°C · säkerhet ${safety}°C`;
            ]]]
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_started
            confirmation:
              text: >-
                Börjar du mäska in nu? Kontrollera att Mash/BLE/control-proben är
                vid strike-target och att wort/kettle inte springer iväg. BA släpper
                strike-target, håller pumpen av och siktar på nästa mäskmål med
                låg anti-drop-värme. När malten är inrörd fortsätter du normalt med
                FORTSÄTT i Brewfather.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['button.brewassistant_mash_in_started']?.attributes || {};
                    const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    const state = a.state || a.mash_in_gate_state || gate?.attributes?.state || gate?.attributes?.mash_in_gate_state;
                    const visible = a.mash_in_started_visible === true || state === 'ready_for_mash_in' || gate?.state === 'on';
                    return visible ? 'block' : 'none';
                  ]]]
              - border-radius: 18px
              - padding: 12px
              - background: rgba(255,193,7,.12)
              - border: 1px solid rgba(255,193,7,.28)
            name:
              - font-size: 12px
              - font-weight: 950
            label:
              - white-space: normal
              - font-size: 10.5px
              - font-weight: 750
              - opacity: 0.74
        - type: custom:button-card
          entity: button.brewassistant_mash_in_complete
          name: MANUELL INMÄSKNING KLAR
          icon: mdi:pump
          show_state: false
          show_label: true
          label: |
            [[[
              const a = states['button.brewassistant_mash_in_complete']?.attributes || {};
              const target = a.effective_target ?? a.mash_in_effective_target ?? '—';
              return `Reservväg · normalt: tryck FORTSÄTT i Brewfather · mål ${target}°C · pump 50%`;
            ]]]
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_complete
            confirmation:
              text: >-
                Manuell reservväg. I normalflödet trycker du FORTSÄTT i Brewfather
                efter inmäskning, så slutför BA inmäskningen automatiskt. Använd denna
                knapp bara om BF-flödet inte triggar.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['button.brewassistant_mash_in_complete']?.attributes || {};
                    const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    const state = a.state || a.mash_in_gate_state || gate?.attributes?.state || gate?.attributes?.mash_in_gate_state;
                    const visible = a.mash_in_complete_visible === true || state === 'mash_in_started';
                    return visible ? 'block' : 'none';
                  ]]]
              - border-radius: 18px
              - padding: 12px
              - background: rgba(76,175,80,.12)
              - border: 1px solid rgba(76,175,80,.26)
            name:
              - font-size: 12px
              - font-weight: 950
            label:
              - white-space: normal
              - font-size: 10.5px
              - font-weight: 750
              - opacity: 0.74
