type: conditional
conditions:
  - entity: switch.brewzilla
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewzilla_control_reason
      name: Inmäskning och maltbäddsvila
      icon: mdi:barley
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewzilla_control_reason
        - button.brewassistant_mash_in_started
        - button.brewassistant_mash_in_complete
        - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
        - sensor.brewassistant_brewday_runtime_source
      tap_action:
        action: more-info
      label: |
        [[[
          const a = entity?.attributes || {};
          const gate = a.mash_in_gate_state || states['button.brewassistant_mash_in_started']?.attributes?.state || 'idle';
          const phase = a.mash_recirculation_phase;
          const remaining = Math.max(0, Number(a.mash_settle_remaining_seconds) || 0);
          const ramp = Math.max(0, Number(a.mash_recirculation_ramp_remaining_seconds) || 0);
          const source = states['sensor.brewassistant_brewday_runtime_source']?.state || 'None';
          const target = Number(a.mash_physical_hold_target);
          const hold = Number.isFinite(target) && a.mash_physical_hold_target != null ? ` · fysisk vila ${target.toFixed(1)}°C ${a.mash_physical_hold_complete ? 'klar' : 'väntar'}` : '';
          const time = n => `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2,'0')}`;
          const pump = a.desired_pump_utilization;
          let msg = 'Väntar på strike-beredskap. STARTED håller pumpen av.';
          if (gate === 'mash_in_started') msg = source === 'Brewfather Brew Tracker'
            ? 'Inmäskning påbörjad. När malten är inrörd: tryck FORTSÄTT i Brewfather. BA markerar klart men startar INTE pumpen.'
            : 'Inmäskning påbörjad. När malten är inrörd: tryck INMÄSKNING KLAR. Pumpen förblir AV.';
          if (phase === 'settling') msg = `Maltbädden sätter sig · ${time(remaining)} kvar · pump AV · värmen får hålla mäskmålet.`;
          if (phase === 'recirculation_ready') msg = '10 min vila klar. Kontrollera bädd och avrinning; kvittera LÅGFLÖDE nedan.';
          if (phase === 'low_flow_pending') msg = 'Lågflödeskommando skickat; väntar på pumpåterkoppling. Höj inte flödet än.';
          if (phase === 'low_flow') msg = `Försiktig recirkulation pågår · nästa flödesförslag om ${time(ramp)}. Kontrollera nivån över bädden.`;
          if (phase === 'normal_ready') msg = 'Ramptid klar. Öka bara efter visuell kontroll av stabil avrinning och ny kvittens.';
          if (phase === 'normal_pending') msg = 'Normalt flöde begärt; väntar på fysisk återkoppling.';
          if (phase === 'normal') msg = 'Normal recirkulation bekräftad. Fysiska mäskvilan äger målet tills den är färdig.';
          if (phase === 'blocked' || phase === 'recovery_required') msg = `Fysisk styrning SPÄRRAD (${a.mash_interlock_reason || phase}). Ingen automatisk omstart; operatörsåtgärd krävs.`;
          if (gate === 'mash_in_complete' && !phase && a.physical_mash_interlock_active !== false) msg = 'Inmäskning klar. Väntar på backendstatus; anta inte att pumpen får starta.';
          return `${msg}<br>gate ${gate} · fas ${phase || '—'}${hold} · pumprekommendation ${pump ?? '—'} %`;
        ]]]
      styles:
        card:
          - border-radius: 18px
          - padding: 12px
          - background: rgba(127,127,127,.075)
          - border: 1px solid rgba(127,127,127,.18)
        label:
          - white-space: normal
          - text-align: left
          - font-size: 12px
          - line-height: 1.35
    - type: custom:button-card
      entity: button.brewassistant_mash_in_override
      name: GODKÄNN STRIKE MANUELLT
      icon: mdi:hand-okay
      show_state: false
      show_label: true
      label: Kvitterar enbart READY · kontrollera fysiskt · max ±2,0 °C
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_mash_in_override
        confirmation:
          text: Kontrollera strike-temperaturen fysiskt. Knappen kvitterar bara READY och ändrar inte pump, värme eller mål.
      styles:
        card:
          - display: |
              [[[
                return entity?.attributes?.mash_in_override_available === true ? 'block' : 'none';
              ]]]
          - border-radius: 18px
          - background: rgba(255,152,0,.16)
    - type: horizontal-stack
      cards:
        - type: custom:button-card
          entity: button.brewassistant_mash_in_started
          name: INMÄSKNING PÅBÖRJAD
          icon: mdi:barley
          show_state: false
          show_label: true
          label: Släpp strike-målet · pump AV
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_started
            confirmation:
              text: Börjar du tillsätta malt nu? Kontrollera båda temperaturgivarna. BA byter till mäskmål och håller pumpen av.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    const b = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    return a.mash_in_gate_state === 'ready_for_mash_in' || b?.state === 'on' ? 'block' : 'none';
                  ]]]
              - border-radius: 18px
              - background: rgba(255,193,7,.12)
        - type: custom:button-card
          entity: button.brewassistant_mash_in_complete
          name: INMÄSKNING KLAR
          icon: mdi:barley-off
          show_state: false
          show_label: true
          label: Malt inrörd · börja 10 min vila · pump AV
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_complete
            confirmation:
              text: Är all malt inrörd? Kvitteringen startar maltbäddsvila och pumpen förblir AV. I Brewfather är FORTSÄTT den primära kvittensen.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    return a.mash_in_gate_state === 'mash_in_started' ? 'block' : 'none';
                  ]]]
              - border-radius: 18px
              - background: rgba(76,175,80,.12)
    - type: custom:button-card
      entity: button.brewassistant_start_mash_circulation
      name: STARTA / ÖKA RECIRKULATION
      icon: mdi:pump
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewzilla_control_reason
        - button.brewassistant_start_mash_circulation
      label: |
        [[[
          const phase = states['sensor.brewassistant_brewzilla_control_reason']?.attributes?.mash_recirculation_phase;
          return phase === 'recirculation_ready'
            ? 'Steg 1 · starta lågflöde ca 25 % · kontrollera maltbädd och avrinning'
            : 'Steg 2 · efter ca 5 min, öka till normalflöde ca 50 % endast vid stabil avrinning';
        ]]]
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_start_mash_circulation
        confirmation:
          text: Bekräfta att maltbädden dränerar bra och att nivån ovanför inte stiger. Starta lågflöde eller öka ett steg? Nivå-/flödessensor saknas; kontrollera visuellt.
      styles:
        card:
          - display: |
              [[[
                const phase = states['sensor.brewassistant_brewzilla_control_reason']?.attributes?.mash_recirculation_phase;
                return ['recirculation_ready','normal_ready'].includes(phase) ? 'block' : 'none';
              ]]]
          - border-radius: 18px
          - padding: 12px
          - background: rgba(33,150,243,.13)
          - border: 1px solid rgba(33,150,243,.4)
        label:
          - white-space: normal
          - font-size: 11px
