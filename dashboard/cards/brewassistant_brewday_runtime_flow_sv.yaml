type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewday_runtime_summary
      name: Bryggdagsruntime
      icon: mdi:beer-outline
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewday_runtime_state
        - sensor.brewassistant_brewday_runtime_stage
        - sensor.brewassistant_brewday_runtime_step
        - sensor.brewassistant_brewday_runtime_next_step
        - sensor.brewassistant_brewday_live_progress
        - sensor.brewassistant_brewday_live_time_remaining_minutes
        - sensor.brewassistant_brewday_target_temperature
        - sensor.brewassistant_brewzilla_runtime_target_temperature
      label: |
        [[[
          const clean = (v) => {
            if (v === undefined || v === null) return null;
            const s = String(v);
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
          };
          const num = (id) => {
            const n = Number(String(states[id]?.state ?? '').replace(',', '.'));
            return Number.isFinite(n) ? n : null;
          };
          const fmt = (n, u = '', d = 1) => Number.isFinite(n) ? `${n.toFixed(d)}${u ? ' ' + u : ''}` : '—';
          const state = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
          const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || '—';
          const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
          const next = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
          const progress = num('sensor.brewassistant_brewday_live_progress');
          const left = num('sensor.brewassistant_brewday_live_time_remaining_minutes');
          const bfTarget = num('sensor.brewassistant_brewday_target_temperature');
          const physicalTarget = num('sensor.brewassistant_brewzilla_runtime_target_temperature');
          const activeTarget = physicalTarget ?? bfTarget;
          const targetSource = Number.isFinite(physicalTarget) ? 'fysiskt mål' : 'BF-mål';
          return `<div style="line-height:1.3;min-width:0;">
            <div style="font-size:11px;font-weight:950;letter-spacing:.06em;opacity:.58;text-transform:uppercase;">${state} · ${stage}</div>
            <div style="font-size:22px;font-weight:950;margin-top:3px;">${step}</div>
            <div style="margin-top:5px;font-size:11.5px;font-weight:800;opacity:.72;">nästa: ${next}</div>
            <div style="margin-top:9px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;">
              <div><b>${fmt(progress,'%',0)}</b><br><span style="font-size:9px;opacity:.60;">förlopp</span></div>
              <div><b>${fmt(left,'min',0)}</b><br><span style="font-size:9px;opacity:.60;">återstår</span></div>
              <div><b>${fmt(activeTarget,'°C')}</b><br><span style="font-size:9px;opacity:.60;">${targetSource}</span></div>
              <div><b>${fmt(bfTarget,'°C')}</b><br><span style="font-size:9px;opacity:.60;">Brewfather</span></div>
            </div>
          </div>`;
        ]]]
      styles:
        card:
          - border-radius: 22px
          - padding: 14px
          - background: linear-gradient(135deg, rgba(33,150,243,.10), rgba(127,127,127,.035))
          - border: 1px solid rgba(33,150,243,.20)
        label:
          - justify-self: stretch
          - text-align: left
          - white-space: normal

    - type: custom:button-card
      entity: sensor.brewassistant_brewday_physical_timing_summary
      name: Fysisk stegtid
      icon: mdi:timer-outline
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewday_runtime_state
        - sensor.brewassistant_brewday_physical_timing_summary
        - sensor.brewassistant_brewday_physical_timing_mode
        - sensor.brewassistant_brewday_physical_elapsed_seconds
        - sensor.brewassistant_brewday_physical_remaining_seconds
        - sensor.brewassistant_brewday_physical_progress
      label: |
        [[[
          const a = entity?.attributes || {};
          const mode = String(states['sensor.brewassistant_brewday_physical_timing_mode']?.state ?? a.mode ?? 'idle');
          const step = a.step_name || 'Ingen aktiv fysisk timer';
          const elapsed = Number(states['sensor.brewassistant_brewday_physical_elapsed_seconds']?.state ?? a.elapsed_seconds);
          const remaining = Number(states['sensor.brewassistant_brewday_physical_remaining_seconds']?.state ?? a.remaining_seconds);
          const target = Number(a.target_temperature);
          const current = Number(a.current_temperature);
          const rate = Number(a.average_c_per_min);
          const mismatch = a.source_schedule_mismatch === true;
          const fmtTime = (v) => {
            if (!Number.isFinite(v)) return '—';
            const s = Math.max(0, Math.round(v));
            const m = Math.floor(s / 60);
            return `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
          };
          const clock = mode.startsWith('hold') ? `${fmtTime(remaining)} kvar` : fmtTime(elapsed);
          const temps = Number.isFinite(current) || Number.isFinite(target)
            ? `${Number.isFinite(current) ? current.toFixed(1) : '—'} → ${Number.isFinite(target) ? target.toFixed(1) : '—'} °C`
            : '—';
          return `${step} · ${clock}<br>${temps}${Number.isFinite(rate) ? ` · ${rate.toFixed(2)} °C/min` : ''}${mismatch ? '<br>⚠ BF före fysisk process' : ''}`;
        ]]]
      styles:
        card:
          - display: |
              [[[
                const runtime = String(states['sensor.brewassistant_brewday_runtime_state']?.state ?? 'idle');
                const mode = String(states['sensor.brewassistant_brewday_physical_timing_mode']?.state ?? 'idle');
                return runtime !== 'idle' && mode !== 'idle' ? 'block' : 'none';
              ]]]
          - border-radius: 18px
          - padding: 11px
          - background: rgba(0,188,212,.075)
          - border: 1px solid rgba(0,188,212,.20)
        label:
          - justify-self: start
          - text-align: left
          - white-space: normal
          - font-size: 11px
          - font-weight: 800

    - type: custom:button-card
      entity: button.brewassistant_mash_in_started
      name: Inmäskning
      icon: mdi:barley
      show_state: false
      show_label: true
      triggers_update:
        - button.brewassistant_mash_in_started
        - button.brewassistant_mash_in_complete
        - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
        - sensor.brewassistant_brewzilla_control_reason
      label: |
        [[[
          const start = states['button.brewassistant_mash_in_started'];
          const complete = states['button.brewassistant_mash_in_complete'];
          const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
          const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
          const a = start?.attributes || complete?.attributes || {};
          const state = String(a.mash_in_gate_state || a.state || gate?.attributes?.mash_in_gate_state || gate?.attributes?.state || oz.mash_in_gate_state || 'idle');
          const process = oz.process_temperature ?? oz.clean_heat_strike_gate_temperature ?? '—';
          const safety = oz.safety_temperature ?? oz.clean_heat_strike_safety_temperature ?? '—';
          const target = oz.heat_strike_target ?? oz.requested_target ?? '—';
          if (state === 'ready_for_mash_in') return `Strike redo · process ${process}°C · safety ${safety}°C · mål ${target}°C<br>Tryck INMÄSKNING PÅBÖRJAD när malten börjar tillsättas.`;
          if (state === 'mash_in_started') return 'Inmäskning pågår · pump ska vara OFF/0 · strike-target är släppt till mäskmålet.<br>När malten är inrörd: FORTSÄTT i Brewfather; manuell KLAR-knapp är reservväg.';
          return `Gate ${state} · väntar på fysisk strike-readiness från MASH/BLE.`;
        ]]]
      styles:
        card:
          - display: |
              [[[
                const start = states['button.brewassistant_mash_in_started'];
                const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                const state = String(start?.attributes?.mash_in_gate_state || start?.attributes?.state || gate?.attributes?.mash_in_gate_state || gate?.attributes?.state || oz.mash_in_gate_state || 'idle');
                return ['ready_for_mash_in','mash_in_started'].includes(state) ? 'block' : 'none';
              ]]]
          - border-radius: 18px
          - padding: 11px
          - background: rgba(255,193,7,.10)
          - border: 1px solid rgba(255,193,7,.26)
        label:
          - justify-self: start
          - text-align: left
          - white-space: normal
          - font-size: 11px
          - font-weight: 800

    - type: horizontal-stack
      cards:
        - type: custom:button-card
          entity: button.brewassistant_mash_in_started
          name: INMÄSKNING PÅBÖRJAD
          icon: mdi:barley
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_started
            confirmation:
              text: Börjar du mäska in nu? BA stoppar pumpen och släpper strike-target till mäskmålet.
          styles:
            card:
              - display: |
                  [[[
                    const a = entity?.attributes || {};
                    const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    const state = String(a.mash_in_gate_state || a.state || gate?.attributes?.mash_in_gate_state || gate?.attributes?.state || 'idle');
                    return state === 'ready_for_mash_in' ? 'block' : 'none';
                  ]]]
              - border-radius: 16px
              - padding: 10px
              - background: rgba(255,193,7,.14)
              - border: 1px solid rgba(255,193,7,.32)
            name:
              - font-size: 11px
              - font-weight: 950
        - type: custom:button-card
          entity: button.brewassistant_mash_in_complete
          name: INMÄSKNING KLAR · RESERV
          icon: mdi:pump
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_complete
            confirmation:
              text: Manuell reservväg. Normalt används FORTSÄTT i Brewfather efter inmäskning.
          styles:
            card:
              - display: |
                  [[[
                    const a = entity?.attributes || {};
                    const gate = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    const state = String(a.mash_in_gate_state || a.state || gate?.attributes?.mash_in_gate_state || gate?.attributes?.state || 'idle');
                    return state === 'mash_in_started' ? 'block' : 'none';
                  ]]]
              - border-radius: 16px
              - padding: 10px
              - background: rgba(76,175,80,.12)
              - border: 1px solid rgba(76,175,80,.28)
            name:
              - font-size: 11px
              - font-weight: 950

    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewzilla_pending_action
          state_not: "unknown"
        - entity: sensor.brewassistant_brewzilla_pending_action
          state_not: "unavailable"
        - entity: sensor.brewassistant_brewzilla_pending_action
          state_not: "none"
        - entity: sensor.brewassistant_brewzilla_pending_action
          state_not: "idle"
      card:
        type: horizontal-stack
        cards:
          - type: button
            entity: button.brewassistant_confirm_supervised_apply
            name: BEKRÄFTA
            icon: mdi:check-decagram
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.brewassistant_confirm_supervised_apply
          - type: button
            entity: button.brewassistant_cancel_supervised_apply
            name: AVVISA
            icon: mdi:cancel
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.brewassistant_cancel_supervised_apply

    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewday_runtime_state
          state_not: "idle"
      card:
        type: custom:button-card
        entity: button.brewassistant_abort_brewday
        name: ABORT BRYGGDAG
        icon: mdi:alert-octagon-outline
        show_label: true
        label: Safe-down + spärrar BA-styrning
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brewassistant_abort_brewday
          confirmation:
            text: ABORT bryggdagen? Värmare och pump stoppas och BA-styrning spärras.
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - background: rgba(244,67,54,.15)
            - border: 2px solid rgba(244,67,54,.45)
