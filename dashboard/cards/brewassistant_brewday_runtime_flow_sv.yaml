type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
  - entity: sensor.brewassistant_brewday_runtime_state
    state_not: "idle"
card:
  type: vertical-stack
  cards:
    - type: custom:expander-card
      title-card:
        type: custom:button-card
        entity: sensor.brewassistant_brewday_physical_timing_summary
        name: Fysisk stegtid
        icon: mdi:timer-outline
        show_state: false
        show_label: true
        triggers_update:
          - sensor.brewassistant_brewday_physical_timing_summary
          - sensor.brewassistant_brewday_physical_timing_mode
          - sensor.brewassistant_brewday_physical_elapsed_seconds
          - sensor.brewassistant_brewday_physical_remaining_seconds
        label: |
          [[[
            const a = entity?.attributes || {};
            const mode = String(states['sensor.brewassistant_brewday_physical_timing_mode']?.state ?? a.mode ?? 'idle');
            const step = a.step_name || 'Ingen aktiv fysisk timer';
            const elapsed = Number(states['sensor.brewassistant_brewday_physical_elapsed_seconds']?.state ?? a.elapsed_seconds);
            const remaining = Number(states['sensor.brewassistant_brewday_physical_remaining_seconds']?.state ?? a.remaining_seconds);
            const clock = s => Number.isFinite(s) ? `${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,'0')}` : '—';
            const value = mode.startsWith('hold') ? `${clock(remaining)} kvar` : clock(elapsed);
            return `${step} · ${mode} · ${value}${a.source_schedule_mismatch === true ? ' · ⚠ Brewfather före fysisk process' : ''}`;
          ]]]
        styles:
          card:
            - border-radius: 18px
            - padding: 12px
            - background: rgba(0,188,212,.075)
          label:
            - white-space: normal
            - text-align: left
            - font-size: 12px
      cards:
        - type: custom:button-card
          entity: sensor.brewassistant_brewday_physical_timing_summary
          show_name: false
          show_icon: false
          show_state: false
          show_label: true
          label: |
            [[[
              const a = entity?.attributes || {};
              const fmt = v => v == null || !Number.isFinite(Number(v)) ? '—' : Number(v).toFixed(1);
              const clock = s => Number.isFinite(Number(s)) ? `${String(Math.floor(Math.max(0,Number(s))/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,Number(s))%60)).padStart(2,'0')}` : '—';
              const rows = (Array.isArray(a.history) ? a.history : []).slice(-6).reverse().map(r => `<div style="padding:5px 0;border-bottom:1px solid rgba(127,127,127,.15)"><b>${r.name || 'Steg'}</b> · ${r.kind || '—'} · ${fmt(r.target_temperature)}°C · ${clock(r.duration_seconds)}</div>`).join('');
              return `<b>${a.step_name || 'Inget steg'}</b> · ${a.step_kind || '—'}<br>Process ${fmt(a.current_temperature)}°C / mål ${fmt(a.target_temperature)}°C<br>Förflutet ${clock(a.elapsed_seconds)} · kvar ${clock(a.remaining_seconds)} · paus ${clock(a.paused_seconds)}<br>Processgivare: ${a.temperature_entity || '—'} · mål nåddes: ${a.target_reached_at || 'nej'}<br><br><b>Fysisk steghistorik</b><br>${rows || 'Inga avslutade fysiska steg ännu.'}`;
            ]]]
          styles:
            card:
              - padding: 12px
              - border-radius: 16px
            label:
              - white-space: normal
              - text-align: left
              - font-size: 11px
    - type: custom:button-card
      entity: button.brewassistant_mash_in_override
      name: Strike-beredskap / gammal RCL-data
      icon: mdi:cloud-alert
      show_state: false
      show_label: true
      triggers_update:
        - button.brewassistant_mash_in_override
        - sensor.brewassistant_brewzilla_control_reason
      label: |
        [[[
          const a = entity?.attributes || {};
          const age = Number(a.mash_in_override_process_temperature_age_seconds);
          const fresh = a.mash_in_override_process_temperature_fresh === true;
          const available = a.mash_in_override_available === true;
          const fmt = v => v == null || !Number.isFinite(Number(v)) ? '—' : Number(v).toFixed(1);
          const ageText = Number.isFinite(age) ? `${Math.floor(age/60)}m ${Math.floor(age%60)}s` : 'okänd';
          return `${fresh ? 'MASH-data är färsk.' : `⚠ MASH-data är gammal (${ageText}); BrewZilla reglerar lokalt.`}<br>MASH ${fmt(a.mash_in_override_process_temperature)}°C · WORT ${fmt(a.mash_in_override_wort_temperature)}°C · lokalt mål ${fmt(a.mash_in_override_local_target)}°C.<br>Automatiskt ±${fmt(a.mash_in_auto_ready_tolerance_c)}°C · manuellt högst ±${fmt(a.mash_in_override_tolerance_c)}°C.${available ? '<br>Manuell READY-kvittens möjlig efter fysisk kontroll.' : ''}`;
        ]]]
      styles:
        card:
          - display: |
              [[[
                const a = entity?.attributes || {};
                return a.mash_in_override_in_scope === true && (a.mash_in_override_available === true || a.mash_in_override_process_temperature_fresh !== true) ? 'block' : 'none';
              ]]]
          - padding: 12px
          - border-radius: 18px
          - background: rgba(255,152,0,.10)
        label:
          - white-space: normal
          - text-align: left
    - type: custom:button-card
      entity: button.brewassistant_mash_in_override
      name: GODKÄNN STRIKE MANUELLT
      icon: mdi:hand-okay
      show_state: false
      show_label: true
      label: Kvitterar endast READY · fysisk kontroll · max ±2,0°C
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_mash_in_override
        confirmation:
          text: Kontrollera strike-temperaturen fysiskt. Detta kvitterar bara READY; pump, värme och mål ändras inte.
      styles:
        card:
          - display: |
              [[[ return entity?.attributes?.mash_in_override_available === true ? 'block' : 'none'; ]]]
          - border-radius: 16px
          - background: rgba(255,152,0,.16)
    - type: custom:button-card
      entity: sensor.brewassistant_brewzilla_control_reason
      name: Inmäskning och recirkulationsspärr
      icon: mdi:barley
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewzilla_control_reason
        - button.brewassistant_mash_in_started
        - button.brewassistant_mash_in_complete
        - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
        - sensor.brewassistant_brewday_runtime_source
      label: |
        [[[
          const a = entity?.attributes || {};
          const gate = a.mash_in_gate_state || states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending']?.attributes?.mash_in_gate_state || states['button.brewassistant_mash_in_started']?.attributes?.state || 'idle';
          const phase = a.mash_recirculation_phase;
          const time = s => `${Math.floor(Math.max(0,Number(s)||0)/60)}:${String(Math.floor(Math.max(0,Number(s)||0)%60)).padStart(2,'0')}`;
          const bf = states['sensor.brewassistant_brewday_runtime_source']?.state === 'Brewfather Brew Tracker';
          let msg = 'Väntar på READY. Tryck INMÄSKNING PÅBÖRJAD när malttillsatsen börjar.';
          if (gate === 'mash_in_started') msg = bf ? 'Malttillsats pågår. Efter omrörning: tryck FORTSÄTT i Brewfather. BA markerar inmäskning klar men startar INTE pumpen.' : 'Efter omrörning: tryck INMÄSKNING KLAR. Pumpen förblir AV.';
          if (phase === 'settling') msg = `Maltbäddsvila: ${time(a.mash_settle_remaining_seconds)} kvar · pump AV. Detta sker parallellt med mäskvilan.`;
          if (phase === 'recirculation_ready') msg = 'Maltbäddsvilan klar. Kontrollera bädd och avrinning; kvittera LÅGFLÖDE (ca 25 %) nedan.';
          if (phase === 'low_flow_pending') msg = 'LÅGFLÖDE begärt; väntar på verifierad återkoppling från bryggverket.';
          if (phase === 'low_flow') msg = `LÅGFLÖDE pågår · förslag om normalflöde om ${time(a.mash_recirculation_ramp_remaining_seconds)}. Kontrollera vätskenivån.`;
          if (phase === 'normal_ready') msg = 'Kontrollera avrinningen igen. Kvittera normalflöde (ca 50 %) bara om bädden dränerar bra.';
          if (phase === 'normal_pending') msg = 'Normalflöde begärt; väntar på återkoppling från bryggverket.';
          if (phase === 'normal') msg = 'Normal recirkulation bekräftad. Den fysiska mäskvilan äger fortfarande temperaturmålet tills den är klar.';
          if (phase === 'blocked' || phase === 'recovery_required') msg = `⚠ Styrningen spärrad: ${a.mash_interlock_reason || phase}. Ingen automatisk omstart; operatörsåtgärd krävs.`;
          return `${msg}<br>Gate ${gate} · fas ${phase || '—'} · fysiskt mål ${a.mash_physical_hold_target ?? '—'}°C · mäskvila ${a.mash_physical_hold_complete ? 'klar' : 'väntar'}`;
        ]]]
      styles:
        card:
          - border-radius: 18px
          - padding: 12px
          - background: rgba(127,127,127,.08)
        label:
          - white-space: normal
          - text-align: left
          - font-size: 12px
    - type: horizontal-stack
      cards:
        - type: custom:button-card
          entity: button.brewassistant_mash_in_started
          name: INMÄSKNING PÅBÖRJAD
          icon: mdi:barley
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_started
            confirmation:
              text: Börjar du tillsätta malt? BrewAssistant släpper strike-målet och håller pumpen AV.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    const g = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    return a.mash_in_gate_state === 'ready_for_mash_in' || g?.state === 'on' ? 'block' : 'none';
                  ]]]
              - border-radius: 16px
              - background: rgba(255,193,7,.14)
        - type: custom:button-card
          entity: button.brewassistant_mash_in_complete
          name: INMÄSKNING KLAR · RESERV
          icon: mdi:barley-off
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_complete
            confirmation:
              text: Är all malt inrörd? Detta STARTAR 10 minuters maltbäddsvila med pumpen AV. Brewfather FORTSÄTT är primär kvittens.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    return a.mash_in_gate_state === 'mash_in_started' ? 'block' : 'none';
                  ]]]
              - border-radius: 16px
              - background: rgba(76,175,80,.12)
    - type: custom:button-card
      entity: button.brewassistant_start_mash_circulation
      name: KVITTERA RECIRKULATIONSSTEG
      icon: mdi:pump
      show_state: false
      show_label: true
      label: |
        [[[
          const p = states['sensor.brewassistant_brewzilla_control_reason']?.attributes?.mash_recirculation_phase;
          return p === 'recirculation_ready' ? 'Steg 1: LÅGFLÖDE ca 25 % – kontrollera bädd och avrinning.' : 'Steg 2: NORMALFLÖDE ca 50 % efter fem minuter och stabil avrinning.';
        ]]]
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_start_mash_circulation
        confirmation:
          text: Kontrollera den verkliga maltbädden, vätskenivån och avrinningen. Detta skickar ett riktigt pumpkommando. Kvittera bara om förhållandena är säkra; BA saknar nivå-/flödessensor.
      styles:
        card:
          - display: |
              [[[
                const p = states['sensor.brewassistant_brewzilla_control_reason']?.attributes?.mash_recirculation_phase;
                return ['recirculation_ready','normal_ready'].includes(p) ? 'block' : 'none';
              ]]]
          - border-radius: 16px
          - background: rgba(33,150,243,.13)
        label:
          - white-space: normal
          - text-align: left
