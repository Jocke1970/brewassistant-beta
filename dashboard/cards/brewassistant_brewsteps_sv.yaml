type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
  - entity: sensor.brewassistant_brewday_runtime_source
    state: "Brewfather Brew Tracker"
  - entity: sensor.brewassistant_brewday_runtime_state
    state_not: "idle"
card:
  type: custom:button-card
  entity: sensor.brewassistant_brewday_runtime_summary
  name: Bryggsteg
  icon: mdi:map-marker-path
  show_state: false
  show_label: true
  triggers_update:
    - sensor.brewassistant_brewday_runtime_source
    - sensor.brewassistant_brewday_runtime_state
    - sensor.brewassistant_brewday_runtime_stage
    - sensor.brewassistant_brewday_runtime_step
    - sensor.brewassistant_brewday_runtime_next_step
    - sensor.brewassistant_brewday_live_progress
    - sensor.brewassistant_brewday_live_time_remaining_minutes
    - sensor.brewassistant_brewday_target_temperature
    - sensor.brewassistant_brewzilla_control_reason
  tap_action:
    action: more-info
  hold_action:
    action: more-info
  label: |
    [[[
      const clean = (v) => {
        if (v === undefined || v === null) return null;
        const s = String(v);
        return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
      };
      const num = (id) => {
        const n = Number(String(states[id]?.state ?? '').replace(',', '.'));
        return Number.isFinite(n) ? n : null;
      };
      const short = (v, m = 52) => {
        const s = String(v ?? '—');
        return s.length > m ? s.slice(0, m - 1) + '…' : s;
      };
      const fmt = (n, u = '', d = 0) => Number.isFinite(n) ? `${n.toFixed(d)}${u ? ' ' + u : ''}` : '—';

      const runtime = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
      const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || 'Idle';
      const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
      const next = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
      const progress = num('sensor.brewassistant_brewday_live_progress');
      const remaining = num('sensor.brewassistant_brewday_live_time_remaining_minutes');
      const target = num('sensor.brewassistant_brewday_target_temperature');
      const attrs = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
      const physical = String(attrs.advice_physical_phase ?? '').toLowerCase();
      const stageLc = stage.toLowerCase();
      const stepLc = step.toLowerCase();

      let current = 0;
      if (physical.startsWith('pre_mash_in')) current = 0;
      else if (stageLc.includes('mash') && (stepLc.includes('mash out') || stepLc.includes('mashout'))) current = 2;
      else if (stageLc.includes('mash')) current = 1;
      else if (stageLc.includes('sparge')) current = 3;
      else if (stageLc.includes('boil')) current = 4;
      else if (stageLc.includes('whirlpool') || stageLc.includes('hopstand') || stepLc.includes('hopstand')) current = 5;
      else if (stageLc.includes('chill') || stageLc.includes('cool')) current = 6;
      else if (stageLc.includes('transfer')) current = 7;

      const steps = [
        ['Heat strike', 'mdi:fire'],
        ['Mäskning', 'mdi:barley'],
        ['Mash out', 'mdi:thermometer-chevron-up'],
        ['Lakning', 'mdi:shower-head'],
        ['Kok', 'mdi:kettle-steam-outline'],
        ['Hopstand', 'mdi:leaf'],
        ['Kylning', 'mdi:snowflake-thermometer'],
        ['Transfer', 'mdi:transfer']
      ];
      const phase = (label, icon, idx) => {
        const done = idx < current;
        const active = idx === current;
        const bg = active ? 'rgba(33,150,243,.14)' : done ? 'rgba(76,175,80,.11)' : 'rgba(127,127,127,.055)';
        const border = active ? 'rgba(33,150,243,.34)' : done ? 'rgba(76,175,80,.25)' : 'rgba(127,127,127,.12)';
        const glyph = done ? 'mdi:check-circle' : icon;
        return `<div style="min-width:0;padding:8px 5px;border-radius:13px;background:${bg};border:1px solid ${border};text-align:center;opacity:${active || done ? '1' : '.58'};"><ha-icon icon="${glyph}" style="width:17px;height:17px;"></ha-icon><div style="margin-top:3px;font-size:9.5px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</div></div>`;
      };

      return `<div style="line-height:1.25;min-width:0;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
          <div style="min-width:0;"><div style="font-size:11px;font-weight:900;letter-spacing:.06em;opacity:.62;text-transform:uppercase;">BRYGGSTEG · BREWTRACKER ÄGER</div><div style="margin-top:3px;font-size:11px;font-weight:800;opacity:.68;">Read-only processvy · Brewfather/BrewTracker äger stegföljden</div></div>
          <div style="display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:rgba(33,150,243,.10);border:1px solid rgba(33,150,243,.24);font-size:10.5px;font-weight:950;white-space:nowrap;"><ha-icon icon="mdi:lock-outline" style="width:13px;height:13px;"></ha-icon>READ ONLY</div>
        </div>
        <div style="margin-top:9px;text-align:center;"><div style="font-size:21px;font-weight:950;letter-spacing:-.035em;">${short(step, 62)}</div><div style="margin-top:4px;font-size:11.5px;font-weight:800;opacity:.70;">${runtime} · ${stage} · nästa: ${short(next, 54)}</div></div>
        <div style="margin-top:11px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;">${steps.slice(0,4).map((s,i)=>phase(s[0],s[1],i)).join('')}</div>
        <div style="margin-top:6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;">${steps.slice(4).map((s,i)=>phase(s[0],s[1],i+4)).join('')}</div>
        <div style="margin-top:9px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;">
          <div style="padding:7px;border-radius:12px;background:rgba(33,150,243,.08);border:1px solid rgba(33,150,243,.18);text-align:center;"><b>${fmt(progress, '%')}</b><br><span style="font-size:9.5px;opacity:.62;">förlopp</span></div>
          <div style="padding:7px;border-radius:12px;background:rgba(0,188,212,.08);border:1px solid rgba(0,188,212,.18);text-align:center;"><b>${fmt(remaining, 'min')}</b><br><span style="font-size:9.5px;opacity:.62;">återstår</span></div>
          <div style="padding:7px;border-radius:12px;background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.18);text-align:center;"><b>${fmt(target, '°C', 1)}</b><br><span style="font-size:9.5px;opacity:.62;">mål</span></div>
        </div>
      </div>`;
    ]]]
  styles:
    card:
      - border-radius: 22px
      - padding: 14px
      - background: linear-gradient(135deg, rgba(33,150,243,.075), rgba(127,127,127,.035))
      - border: 1px solid rgba(33,150,243,.18)
      - box-shadow: 0 2px 10px rgba(0,0,0,.07)
    grid:
      - grid-template-areas: "\"i n\" \"i l\""
      - grid-template-columns: 40px minmax(0,1fr)
      - column-gap: 11px
    icon:
      - width: 25px
      - height: 25px
    img_cell:
      - width: 40px
      - height: 40px
      - border-radius: 50%
      - background: rgba(33,150,243,.10)
    name:
      - justify-self: start
      - font-size: 15px
      - font-weight: 950
    label:
      - justify-self: stretch
      - text-align: left
      - white-space: normal
