# HLT-kort: endast simulering och avläsning. Inga fysiska styråtgärder.
# Observerat effektutrymme är inte ett elektriskt säkerhetsvillkor.
type: custom:button-card
entity: sensor.brewassistant_hlt_status
name: HLT simulering
show_icon: false
show_name: false
show_state: false
show_label: true
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
triggers_update:
  - sensor.brewassistant_hlt_status
  - sensor.brewassistant_hlt_reason
  - sensor.brewassistant_hlt_power_owner
  - sensor.brewassistant_hlt_actual_energy_recipient
  - sensor.brewassistant_hlt_virtual_energy_recipient
  - sensor.brewassistant_hlt_brewzilla_power_observed
  - sensor.brewassistant_hlt_power_observed
  - sensor.brewassistant_hlt_power_virtual
  - sensor.brewassistant_hlt_total_power_observed
  - sensor.brewassistant_hlt_total_power_virtual_scenario
  - sensor.brewassistant_hlt_budget_scenario
  - sensor.brewassistant_hlt_headroom_observed
  - sensor.brewassistant_hlt_temperature
  - sensor.brewassistant_hlt_temperature_measured
  - sensor.brewassistant_hlt_temperature_estimated
  - sensor.brewassistant_hlt_temperature_source
  - sensor.brewassistant_hlt_target_temperature
  - sensor.brewassistant_hlt_volume
  - sensor.brewassistant_hlt_total_session_seconds
  - sensor.brewassistant_hlt_virtual_heating_seconds
  - sensor.brewassistant_hlt_observed_heating_estimate_seconds
  - sensor.brewassistant_hlt_waiting_seconds
  - sensor.brewassistant_hlt_yielding_seconds
  - sensor.brewassistant_hlt_unknown_sample_seconds
  - sensor.brewassistant_hlt_brewzilla_energy_estimate_wh
  - sensor.brewassistant_hlt_energy_estimate_wh
  - sensor.brewassistant_hlt_yield_count
  - sensor.brewassistant_hlt_reclaim_count
  - sensor.brewassistant_hlt_trace_path
label: |
  [[[
    // Okänt/otillgängligt är saknad data, ALDRIG noll.
    const raw = (key) => {
      const value = states[`sensor.brewassistant_hlt_${key}`]?.state;
      return value == null || ['unknown', 'unavailable', 'none', ''].includes(String(value).toLowerCase())
        ? null : String(value);
    };
    const number = (key) => {
      const value = raw(key);
      if (value === null) return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    };
    const watts = (key) => {
      const n = number(key);
      return n === null ? '—' : `${n.toFixed(0)} W`;
    };
    const temperature = (key) => {
      const n = number(key);
      return n === null ? '—' : `${n.toFixed(1)} °C`;
    };
    const seconds = (key) => {
      const n = number(key);
      if (n === null) return '—';
      const s = Math.max(0, Math.round(n));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    };
    const statusLabels = {
      IDLE: 'Viloläge', WAITING_FOR_POWER: 'Väntar på BZ', HEATING: 'Virtuell värmning',
      YIELDING: 'Lämnar effekt till BZ', READY: 'Target nått (simulering)',
      waiting_for_data: 'Inga sessionsdata', waiting_for_brewday_recorder: 'Bryggdag ej aktiv',
      brewday_inactive_or_aborted: 'Bryggdag stoppad', waiting_for_sparge_volume: 'Lakvattenvolym saknas',
      error: 'Simuleringsfel'
    };
    const reasons = {
      cruise_power_opportunity_simulated: 'BZ håller temperaturen · simulerad HLT-möjlighet',
      brewzilla_ramp_priority: 'BZ rampar · virtuell HLT pausas',
      brewzilla_power_priority: 'BZ behöver effekt · virtuell HLT pausas',
      brewzilla_ramp_or_not_cruising: 'BZ behöver företräde',
      not_enough_observed_capacity: 'Inget observerat utrymme i scenariot',
      brewzilla_power_or_request_unknown: 'BZ-mätvärden saknas',
      awaiting_virtual_off_confirmation: 'Väntar på VIRTUELL frigivning (ej fysiskt frånslag)',
      disabled_or_no_sparge: 'Ingen lakning / simulering inaktiv',
      target_reached_measured: 'Uppmätt target nått',
      target_reached_estimated: 'Uppskattat target nått',
      heater_stop: 'Virtuell värmning stoppad'
    };
    const recipients = {
      brewzilla: 'BZ', hlt: 'HLT', brewzilla_and_hlt: 'BZ + HLT', neither: 'Ingen', unknown: 'Okänt'
    };
    const status = raw('status');
    const reason = raw('reason');
    const realRecipient = recipients[raw('actual_energy_recipient')] || 'Okänt';
    const virtualRecipient = raw('virtual_energy_recipient') === 'hlt' ? 'HLT (virtuell)' :
      raw('virtual_energy_recipient') === 'none' ? 'Ingen' : 'Okänt';
    const owner = raw('power_owner') === 'brewzilla_with_virtual_hlt'
      ? 'BZ prioriterad · virtuell HLT tillåten' : 'BZ prioriterad · HLT sekundär';
    const source = raw('temperature_source');
    const sourceLabels = {
      measured: 'UPPMÄTT', estimated: 'MODELLUPPSKATTNING',
      thermostat_calibrated_estimate: 'TERMOSTATKALIBRERAD UPPSKATTNING'
    };
    const sourceText = sourceLabels[source] || 'INGEN TEMPERATURKÄLLA';
    const budget = number('budget_scenario');
    const bz = number('brewzilla_power_observed');
    const virtual = number('power_virtual');
    const bar = (value, color) => {
      if (value === null || budget === null || budget <= 0) return '<span style="opacity:.5;">Ingen stapel · mätning saknas</span>';
      const percent = Math.max(0, Math.min(100, value / budget * 100));
      return `<div style="height:7px;border-radius:99px;background:rgba(127,127,127,.19);overflow:hidden;margin:5px 0 0;"><div style="height:100%;width:${percent}%;background:${color};border-radius:99px;"></div></div>`;
    };
    const box = (title, value, note) => `<div style="padding:10px;border-radius:12px;border:1px solid rgba(127,127,127,.20);background:rgba(127,127,127,.05);min-width:0;"><div style="font-size:10px;letter-spacing:.04em;opacity:.68;font-weight:850;">${title}</div><div style="font-size:20px;font-weight:900;margin-top:4px;">${value}</div><div style="font-size:10px;opacity:.72;margin-top:4px;line-height:1.35;">${note}</div></div>`;
    const heading = (text) => `<div style="font-size:11px;font-weight:950;letter-spacing:.08em;opacity:.67;margin:14px 0 8px;text-transform:uppercase;">${text}</div>`;
    const row = (title, value) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(127,127,127,.12);font-size:11px;"><span style="opacity:.72;">${title}</span><b style="text-align:right;">${value}</b></div>`;
    const energy = (key) => {
      const n = number(key);
      return n === null ? '—' : `${n.toFixed(1)} Wh`;
    };
    const trace = raw('trace_path');
    const basename = trace && /^[/a-zA-Z0-9_.-]+$/.test(trace) ? trace.split('/').pop() : '—';
    return `<div style="width:100%;box-sizing:border-box;text-align:left;line-height:1.3;min-width:0;">
      <div style="display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
        <div><div style="font-size:18px;font-weight:950;">⚡ HLT · Effektfördelning</div><div style="font-size:12px;margin-top:4px;font-weight:850;">${statusLabels[status] || 'Väntar på telemetri'}</div></div>
        <span style="font-size:10px;font-weight:950;padding:5px 8px;border:1px solid rgba(255,193,7,.5);border-radius:99px;background:rgba(255,193,7,.12);">ENDAST SIMULERING · INGEN STYRNING</span>
      </div>
      <div style="font-size:11px;opacity:.77;margin-top:9px;">${reasons[reason] || 'Inget aktuellt beslut'} · ${owner}</div>
      ${heading('Vem får energi?')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">
        ${box('FYSISKT · observerad mottagare',realRecipient,'Kräver BÅDA effektmätarna; okänt ≠ noll.')}
        ${box('SIMULERING · HLT-mottagare',virtualRecipient,'Virtuellt klartecken är INTE fysisk tillslagning.')}
      </div>
      ${heading('Effekt just nu · uppmätt och virtuell')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">
        <div style="padding:10px;border-radius:12px;border:1px solid rgba(33,150,243,.25);background:rgba(33,150,243,.055);"><b style="font-size:11px;">BrewZilla · mätarkandidat</b><div style="font-size:24px;font-weight:950;margin-top:5px;">${watts('brewzilla_power_observed')}</div>${bar(bz,'#2196f3')}</div>
        <div style="padding:10px;border-radius:12px;border:1px solid rgba(255,152,0,.28);background:rgba(255,152,0,.055);"><b style="font-size:11px;">HLT · hypotetisk värmare</b><div style="font-size:24px;font-weight:950;margin-top:5px;">${watts('power_virtual')}</div>${bar(virtual,'#ff9800')}</div>
      </div>
      <div style="margin-top:8px;">${row('HLT fysisk effektmätare',watts('power_observed'))}${row('Verklig total (båda mätarna)',watts('total_power_observed'))}${row('Scenario totalt (BZ + virtuell HLT)',watts('total_power_virtual_scenario'))}${row('Scenariobudget · EJ säkringsgräns',watts('budget_scenario'))}${row('Observerat utrymme · EJ starttillstånd',watts('headroom_observed'))}</div>
      ${heading('HLT · vattentemperatur')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;">
        ${box('NU · '+sourceText,temperature('temperature'),'Temperatur och källa ska alltid visas tillsammans.')}
        ${box('TARGET · scenario',temperature('target_temperature'),`Vatten: ${number('volume') === null ? '—' : number('volume').toFixed(1)+' L'}`)}
      </div>
      <div style="margin-top:8px;">${row('Uppmätt givare',temperature('temperature_measured'))}${row('Modell/kalibrerad uppskattning',temperature('temperature_estimated'))}</div>
      ${heading('HLT · tidräknare')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;">
        ${box('TOTALT · väggtid',seconds('total_session_seconds'),'Sedan första aktiva HLT-begäran.')}
        ${box('EFFEKTIV · virtuell värme',seconds('virtual_heating_seconds'),'Simulerad tillslagstid uppskattad från prover.')}
        ${box('EFFEKTIV · uppmätt uppskattning',seconds('observed_heating_estimate_seconds'),'Kräver effekt OCH switch på vid båda provpunkterna.')}
      </div>
      <div style="margin-top:8px;">${row('Väntar på BZ',seconds('waiting_seconds'))}${row('Ger företräde till BZ',seconds('yielding_seconds'))}${row('Oobserverade tidsluckor',seconds('unknown_sample_seconds'))}${row('Virtuella pausningar / BZ-återtag',`${raw('yield_count') ?? '—'} / ${raw('reclaim_count') ?? '—'}`)}${row('Uppskattad energi BZ / fysisk HLT',`${energy('brewzilla_energy_estimate_wh')} / ${energy('energy_estimate_wh')}`)}</div>
      <div style="margin-top:12px;padding:9px;border-radius:10px;background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.24);font-size:10px;line-height:1.5;">⚠ 30 s mätintervall är inget elsäkerhetsskydd. BZ har alltid företräde och begränsas aldrig. Mätarens anslutning ska verifieras vid BZ-testet. Tider/Wh är uppskattningar som nollställs vid HA-omstart. Inga fysiska HLT-reglage finns här.</div>
      <div style="font-size:10px;opacity:.58;margin-top:8px;">JSONL-logg: ${basename} · full sökväg: sensor.brewassistant_hlt_trace_path</div>
    </div>`;
  ]]]
styles:
  card:
    - border-radius: 20px
    - padding: 16px
    - background: rgba(18,30,43,.44)
    - border: 1px solid rgba(127,127,127,.24)
  label:
    - width: 100%
    - justify-self: stretch
    - text-align: left
    - white-space: normal
    - overflow: visible
    - font-size: 12px
