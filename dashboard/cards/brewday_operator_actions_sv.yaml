# BA-only action controls. Observation is fail-closed in backend; UI is not a safety boundary.
type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state: observe-only
      card:
        type: markdown
        content: >-
          **ENDAST OBSERVATION · STYR BREWZILLA LOKALT** 🔒

          BA:s åtgärdsknappar är dolda. Använd BrewZillas egna reglage för värme,
          pump och stopp. BA skickar inte ens OFF/0 %. Kontrollera fysisk
          avstängning på bryggverket. Separat återaktivering krävs även om
          observationsswitchen ställts på AV.
    - type: conditional
      conditions:
        - entity: switch.brewassistant_brewzilla_observe_only
          state: "off"
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state_not: observe-only
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state_not: unavailable
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state_not: unknown
      card:
        type: vertical-stack
        cards:
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewday_runtime_state
                state: "idle"
              - entity: sensor.brewfather_brew_tracker_status
                state_not: "active"
            card:
              type: custom:button-card
              name: FÖRBERED MANUELL BRYGGDAG
              icon: mdi:clipboard-check-outline
              show_state: false
              show_label: true
              label: Aktiverar Manual Brewday utan att starta bryggningen
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_prepare
              styles:
                card:
                  - border-radius: 16px
                  - padding: 12px
                  - min-height: 64px
                  - background: rgba(255,152,0,.10)
                  - border: 1px solid rgba(255,152,0,.24)
                label:
                  - white-space: normal
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: "unknown"
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: "unavailable"
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: "none"
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: "idle"
            card:
              type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: button.brewassistant_confirm_supervised_apply
                  triggers_update:
                    - sensor.brewassistant_brewzilla_pending_action
                  name: BEKRÄFTA ÅTGÄRD
                  icon: mdi:check-decagram
                  show_label: true
                  label: KVITTENS VÄNTAR · endast aktuell plan
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_confirm_supervised_apply
                    confirmation:
                      text: Bekräfta aktuell väntande BA-åtgärd? Kontrollera planen och BrewZilla lokalt.
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 10px
                      - min-height: 58px
                      - background: rgba(76,175,80,.22)
                      - border: 2px solid rgba(76,175,80,.72)
                      - animation: ba-confirm-pulse 1.4s ease-in-out infinite
                    label:
                      - white-space: normal
                  extra_styles: |
                    @keyframes ba-confirm-pulse {
                      0%, 100% { transform: scale(1); box-shadow: 0 0 0 2px rgba(76,175,80,.10); }
                      50% { transform: scale(1.018); box-shadow: 0 0 0 6px rgba(76,175,80,.18); }
                    }
                    @media (prefers-reduced-motion: reduce) {
                      #card { animation: none !important; transform: none !important; }
                    }
                - type: custom:button-card
                  entity: button.brewassistant_cancel_supervised_apply
                  name: AVVISA ÅTGÄRD
                  icon: mdi:cancel
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_cancel_supervised_apply
                    confirmation:
                      text: Avvisa den aktuella väntande BrewAssistant-planen?
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 12px
                      - background: rgba(255,152,0,.10)
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewday_runtime_state
                state_not: "idle"
            card:
              type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: button.brewassistant_abort_brewday
                  name: ABORT BRYGGDAG
                  icon: mdi:alert-octagon-outline
                  show_label: true
                  label: Spärrar BA. Fysisk OFF är inte garanterad.
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_abort_brewday
                    confirmation:
                      text: Avbryt BA:s bryggdag och spärra BA-styrning? Kontrollera värmare, pump och effekt på BrewZilla separat. Fysisk avstängning är inte garanterad.
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 10px
                      - min-height: 62px
                      - background: rgba(244,67,54,.16)
                      - border: 2px solid rgba(244,67,54,.50)
                    label:
                      - white-space: normal
                - type: conditional
                  conditions:
                    - entity: sensor.brewassistant_brewday_operator_control_state
                      state: "aborted"
                  card:
                    type: custom:button-card
                    entity: button.brewassistant_rearm_brewday_control
                    name: ÅTERAKTIVERA STYRNING
                    icon: mdi:shield-check-outline
                    show_label: true
                    label: Släpper enbart BA:s ABORT-spärr · inte observation
                    tap_action:
                      action: call-service
                      service: button.press
                      target:
                        entity_id: button.brewassistant_rearm_brewday_control
                      confirmation:
                        text: Släpp BA:s operatörs-ABORT? Observationsläget, dess separata återaktivering och BrewZillas ABORT-spärr gäller fortfarande.
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 10px
                        - min-height: 62px
                        - background: rgba(255,193,7,.14)
                      label:
                        - white-space: normal
