# Beta.14: BA actions are entirely hidden until observe-only has been explicitly rearmed.
# No UI condition replaces the independent backend write guard.
type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state: observe-only
      card:
        type: markdown
        content: >-
          **ENDAST OBSERVATION · STYR BREWZILLA LOKALT** 🔒

          BA:s åtgärdsknappar är dolda. Använd BrewZillas egna reglage
          för värme, pump och stopp. Observation skickar inte ens OFF/0 %;
          fysisk avstängning måste kontrolleras på bryggverket.
          Om switchen redan är AV krävs fortfarande separat återaktivering
          i operatörskortet.
    - type: conditional
      conditions:
        - entity: switch.brewassistant_brewzilla_observe_only
          state: "off"
        - entity: sensor.brewassistant_brewzilla_orchestration_mode
          state_not: observe-only
      card:
        type: vertical-stack
        cards:
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewday_runtime_state
                state: idle
              - entity: sensor.brewfather_brew_tracker_status
                state_not: active
            card:
              type: custom:button-card
              name: FÖRBERED MANUELL BRYGGDAG
              icon: mdi:clipboard-check-outline
              show_state: false
              show_label: true
              label: Aktiverar Manual Brewday utan att starta bryggningen
              tap_action:
                action: call-service
                service: brewassistant.manual_brewday_prepare
              styles:
                card:
                  - border-radius: 16px
                  - padding: 12px
                  - background: rgba(255,152,0,.10)
                label:
                  - white-space: normal
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: unknown
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: unavailable
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: none
              - entity: sensor.brewassistant_brewzilla_pending_action
                state_not: idle
            card:
              type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: button.brewassistant_confirm_supervised_apply
                  name: BEKRÄFTA ÅTGÄRD
                  icon: mdi:check-decagram
                  show_label: true
                  label: Endast den aktuella väntande planen
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_confirm_supervised_apply
                    confirmation:
                      text: Bekräfta aktuell BrewAssistant-åtgärd? Kontrollera aktuell plan och BrewZilla lokalt.
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 12px
                      - background: rgba(76,175,80,.20)
                    label:
                      - white-space: normal
                - type: custom:button-card
                  entity: button.brewassistant_cancel_supervised_apply
                  name: AVVISA ÅTGÄRD
                  icon: mdi:cancel
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_cancel_supervised_apply
                    confirmation:
                      text: Avvisa den aktuella väntande BrewAssistant-planen?
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 12px
                      - background: rgba(255,152,0,.10)
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewday_runtime_state
                state_not: idle
            card:
              type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: button.brewassistant_abort_brewday
                  name: ABORT BRYGGDAG
                  icon: mdi:alert-octagon-outline
                  show_label: true
                  label: Spärrar BA. Fysisk OFF är inte garanterad.
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.brewassistant_abort_brewday
                    confirmation:
                      text: Avbryt BA:s bryggdag och spärra BA-styrning? Kontrollera separat värmare, pump och effekt på BrewZilla; fysisk avstängning är inte garanterad.
                  styles:
                    card:
                      - border-radius: 16px
                      - padding: 12px
                      - background: rgba(244,67,54,.16)
                    label:
                      - white-space: normal
                - type: conditional
                  conditions:
                    - entity: sensor.brewassistant_brewday_operator_control_state
                      state: aborted
                  card:
                    type: custom:button-card
                    entity: button.brewassistant_rearm_brewday_control
                    name: SLÄPP ABORT-SPÄRR
                    icon: mdi:shield-check-outline
                    show_label: true
                    label: Inte samma sak som observationslägets återaktivering
                    tap_action:
                      action: call-service
                      service: button.press
                      target:
                        entity_id: button.brewassistant_rearm_brewday_control
                      confirmation:
                        text: Släppa BA:s ABORT-spärr? Observationsläge och övriga säkerhetsspärrar gäller separat. Verifiera bryggverket lokalt.
                    styles:
                      card:
                        - border-radius: 16px
                        - padding: 12px
                        - background: rgba(255,193,7,.14)
                      label:
                        - white-space: normal
