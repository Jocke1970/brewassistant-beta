type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewday_runtime_state
          state: "idle"
        - entity: sensor.brewfather_brew_tracker_status
          state_not: "active"
      card:
        type: custom:button-card
        name: FÖRBERED MANUELL BRYGGDAG
        icon: mdi:clipboard-check-outline
        show_state: false
        show_label: true
        label: Aktiverar Manual Brewday utan att starta bryggningen
        tap_action:
          action: call-service
          service: brewassistant.manual_brewday_prepare
        styles:
          card:
            - border-radius: 16px
            - padding: 12px
            - min-height: 64px
            - background: rgba(255,152,0,.10)
            - border: 1px solid rgba(255,152,0,.24)
          icon:
            - width: 24px
            - height: 24px
            - color: rgb(255,152,0)
          name:
            - font-size: 12px
            - font-weight: 950
          label:
            - font-size: 10.5px
            - font-weight: 750
            - opacity: 0.72
            - white-space: normal
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewzilla_pending_action
          state_not: "unknown"
        - entity: sensor.brewassistant_brewzilla_pending_action
          state_not: "unavailable"
        - entity: sensor.brewassistant_brewzilla_pending_action
          state_not: "none"
        - entity: sensor.brewassistant_brewzilla_pending_action
          state_not: "idle"
      card:
        type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: button.brewassistant_confirm_supervised_apply
            triggers_update:
              - sensor.brewassistant_brewzilla_pending_action
            name: |
              [[[
                const raw = String(states['sensor.brewassistant_brewzilla_pending_action']?.state ?? '').toLowerCase();
                return !['', 'unknown', 'unavailable', 'none', 'idle'].includes(raw) ? 'BEKRÄFTA ÅTGÄRD' : 'BEKRÄFTA';
              ]]]
            icon: mdi:check-decagram
            show_label: true
            label: KVITTENS VÄNTAR
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.brewassistant_confirm_supervised_apply
              confirmation:
                text: Bekräfta väntande övervakad BrewAssistant-åtgärd?
            styles:
              card:
                - border-radius: 16px
                - padding: 10px
                - min-height: 58px
                - background: rgba(76,175,80,.22)
                - border: 2px solid rgba(76,175,80,.72)
                - animation: ba-confirm-pulse 1.4s ease-in-out infinite
              icon:
                - color: rgb(76,175,80)
              name:
                - font-size: 12px
                - font-weight: 950
              label:
                - font-size: 9.5px
                - font-weight: 900
                - opacity: 0.72
            extra_styles: |
              @keyframes ba-confirm-pulse {
                0%, 100% { transform: scale(1); box-shadow: 0 0 0 2px rgba(76,175,80,.10); }
                50% { transform: scale(1.018); box-shadow: 0 0 0 6px rgba(76,175,80,.18); }
              }
              @media (prefers-reduced-motion: reduce) {
                #card { animation: none !important; transform: none !important; }
              }
          - type: custom:button-card
            entity: button.brewassistant_cancel_supervised_apply
            name: AVVISA ÅTGÄRD
            icon: mdi:cancel
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.brewassistant_cancel_supervised_apply
              confirmation:
                text: Avvisa väntande övervakad BrewAssistant-åtgärd?
            styles:
              card:
                - border-radius: 16px
                - padding: 10px
                - background: rgba(255,152,0,.09)
                - border: 1px solid rgba(255,152,0,.24)
              name:
                - font-size: 12px
                - font-weight: 950
    - type: conditional
      conditions:
        - entity: sensor.brewassistant_brewday_runtime_state
          state_not: "idle"
      card:
        type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: button.brewassistant_abort_brewday
            name: ABORT BRYGGDAG
            icon: mdi:alert-octagon-outline
            show_label: true
            label: Safe-down + spärrar BA-styrning
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.brewassistant_abort_brewday
              confirmation:
                text: ABORT bryggdagen? Värmare och pump stoppas, utilization nollställs och BrewAssistant-styrning spärras tills du återaktiverar den.
            styles:
              card:
                - border-radius: 16px
                - padding: 10px
                - min-height: 62px
                - background: rgba(244,67,54,.16)
                - border: 2px solid rgba(244,67,54,.50)
              icon:
                - color: rgb(244,67,54)
              name:
                - font-size: 12px
                - font-weight: 950
              label:
                - font-size: 9.5px
                - font-weight: 850
                - opacity: 0.78
          - type: conditional
            conditions:
              - entity: sensor.brewassistant_brewday_operator_control_state
                state: "aborted"
            card:
              type: custom:button-card
              entity: button.brewassistant_rearm_brewday_control
              name: ÅTERAKTIVERA STYRNING
              icon: mdi:shield-check-outline
              show_label: true
              label: Släpper BA:s operator-ABORT
              tap_action:
                action: call-service
                service: button.press
                target:
                  entity_id: button.brewassistant_rearm_brewday_control
                confirmation:
                  text: Återaktivera BrewAssistant-styrning? BrewZillas separata ABORT-lockout gäller fortfarande tills den löper ut.
              styles:
                card:
                  - border-radius: 16px
                  - padding: 10px
                  - min-height: 62px
                  - background: rgba(255,193,7,.14)
                  - border: 1px solid rgba(255,193,7,.34)
                icon:
                  - color: rgb(255,193,7)
                name:
                  - font-size: 11px
                  - font-weight: 950
                label:
                  - font-size: 9.5px
                  - font-weight: 850
                  - opacity: 0.78
