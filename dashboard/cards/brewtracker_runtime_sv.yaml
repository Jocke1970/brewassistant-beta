type: conditional
conditions:
  - condition: or
    conditions:
      - condition: state
        entity: sensor.brewassistant_brewfather_batch_phase
        state: "planning"
      - condition: state
        entity: sensor.brewassistant_brewfather_batch_phase
        state: "brewing"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewday_runtime_summary
      name: BrewTracker-runtime
      icon: mdi:timer-play-outline
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewfather_batch_phase
        - sensor.brewassistant_brewday_runtime_summary
        - sensor.brewassistant_brewday_runtime_state
        - sensor.brewassistant_brewday_runtime_status
        - sensor.brewassistant_brewday_runtime_stage
        - sensor.brewassistant_brewday_runtime_step
        - sensor.brewassistant_brewday_runtime_next_step
        - sensor.brewassistant_brewday_live_progress
        - sensor.brewassistant_brewday_live_time_remaining_minutes
        - sensor.brewassistant_brewday_snapshot_age_minutes
        - sensor.brewassistant_brewday_target_temperature
        - sensor.brewfather_brew_tracker_status
        - sensor.brewassistant_brewzilla_control_reason
      tap_action:
        action: more-info
      hold_action:
        action: call-service
        service: brewassistant.force_brewfather_refresh
      label: |
        [[[
          const clean = (v) => {
            if (v === undefined || v === null) return null;
            const s = String(v);
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
          };
          const num = (id) => {
            const n = Number(String(states[id]?.state ?? '').replace(',', '.'));
            return Number.isFinite(n) ? n : null;
          };
          const attrNum = (attrs, key) => {
            const n = Number(String(attrs?.[key] ?? '').replace(',', '.'));
            return Number.isFinite(n) ? n : null;
          };
          const boolish = (v) => {
            const s = String(v ?? '').toLowerCase();
            return v === true || ['on','true','yes','1'].includes(s);
          };
          const fmt = (n, u = '', d = 1) => Number.isFinite(n) ? `${n.toFixed(d)}${u ? ' ' + u : ''}` : '—';
          const short = (v, m = 56) => String(v ?? '—').length > m ? String(v ?? '—').slice(0, m - 1) + '…' : String(v ?? '—');

          const phase = clean(states['sensor.brewassistant_brewfather_batch_phase']?.state) || 'inactive';
          const bfEntity = states['sensor.brewfather_brew_tracker_status'];
          const bfStatus = clean(bfEntity?.state) || 'inactive';
          const runtime = clean(states['sensor.brewassistant_brewday_runtime_state']?.state) || 'idle';
          const status = clean(states['sensor.brewassistant_brewday_runtime_status']?.state) || runtime;
          const stage = clean(states['sensor.brewassistant_brewday_runtime_stage']?.state) || '—';
          const step = clean(states['sensor.brewassistant_brewday_runtime_step']?.state) || '—';
          const next = clean(states['sensor.brewassistant_brewday_runtime_next_step']?.state) || '—';
          const progress = num('sensor.brewassistant_brewday_live_progress');
          const remaining = num('sensor.brewassistant_brewday_live_time_remaining_minutes');
          const age = num('sensor.brewassistant_brewday_snapshot_age_minutes');
          const target = num('sensor.brewassistant_brewday_target_temperature');
          const progressWidth = Number.isFinite(progress) ? Math.max(0, Math.min(100, progress)) : 0;

          const planning = phase === 'planning';
          const prestart = phase === 'brewing' && runtime === 'idle' && String(bfStatus).toLowerCase() === 'paused';

          const oz = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
          const cleanHeat = boolish(oz.clean_heat_strike_active);
          const heatLatch = boolish(oz.heat_strike_latch_active);
          const physicalPhase = clean(oz.advice_physical_phase) || '';
          const mashGateState = clean(oz.mash_in_gate_state) || 'idle';
          const preMashHeatstrike = !planning && !prestart && (cleanHeat || (heatLatch && String(physicalPhase).startsWith('pre_mash_in')));
          const strikeTarget = attrNum(oz, 'heat_strike_target') ?? attrNum(oz, 'heat_strike_clean_control_target') ?? target;
          const gateTemp = attrNum(oz, 'clean_heat_strike_gate_temperature');
          const gateDelta = attrNum(oz, 'clean_heat_strike_gate_delta_to_target');
          const safetyTemp = attrNum(oz, 'clean_heat_strike_safety_temperature');
          const heat = attrNum(oz, 'desired_heat_utilization');
          const pump = attrNum(oz, 'desired_pump_utilization');

          let statusText;
          let activeTitle;
          let activeSub;
          let nextBox;

          if (planning) {
            statusText = 'PLANNING · Brewfather ansluten · BrewTracker ännu inte startad';
            activeTitle = 'BrewTracker redo';
            activeSub = 'Recept/batch är förberedd · ingen hot-side ownership';
            nextBox = 'Nästa: sätt batchen till Brewing. BrewAssistant tar fortfarande inte över förrän BrewTracker faktiskt startas med Play.';
          } else if (prestart) {
            statusText = 'BREWING · PAUSAD PÅ START · väntar på Play';
            activeTitle = 'Väntar på BrewTracker Play';
            activeSub = 'Batchfasen är Brewing, men BrewAssistant äger inte hot-side ännu.';
            nextBox = 'Nästa: tryck Play / Starta mäsktimer i Brewfather. Först då får BrewTracker hot-side ownership.';
          } else if (preMashHeatstrike) {
            statusText = `BF ${bfStatus} · BA styr fysisk heatstrike`;
            activeTitle = `BA Heatstrike ${fmt(strikeTarget, '°C')}`;
            activeSub = `Mash/BLE-gate ${fmt(gateTemp, '°C')} · Δ ${fmt(gateDelta, '°C')} · vörtsäkerhet ${fmt(safetyTemp, '°C')}`;
            nextBox = `Fysiskt nästa: nå strike → inmäskning → BF FORTSÄTT efter inmäskning`;
          } else {
            const paused = String(bfStatus).toLowerCase() === 'paused' || String(status).toLowerCase() === 'paused';
            statusText = paused ? 'PAUSAD · väntar på operatör/BF FORTSÄTT' : `BF ${bfStatus} · ${runtime} / ${status} · ${stage}`;
            activeTitle = short(step, 64);
            activeSub = `Nuvarande steg · ${fmt(progress, '%', 0)} · ${fmt(remaining, 'min', 0)} kvar`;
            nextBox = `Nästa: ${short(next, 72)}`;
          }

          const phaseLabel = planning ? 'planning' : prestart ? 'pre-start' : phase;
          const chipBg = planning
            ? 'rgba(255,193,7,.13)'
            : prestart
              ? 'rgba(76,175,80,.22)'
              : phase === 'brewing'
                ? 'rgba(244,67,54,.22)'
                : 'rgba(33,150,243,.11)';
          const chipBorder = planning
            ? 'rgba(255,193,7,.28)'
            : prestart
              ? 'rgba(76,175,80,.50)'
              : phase === 'brewing'
                ? 'rgba(244,67,54,.50)'
                : 'rgba(33,150,243,.24)';
          const fourthMain = preMashHeatstrike ? fmt(pump, '%', 0) : fmt(age, 'min');
          const fourthLabel = preMashHeatstrike ? 'pumpblandning' : 'snapshot';

          return `<div style="line-height:1.25;min-width:0;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
              <div style="min-width:0;"><div style="font-size:11px;font-weight:900;letter-spacing:.06em;opacity:.62;text-transform:uppercase;">BrewTracker · bryggdag</div><div style="margin-top:3px;font-size:11px;font-weight:850;opacity:.72;">${statusText}</div></div>
              <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:${chipBg};border:1px solid ${chipBorder};font-size:11px;font-weight:950;white-space:nowrap;"><ha-icon icon="${planning || prestart ? 'mdi:timer-sand' : 'mdi:timer-play-outline'}" style="width:14px;height:14px;"></ha-icon><span>${phaseLabel}</span></div>
            </div>
            <div style="margin-top:10px;font-size:10px;font-weight:950;letter-spacing:.08em;opacity:.70;text-align:center;text-transform:uppercase;">AKTIVT NU</div>
            <div style="margin-top:3px;font-size:24px;font-weight:950;letter-spacing:-.04em;text-align:center;">${activeTitle}</div>
            <div style="margin:10px auto 0;max-width:320px;height:7px;border-radius:999px;background:rgba(127,127,127,.18);overflow:hidden;"><div style="width:${planning || prestart ? 0 : progressWidth}%;height:7px;border-radius:999px;background:rgba(33,150,243,.78);"></div></div>
            <div style="margin-top:7px;font-size:12px;font-weight:800;opacity:.72;text-align:center;">${activeSub}</div>
            <div style="margin-top:8px;border-radius:14px;padding:8px;background:${planning || prestart || preMashHeatstrike ? 'rgba(255,193,7,.10)' : 'rgba(127,127,127,.07)'};border:1px solid ${planning || prestart || preMashHeatstrike ? 'rgba(255,193,7,.26)' : 'rgba(127,127,127,.13)'};font-size:12px;font-weight:800;opacity:.82;text-align:center;">${nextBox}</div>
            <div style="margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;">
              <div style="border-radius:13px;padding:7px;background:rgba(33,150,243,.09);border:1px solid rgba(33,150,243,.20);text-align:center;"><b>${fmt(progress, '%', 0)}</b><br><span style="font-size:10px;opacity:.65;">förlopp</span></div>
              <div style="border-radius:13px;padding:7px;background:rgba(0,188,212,.10);border:1px solid rgba(0,188,212,.22);text-align:center;"><b>${fmt(remaining, 'min', 0)}</b><br><span style="font-size:10px;opacity:.65;">återstår</span></div>
              <div style="border-radius:13px;padding:7px;background:rgba(76,175,80,.10);border:1px solid rgba(76,175,80,.22);text-align:center;"><b>${fmt(strikeTarget ?? target, '°C')}</b><br><span style="font-size:10px;opacity:.65;">${preMashHeatstrike ? 'strike-mål' : 'mål'}</span></div>
              <div style="border-radius:13px;padding:7px;background:rgba(127,127,127,.08);border:1px solid rgba(127,127,127,.14);text-align:center;"><b>${fourthMain}</b><br><span style="font-size:10px;opacity:.65;">${fourthLabel}</span></div>
            </div>
            ${preMashHeatstrike ? `<div style="margin-top:7px;font-size:10.8px;font-weight:800;opacity:.66;text-align:center;">Värme ${fmt(heat, '%', 0)} · pump ${fmt(pump, '%', 0)} · gate ${mashGateState}</div>` : ''}
          </div>`;
        ]]]
      styles:
        card:
          - border-radius: 22px
          - padding: 14px
          - background: linear-gradient(135deg, rgba(33,150,243,.10), rgba(127,127,127,.035))
          - border: 1px solid rgba(33,150,243,.20)
          - box-shadow: 0 2px 10px rgba(0,0,0,.08)
        grid:
          - grid-template-areas: "\"i n\" \"i l\""
          - grid-template-columns: 42px minmax(0,1fr)
          - column-gap: 12px
        label:
          - justify-self: stretch
          - text-align: left
          - white-space: normal
    - type: horizontal-stack
      cards:
        - type: custom:button-card
          name: Uppdatera BF
          icon: mdi:refresh
          tap_action:
            action: call-service
            service: brewassistant.force_brewfather_refresh
          styles:
            card:
              - border-radius: 15px
              - padding: 9px
              - background: rgba(33,150,243,.09)
              - border: 1px solid rgba(33,150,243,.22)
            name:
              - font-size: 11px
              - font-weight: 950
        - type: custom:button-card
          entity: sensor.brewfather_brew_tracker_status
          name: BrewTracker-status
          icon: mdi:cloud-sync-outline
          tap_action:
            action: more-info
          styles:
            card:
              - border-radius: 15px
              - padding: 9px
              - background: rgba(76,175,80,.09)
              - border: 1px solid rgba(76,175,80,.22)
            name:
              - font-size: 11px
              - font-weight: 950
