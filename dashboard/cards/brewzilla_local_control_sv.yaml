# Beta.14: strictly read-only HA/RCL readback. Never embed switch/number rows here:
# tapping those rows changes RCL directly, outside the BA observe-only guard.
type: conditional
conditions:
  - condition: state_not
    entity: sensor.brewassistant_brewzilla_orchestration_mode
    state: unavailable
card:
  type: vertical-stack
  cards:
    - type: markdown
      title: BrewZilla · lokal kontroll och återläsning
      content: >-
        {% set orch = 'sensor.brewassistant_brewzilla_orchestration_mode' %}
        {% set observing = state_attr(orch, 'observe_only_effective') %}
        {% set sw = states('switch.brewassistant_brewzilla_observe_only') %}
        {% if observing != false or sw != 'off' %}
        **🔒 ENDAST ÅTERLÄSNING – STYR BREWZILLA PÅ DESS EGEN PANEL.**

        BA:s observationsläge skickar inga kommandon, inte ens OFF/0 %.
        Fysisk avstängning måste kontrolleras lokalt. Direkt RCL-styrning i
        andra Lovelace-kort ligger utanför BA:s spärr.
        {% else %}
        **BA:s observationsspärr är släppt.** Övriga säkerhetsspärrar gäller;
        fysiska utgångar är inte verifierade av denna vy.
        {% endif %}

        **Orkestrering:** `{{ states(orch) }}`  
        **Styrorsak:** {{ states('sensor.brewassistant_brewzilla_control_reason') }}  
        **RCL-anslutning:** {{ states('sensor.brewzilla_connection') }}  
        **Intern temperatur:** {{ states('sensor.brewzilla_temperature') }} °C  
        **Mål, återläst:** {{ states('number.brewzilla_target_temperature') }} °C  
        **Värmare, återläst:** {{ states('switch.brewzilla_heater') }}  
        **Pump, återläst:** {{ states('switch.brewzilla_pump') }}  
        **Värmeutnyttjande, återläst:** {{ states('number.brewzilla_heat_utilization') }} %  
        **Pumputnyttjande, återläst:** {{ states('number.brewzilla_pump_utilization') }} %  
        **Effekt:** {{ states('sensor.brewassistant_brewzilla_power') }} W
    - type: custom:expander-card
      title: BA:s styrmodell · endast diagnostik
      cards:
        - type: markdown
          content: >-
            {% set orch = 'sensor.brewassistant_brewzilla_orchestration_mode' %}
            **Skrivbehörighet:** {{ state_attr(orch, 'hot_side_actuator_writes_allowed') }}  
            **Observationsläge aktivt:** {{ state_attr(orch, 'observe_only_effective') }}  
            **Återaktivering krävs:** {{ state_attr(orch, 'observe_only_rearm_required') }}  
            **BA-mål:** {{ states('sensor.brewassistant_brewzilla_requested_target') }} °C  
            **Verkställt mål:** {{ states('sensor.brewassistant_brewzilla_applied_target') }} °C  
            **Måldelta:** {{ states('sensor.brewassistant_brewzilla_target_delta') }}  
            **Vört/kittel:** {{ states('sensor.brewassistant_brewzilla_wort_temperature') }} °C  
            **Mäsk:** {{ states('sensor.brewassistant_brewzilla_mash_temperature') }} °C  
            **RCL degraderad:** {{ state_attr(orch, 'rcl_degraded') }}  
            **Lokal styrlease:** {{ state_attr(orch, 'local_control_lease_active') }}
