            const T = {"title":"Brewday Control / Status","mode":"BREW MODE","source":"SOURCE","step":"CURRENT STEP","target":"TARGET TEMPERATURE","remaining":"TIME LEFT","owner":"OWNER","authority":"CONTROL MODE","abort":"ABORT · EMERGENCY STOP","rearm":"REARM AFTER ABORT","observe":"BA READ-ONLY","enable":"ENABLE BA CONTROL","ack":"ACKNOWLEDGE RECONNECTION","diag":"Source, fallback & safety diagnostics","idle":"Waiting for brewday","aborted":"EMERGENCY STOP ACTIVE","resync":"RECONNECTION BLOCKED","fallback":"SOURCE LOST · MANUAL FALLBACK","observing":"BA IS OBSERVING","running":"Brewday active","status":"STATUS","reason":"Reason","lost":"Previous external source","raw":"Exact raw step","session":"RCL session","age":"Snapshot age","noTime":"Time unverified","none":"No verified source","unknown":"Unverified","noWrite":"BA WRITES BLOCKED","warnAbort":"ABORT needs physical inspection. A UI acknowledgement is not proof that heater and pump are OFF.","warnResync":"Check RAPT/Brewfather session and active step physically. BA abstains from ordinary control.","warnFallback":"Recipe context is retained, but heater/pump authority must not be taken automatically from external control.","warnObserve":"BA sends no ordinary control commands. A running RAPT profile may continue controlling.","warnActive":"RAPT owns target and heater in RCL mode; BA may assist heat/pump only within its allowed scope.","noOff":"UI status or service acknowledgement is NOT proof of physical OFF.","observeInfo":"Enable BA read-only. Does not stop a running RAPT profile.","enableInfo":"Only with verified source and no fallback, resync or ABORT.","enableConfirm":"Check equipment, water level and external controller. Leaving read-only may restart allowed BA heat/pump commands on the next tick. Continue?","ackInfo":"Only after checking current external session, raw step and BrewZilla. Keep read-only ON.","ackDisabled":"No verified active reconnection to acknowledge.","ackConfirm":"You acknowledge the current external session/step. Backend re-checks the source; ACK itself sends no hardware command. A future tick may resume allowed writes after leaving read-only. Have you physically inspected the equipment?","abortInfo":"Requests STOP/OFF/0; physically verify outputs.","rearmInfo":"Clear separate ABORT latch after physical inspection; read-only is unchanged.","rearmConfirm":"Have you physically inspected heater, pump and BrewZilla? Rearming does NOT prove outputs OFF.","diagnosticsInfo":"An HA timestamp is not necessarily proof of a physical sample. ACK is independently verified by the backend.","next":"Next","controller":"Orchestration","lockReason":"Lockout reason","scope":"Authority"};
            const a = states['sensor.brewassistant_brewday_runtime_summary']?.attributes || {};
            const safe = v => String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const row = (n,v) => '<div style="display:flex;justify-content:space-between;gap:9px;padding:6px 0;border-bottom:1px solid rgba(127,127,127,.12)"><span style="opacity:.65">'+safe(n)+'</span><b style="text-align:right;overflow-wrap:anywhere">'+safe(v)+'</b></div>';
            const age = a.snapshot_age_seconds;
            return '<div style="text-align:left;font-size:11px;line-height:1.45">'+
