# PASSIVE CARD ONLY. This card does not isolate BA's legacy actuator writers.
# Do not run a RAPT profile concurrently with BA active hot-side control until
# the central external-owner write gate is implemented and physically verified.
type: custom:button-card
entity: binary_sensor.brewzilla_profile_active
name: RAPT · Lakning (observation)
icon: mdi:grain
show_state: false
show_label: true
triggers_update:
  - binary_sensor.brewzilla_profile_active
  - switch.brewzilla_heater
  - switch.brewzilla_pump
  - number.brewzilla_heat_utilization
  - number.brewzilla_pump_utilization
  - number.brewzilla_target_temperature
tap_action:
  action: more-info
hold_action:
  action: none
label: |
  [[[
    const profile = states['binary_sensor.brewzilla_profile_active'];
    const attrs = profile?.attributes || {};
    const value = (id) => {
      const raw = states[id]?.state;
      return raw === undefined || raw === null || ['unknown', 'unavailable', 'none', ''].includes(String(raw).toLowerCase()) ? 'okänt' : String(raw);
    };
    const manual = String(attrs.step_end_type || '').toLowerCase() === 'manual';
    const heater = value('switch.brewzilla_heater');
    const pump = value('switch.brewzilla_pump');
    const heat = value('number.brewzilla_heat_utilization');
    const pumpUtil = value('number.brewzilla_pump_utilization');
    const target = value('number.brewzilla_target_temperature');
    const next = String(attrs.next_step_name || 'okänt');
    const stepStatus = manual ? 'RAPT väntar på manuell fortsättning.' : 'VARNING: stegets manuella slutvillkor är inte verifierat.';
    return `<div style="line-height:1.35;white-space:normal;text-align:left;">
      <div style="font-size:11px;font-weight:950;opacity:.7;">ENBART OBSERVATION · INGEN BA-STYRNING FRÅN DETTA KORT</div>
      <div style="margin-top:7px;font-size:15px;font-weight:900;">Sparge · 11,38 L lakvatten</div>
      <div style="margin-top:5px;">${stepStatus} Nästa rapporterade steg: ${next}.</div>
      <div style="margin-top:9px;padding:8px;border-radius:10px;background:rgba(127,127,127,.09);">
        BZ-värmare: <b>${heater}</b> · heat: <b>${heat} %</b><br>
        BZ-pump: <b>${pump}</b> · pump: <b>${pumpUtil} %</b> · mål: <b>${target} °C</b>
      </div>
      <div style="margin-top:9px;font-weight:850;">Före lyft: kontrollera på själva BrewZillan att pump och värme är AV. Efter säkert lyft och verifierad vörtnivå: eventuell uppvärmning hanteras lokalt i RAPT/BZ, inte via BA. Fortsätt profilen manuellt först när lakningen är klar.</div>
      <div style="margin-top:6px;font-size:10px;opacity:.7;">Rapporterade värden kan vara fördröjda. Kortet bevisar INTE att den installerade BA-integrationen är skrivskyddad.</div>
    </div>`;
  ]]]
styles:
  card:
    - display: |
        [[[
          const state = states['binary_sensor.brewzilla_profile_active'];
          const attrs = state?.attributes || {};
          const step = String(attrs.step_name || '').trim().toLowerCase();
          return state?.state === 'on'
            && attrs.ba_source === 'rapt_cloud_link_brewzilla_profile_runtime'
            && ['sparge', 'lakning'].includes(step)
            ? 'block' : 'none';
        ]]]
    - border-radius: 18px
    - padding: 12px
    - background: rgba(255,193,7,.09)
    - border: 1px solid rgba(255,193,7,.36)
  grid:
    - grid-template-areas: '"i n" "l l"'
    - grid-template-columns: 32px minmax(0,1fr)
    - column-gap: 9px
  icon:
    - width: 22px
  name:
    - justify-self: start
    - font-size: 14px
    - font-weight: 950
  label:
    - justify-self: stretch
    - white-space: normal
    - text-align: left
