type: conditional
conditions:
  - entity: sensor.brewassistant_brewfather_batch_phase
    state: "fermenting"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewfather_batch_phase
      name: Brewfather-batch
      icon: mdi:flask-outline
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewfather_batch_phase
        - sensor.brewfather_brew_tracker_status
        - climate.fermentation_chamber
      tap_action:
        action: more-info
        entity: sensor.brewfather_brew_tracker_status
      label: |
        [[[
          const clean = (v) => {
            if (v === undefined || v === null) return null;
            const s = String(v);
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? null : s;
          };
          const short = (v, max = 42) => {
            const s = String(v ?? '—');
            return s.length > max ? s.slice(0, max - 1) + '…' : s;
          };
          const bf = states['sensor.brewfather_brew_tracker_status'];
          const phase = clean(states['sensor.brewassistant_brewfather_batch_phase']?.state) || 'fermenting';
          const recipe = clean(bf?.attributes?.brew_tracker_recipe_name) || clean(bf?.attributes?.recipe_name) || '—';
          const batch = clean(bf?.attributes?.brew_tracker_batch_name) || clean(bf?.attributes?.batch_name) || '—';
          const batchId = clean(bf?.attributes?.brew_tracker_batch_id) || clean(bf?.attributes?.batch_id) || '—';
          const tracker = clean(bf?.state) || 'inactive';
          const chamber = clean(states['climate.fermentation_chamber']?.state) || 'off';

          const metric = (title, main, sub, icon, kind = 'neutral') => {
            const bg = kind === 'green' ? 'rgba(76,175,80,.11)' : kind === 'blue' ? 'rgba(33,150,243,.09)' : kind === 'cyan' ? 'rgba(0,188,212,.10)' : 'rgba(127,127,127,.08)';
            const border = kind === 'green' ? 'rgba(76,175,80,.24)' : kind === 'blue' ? 'rgba(33,150,243,.20)' : kind === 'cyan' ? 'rgba(0,188,212,.22)' : 'rgba(127,127,127,.14)';
            return `<div style="min-width:0;border-radius:13px;padding:7px 6px;background:${bg};border:1px solid ${border};display:grid;grid-template-columns:18px minmax(0,1fr);gap:5px;align-items:center;"><ha-icon icon="${icon}" style="width:15px;height:15px;opacity:.82;"></ha-icon><div style="min-width:0;text-align:center;"><div style="font-size:8.7px;font-weight:950;opacity:.55;letter-spacing:.045em;text-transform:uppercase;">${title}</div><div style="font-size:12.8px;font-weight:950;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${main}</div><div style="font-size:9px;font-weight:800;opacity:.58;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${sub}</div></div></div>`;
          };

          return `<div style="line-height:1.25;min-width:0;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
              <div style="min-width:0;">
                <div style="font-size:12px;font-weight:850;opacity:.66;">Brewfather · batchkontext efter bryggdagen</div>
                <div style="font-size:12px;font-weight:850;opacity:.66;">${short(batch, 46)} · ${short(recipe, 46)}</div>
              </div>
              <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(156,39,176,.12);border:1px solid rgba(156,39,176,.25);font-size:11px;font-weight:950;white-space:nowrap;">
                <ha-icon icon="mdi:flask-outline" style="width:14px;height:14px;"></ha-icon><span>Jäser</span>
              </div>
            </div>
            <div style="margin-top:9px;text-align:center;">
              <div style="font-size:23px;font-weight:950;letter-spacing:-.04em;line-height:1.02;">Brewfather · Fermenting</div>
              <div style="margin-top:5px;font-size:12px;font-weight:800;opacity:.74;">Bryggdagen är klar · BrewTracker lämnar huvudvyn</div>
            </div>
            <div style="margin-top:11px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;">
              ${metric('Fas', phase, 'Brewfather', 'mdi:timeline-check-outline', 'green')}
              ${metric('Batch', short(batch, 14), short(batchId, 14), 'mdi:identifier', 'blue')}
              ${metric('Recept', short(recipe, 14), 'batchdata', 'mdi:notebook-outline', 'cyan')}
              ${metric('Kammare', chamber, 'BA jäsning', 'mdi:fridge-outline', chamber === 'off' ? 'neutral' : 'green')}
            </div>
            <div style="margin-top:10px;display:grid;grid-template-columns:20px minmax(0,1fr);gap:7px;align-items:center;border-radius:14px;padding:9px;background:rgba(156,39,176,.09);border:1px solid rgba(156,39,176,.20);">
              <ha-icon icon="mdi:swap-horizontal-bold" style="width:15px;height:15px;opacity:.78;"></ha-icon>
              <div style="font-size:11.5px;line-height:1.25;font-weight:800;opacity:.80;text-align:left;white-space:normal;">Brewfather håller batch-/receptkontexten. Temperatur, Pill och klimatstyrning hör hemma i BrewAssistant Jäsningscockpit. BrewTracker-status: ${tracker}.</div>
            </div>
          </div>`;
        ]]]
      styles:
        card:
          - border-radius: 22px
          - padding: 14px
          - overflow: hidden
          - background: linear-gradient(135deg, rgba(156,39,176,.10), rgba(127,127,127,.035))
          - border: 1px solid rgba(156,39,176,.20)
          - box-shadow: 0 2px 10px rgba(0,0,0,.08)
        grid:
          - grid-template-areas: "\"i n\" \"i l\""
          - grid-template-columns: 42px minmax(0,1fr)
          - grid-template-rows: min-content min-content
          - column-gap: 12px
        icon:
          - width: 27px
          - height: 27px
          - color: rgb(156,39,176)
        img_cell:
          - width: 42px
          - height: 42px
          - border-radius: 50%
          - background: rgba(156,39,176,.13)
        name:
          - justify-self: start
          - align-self: end
          - font-size: 15px
          - font-weight: 950
        label:
          - justify-self: stretch
          - text-align: left
          - white-space: normal
          - margin-top: 4px
    - type: horizontal-stack
      cards:
        - type: custom:button-card
          entity: sensor.brewfather_brew_tracker_status
          name: Brewfather-status
          icon: mdi:cloud-outline
          tap_action:
            action: more-info
          styles:
            card:
              - border-radius: 15px
              - padding: 9px
              - background: rgba(156,39,176,.08)
              - border: 1px solid rgba(156,39,176,.20)
            name:
              - font-size: 11px
              - font-weight: 950
        - type: custom:button-card
          entity: climate.fermentation_chamber
          name: Jäsningskammare
          icon: mdi:fridge-outline
          tap_action:
            action: more-info
          styles:
            card:
              - border-radius: 15px
              - padding: 9px
              - background: rgba(33,150,243,.08)
              - border: 1px solid rgba(33,150,243,.20)
            name:
              - font-size: 11px
              - font-weight: 950
