# Fermentation is separate from RAPT-owned hot-side Brewing.
# Do not reference sensor.brewfather_brew_tracker_* here: the dashboard
# runs in the browser and cannot be protected by backend read guards.
type: conditional
conditions:
  - entity: sensor.brewassistant_brewfather_batch_phase
    state: "fermenting"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: climate.fermentation_chamber
      name: Brewfather · Jäsning
      icon: mdi:flask-outline
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewfather_batch_phase
        - sensor.brewfather_recipe_name
        - climate.fermentation_chamber
      tap_action:
        action: more-info
      label: |
        [[[
          const clean = (v) => {
            const text = String(v ?? '').trim();
            return text && !['unknown', 'unavailable', 'none'].includes(text.toLowerCase()) ? text : '—';
          };
          const recipe = clean(states['sensor.brewfather_recipe_name']?.state);
          const chamber = clean(states['climate.fermentation_chamber']?.state);
          return `Recept: ${recipe} · Jäskammare: ${chamber}<br>Brewfather levererar jäsprofilen. BrewAssistant reglerar jäskammaren oberoende av bryggkällan.`;
        ]]]
      styles:
        card:
          - border-radius: 18px
          - padding: 14px
          - background: linear-gradient(135deg, rgba(156,39,176,.10), rgba(127,127,127,.035))
          - border: 1px solid rgba(156,39,176,.20)
        label:
          - white-space: normal
          - text-align: left
          - font-size: 12px
    - type: entities
      show_header_toggle: false
      entities:
        - entity: sensor.brewfather_recipe_name
          name: Recept
        - entity: climate.fermentation_chamber
          name: Jäskammare
