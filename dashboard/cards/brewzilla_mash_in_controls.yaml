type: conditional
conditions:
  - entity: switch.brewzilla
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_brewzilla_control_reason
      name: Mash-In and grain-bed settling
      icon: mdi:barley
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewzilla_control_reason
        - button.brewassistant_mash_in_override
        - button.brewassistant_mash_in_started
        - button.brewassistant_mash_in_complete
        - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
        - sensor.brewassistant_brewday_runtime_source
      tap_action:
        action: more-info
      label: |
        [[[
          const a = entity?.attributes || {};
          const oa = states['button.brewassistant_mash_in_override']?.attributes || {};
          const gate = a.mash_in_gate_state || states['button.brewassistant_mash_in_started']?.attributes?.state || 'idle';
          const phase = a.mash_recirculation_phase;
          const remaining = Math.max(0, Number(a.mash_settle_remaining_seconds) || 0);
          const ramp = Math.max(0, Number(a.mash_recirculation_ramp_remaining_seconds) || 0);
          const source = states['sensor.brewassistant_brewday_runtime_source']?.state || 'None';
          const target = Number(a.mash_physical_hold_target);
          const hold = Number.isFinite(target) && a.mash_physical_hold_target != null ? ` · physical hold ${target.toFixed(1)}°C ${a.mash_physical_hold_complete ? 'complete' : 'pending'}` : '';
          const time = n => `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2,'0')}`;
          let msg = 'Waiting for strike readiness. STARTED keeps the pump OFF.';
          if (gate === 'mash_in_started') msg = source === 'Brewfather Brew Tracker'
            ? 'Mash-in started. After mixing, press CONTINUE in Brewfather. BA completes mash-in but does NOT start the pump.'
            : 'Mash-in started. Once mixing is done, press MASH-IN COMPLETE; pump remains OFF.';
          if (phase === 'settling') msg = `Grain bed settling ${time(remaining)} remaining · pump OFF · heating may maintain mash target.`;
          if (phase === 'recirculation_ready') msg = '10-minute rest complete. Check the bed/drainage; confirm LOW-FLOW recirculation below.';
          if (phase === 'low_flow_pending') msg = 'Low-flow command sent; awaiting pump readback. Do not raise flow yet.';
          if (phase === 'low_flow') msg = `Low-flow recirculation running · ramp proposal in ${time(ramp)}. Watch the level above the bed.`;
          if (phase === 'normal_ready') msg = 'Ramp interval complete. Only increase flow after checking drainage and confirming below.';
          if (phase === 'normal_pending') msg = 'Normal-flow command sent; awaiting physical readback.';
          if (phase === 'normal') msg = 'Normal recirculation confirmed. Physical mash hold still owns target until complete.';
          if (phase === 'blocked' || phase === 'recovery_required') msg = `Physical control BLOCKED (${a.mash_interlock_reason || phase}). No automatic restart; operator recovery required.`;
          if (gate === 'mash_in_complete' && !phase && a.physical_mash_interlock_active !== false) msg = 'Mash-in complete. Waiting for interlock telemetry; do not assume pump can run.';
          const staleAge = oa.mash_in_override_process_temperature_age_seconds;
          const age = Number(staleAge);
          const stale = oa.mash_in_override_in_scope === true && oa.mash_in_override_process_temperature_fresh === false;
          const staleLine = stale ? `<br>RCL MASH report stale (${Number.isFinite(age) ? Math.floor(age) + 's' : 'age unknown'}) · BrewZilla regulates locally; manual strike only after physical verification.` : '';
          return `${msg}<br>gate ${gate} · phase ${phase || '—'}${hold}${staleLine}`;
        ]]]
      styles:
        card:
          - border-radius: 18px
          - padding: 12px
          - background: rgba(127,127,127,.075)
          - border: 1px solid rgba(127,127,127,.18)
        label:
          - white-space: normal
          - text-align: left
          - font-size: 12px
          - line-height: 1.35
    - type: custom:button-card
      entity: button.brewassistant_mash_in_override
      name: MANUALLY ACCEPT STRIKE
      icon: mdi:hand-okay
      show_state: false
      show_label: true
      label: READY only · physically verify temperature · max ±2.0 °C
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_mash_in_override
        confirmation:
          text: Verify strike temperature physically. This only acknowledges READY and does not change pump, heat or target.
      styles:
        card:
          - display: |
              [[[
                return entity?.attributes?.mash_in_override_available === true ? 'block' : 'none';
              ]]]
          - border-radius: 18px
          - background: rgba(255,152,0,.16)
    - type: horizontal-stack
      cards:
        - type: custom:button-card
          entity: button.brewassistant_mash_in_started
          name: MASH-IN STARTED
          icon: mdi:barley
          show_state: false
          show_label: true
          label: Release strike target · keep pump OFF
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_started
            confirmation:
              text: Are you starting grain addition? Check both temperature probes. BA sets the mash target and keeps the pump OFF.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    const b = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    return a.mash_in_gate_state === 'ready_for_mash_in' || b?.state === 'on' ? 'block' : 'none';
                  ]]]
              - border-radius: 18px
              - background: rgba(255,193,7,.12)
        - type: custom:button-card
          entity: button.brewassistant_mash_in_complete
          name: MASH-IN COMPLETE
          icon: mdi:barley-off
          show_state: false
          show_label: true
          label: Mixing done · start 10-minute rest · pump OFF
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_complete
            confirmation:
              text: Has all grain been mixed in? This confirms mash-in and starts grain-bed settling. Pump must remain OFF. For Brewfather, CONTINUE is the primary acknowledgement.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    return a.mash_in_gate_state === 'mash_in_started' ? 'block' : 'none';
                  ]]]
              - border-radius: 18px
              - background: rgba(76,175,80,.12)
    - type: custom:button-card
      entity: button.brewassistant_start_mash_circulation
      name: START / INCREASE RECIRCULATION
      icon: mdi:pump
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewzilla_control_reason
        - button.brewassistant_start_mash_circulation
      label: |
        [[[
          const phase = states['sensor.brewassistant_brewzilla_control_reason']?.attributes?.mash_recirculation_phase;
          return phase === 'recirculation_ready'
            ? 'Step 1 · start LOW FLOW ~25% · inspect grain bed and drainage'
            : 'Step 2 · after ~5 minutes, increase toward normal ~50% only if drainage is stable';
        ]]]
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_start_mash_circulation
        confirmation:
          text: Confirm the grain bed drains well and there is no rising liquid level above it. Start low flow or increase one step? No flow/level sensor is present; you must verify visually.
      styles:
        card:
          - display: |
              [[[
                const phase = states['sensor.brewassistant_brewzilla_control_reason']?.attributes?.mash_recirculation_phase;
                return ['recirculation_ready','normal_ready'].includes(phase) ? 'block' : 'none';
              ]]]
          - border-radius: 18px
          - padding: 12px
          - background: rgba(33,150,243,.13)
          - border: 1px solid rgba(33,150,243,.4)
        label:
          - white-space: normal
          - font-size: 11px
