type: conditional
conditions:
  - entity: switch.brewassistant_show_cfc
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: sensor.brewassistant_cooling_status
      name: Kylning
      icon: mdi:snowflake-thermometer
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_cooling_state
        - sensor.brewassistant_cooling_method
        - sensor.brewassistant_cooling_status
        - sensor.brewassistant_cooling_advice
        - sensor.brewassistant_cooling_process_temperature
        - sensor.brewassistant_cooling_target_temperature
        - sensor.brewassistant_cooling_delta
        - sensor.brewassistant_cooling_rate
        - sensor.brewassistant_cooling_eta_minutes
        - sensor.brewassistant_cooling_target_ready
        - select.brewassistant_cooling_method
        - number.brewassistant_cooling_target_temperature
        - number.brewassistant_cooling_manual_temperature
        - switch.brewzilla_pump
      label: |
        [[[
          const st = states;
          const clean = (id, fallback='—') => {
            const v = st[id]?.state;
            if (v === undefined || v === null) return fallback;
            const s = String(v);
            return ['unknown','unavailable','none',''].includes(s.toLowerCase()) ? fallback : s;
          };
          const fmt = (id, digits=1) => {
            const n = Number(String(st[id]?.state ?? '').replace(',', '.'));
            return Number.isFinite(n) ? n.toFixed(digits) : '—';
          };
          const state = clean('sensor.brewassistant_cooling_state');
          const method = clean('sensor.brewassistant_cooling_method');
          const advice = clean('sensor.brewassistant_cooling_advice', 'Väntar på Cooling Runtime');
          const temp = fmt('sensor.brewassistant_cooling_process_temperature');
          const target = fmt('sensor.brewassistant_cooling_target_temperature', 0);
          const delta = fmt('sensor.brewassistant_cooling_delta');
          return `${state} · ${method}<br>${temp} °C → ${target} °C · Δ ${delta} °C<br>${advice}`;
        ]]]
      styles:
        card:
          - border-radius: 22px
          - padding: 14px
          - background: >-
              linear-gradient(135deg, rgba(3,169,244,.10),
              rgba(127,127,127,.035))
          - border: 1px solid rgba(3,169,244,.22)
          - box-shadow: 0 2px 10px rgba(0,0,0,.08)
        grid:
          - grid-template-areas: '"i n" "i l"'
          - grid-template-columns: 42px minmax(0,1fr)
          - column-gap: 12px
        icon:
          - width: 27px
          - height: 27px
          - color: rgb(3,169,244)
        img_cell:
          - width: 42px
          - height: 42px
          - border-radius: 50%
          - background: rgba(3,169,244,.14)
        name:
          - justify-self: start
          - font-size: 15px
          - font-weight: 950
        label:
          - justify-self: start
          - text-align: left
          - white-space: normal
          - font-size: 11.5px
          - font-weight: 760
          - line-height: 1.3
          - opacity: 0.78

    - type: entities
      title: Kylinställningar
      show_header_toggle: false
      entities:
        - entity: select.brewassistant_cooling_method
          name: Kylmetod
        - entity: number.brewassistant_cooling_target_temperature
          name: Måltemperatur
        - entity: number.brewassistant_cooling_manual_temperature
          name: Manuellt uppmätt temperatur
        - entity: number.brewassistant_counterflow_chiller_sanitize_minutes
          name: Saneringstid
        - entity: sensor.brewassistant_cooling_process_temperature_source
          name: Temperaturkälla
        - entity: sensor.brewassistant_cooling_rate
          name: Kylhastighet
        - entity: sensor.brewassistant_cooling_eta_minutes
          name: Beräknad tid kvar
        - entity: sensor.brewassistant_cooling_target_ready
          name: Måltemperatur nådd

    - type: markdown
      content: >-
        **Säkerhetsgräns:** BrewZillas vörtpump styrs manuellt av användaren.
        Cooling kan rekommendera att cirkulation behövs, men startar, stoppar eller
        reglerar inte BrewZilla-pumpen. Kylvattnet kan köras manuellt från kranen
        eller senare styras via en valfri konfigurerad HA-switch.
