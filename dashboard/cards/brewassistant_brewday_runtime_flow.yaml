type: conditional
conditions:
  - entity: switch.brewassistant_show_brewday
    state: "on"
  - entity: sensor.brewassistant_brewday_runtime_state
    state_not: "idle"
card:
  type: vertical-stack
  cards:
    - type: custom:expander-card
      title-card:
        type: custom:button-card
        entity: sensor.brewassistant_brewday_physical_timing_summary
        name: Physical step timer
        icon: mdi:timer-outline
        show_state: false
        show_label: true
        triggers_update:
          - sensor.brewassistant_brewday_physical_timing_summary
          - sensor.brewassistant_brewday_physical_timing_mode
          - sensor.brewassistant_brewday_physical_elapsed_seconds
          - sensor.brewassistant_brewday_physical_remaining_seconds
        label: |
          [[[
            const a = entity?.attributes || {};
            const mode = String(states['sensor.brewassistant_brewday_physical_timing_mode']?.state ?? a.mode ?? 'idle');
            const step = a.step_name || 'No active physical timer';
            const elapsed = Number(states['sensor.brewassistant_brewday_physical_elapsed_seconds']?.state ?? a.elapsed_seconds);
            const remaining = Number(states['sensor.brewassistant_brewday_physical_remaining_seconds']?.state ?? a.remaining_seconds);
            const clock = s => Number.isFinite(s) ? `${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,'0')}` : '—';
            const value = mode.startsWith('hold') ? `${clock(remaining)} left` : clock(elapsed);
            return `${step} · ${mode} · ${value}${a.source_schedule_mismatch === true ? ' · ⚠ Brewfather ahead of physical process' : ''}`;
          ]]]
        styles:
          card:
            - border-radius: 18px
            - padding: 12px
            - background: rgba(0,188,212,.075)
          label:
            - white-space: normal
            - text-align: left
            - font-size: 12px
      cards:
        - type: custom:button-card
          entity: sensor.brewassistant_brewday_physical_timing_summary
          show_name: false
          show_icon: false
          show_state: false
          show_label: true
          label: |
            [[[
              const a = entity?.attributes || {};
              const fmt = v => v == null || !Number.isFinite(Number(v)) ? '—' : Number(v).toFixed(1);
              const clock = s => Number.isFinite(Number(s)) ? `${String(Math.floor(Math.max(0,Number(s))/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,Number(s))%60)).padStart(2,'0')}` : '—';
              const rows = (Array.isArray(a.history) ? a.history : []).slice(-6).reverse().map(r => `<div style="padding:5px 0;border-bottom:1px solid rgba(127,127,127,.15)"><b>${r.name || 'Step'}</b> · ${r.kind || '—'} · ${fmt(r.target_temperature)}°C · ${clock(r.duration_seconds)}</div>`).join('');
              return `<b>${a.step_name || 'No step'}</b> · ${a.step_kind || '—'}<br>Process ${fmt(a.current_temperature)}°C / target ${fmt(a.target_temperature)}°C<br>Elapsed ${clock(a.elapsed_seconds)} · remaining ${clock(a.remaining_seconds)} · paused ${clock(a.paused_seconds)}<br>Process probe: ${a.temperature_entity || '—'} · reached: ${a.target_reached_at || 'no'}<br><br><b>Physical step history</b><br>${rows || 'No completed physical steps yet.'}`;
            ]]]
          styles:
            card:
              - padding: 12px
              - border-radius: 16px
            label:
              - white-space: normal
              - text-align: left
              - font-size: 11px
    - type: custom:button-card
      entity: button.brewassistant_mash_in_override
      name: Strike readiness / stale RCL data
      icon: mdi:cloud-alert
      show_state: false
      show_label: true
      triggers_update:
        - button.brewassistant_mash_in_override
        - sensor.brewassistant_brewzilla_control_reason
      label: |
        [[[
          const a = entity?.attributes || {};
          const age = Number(a.mash_in_override_process_temperature_age_seconds);
          const fresh = a.mash_in_override_process_temperature_fresh === true;
          const available = a.mash_in_override_available === true;
          const fmt = v => v == null || !Number.isFinite(Number(v)) ? '—' : Number(v).toFixed(1);
          const ageText = Number.isFinite(age) ? `${Math.floor(age/60)}m ${Math.floor(age%60)}s` : 'unknown';
          return `${fresh ? 'MASH data is fresh.' : `⚠ MASH data is stale (${ageText}); BrewZilla regulates locally.`}<br>MASH ${fmt(a.mash_in_override_process_temperature)}°C · WORT ${fmt(a.mash_in_override_wort_temperature)}°C · local target ${fmt(a.mash_in_override_local_target)}°C.<br>Auto ±${fmt(a.mash_in_auto_ready_tolerance_c)}°C · manual maximum ±${fmt(a.mash_in_override_tolerance_c)}°C.${available ? '<br>Manual READY acknowledgement available after physical verification.' : ''}`;
        ]]]
      styles:
        card:
          - display: |
              [[[
                const a = entity?.attributes || {};
                return a.mash_in_override_in_scope === true && (a.mash_in_override_available === true || a.mash_in_override_process_temperature_fresh !== true) ? 'block' : 'none';
              ]]]
          - padding: 12px
          - border-radius: 18px
          - background: rgba(255,152,0,.10)
        label:
          - white-space: normal
          - text-align: left
    - type: custom:button-card
      entity: button.brewassistant_mash_in_override
      name: MANUALLY ACCEPT STRIKE
      icon: mdi:hand-okay
      show_state: false
      show_label: true
      label: READY only · verify physically · maximum ±2.0°C
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_mash_in_override
        confirmation:
          text: Verify the strike temperature physically. This acknowledges READY only; it does not change pump, heater or target.
      styles:
        card:
          - display: |
              [[[ return entity?.attributes?.mash_in_override_available === true ? 'block' : 'none'; ]]]
          - border-radius: 16px
          - background: rgba(255,152,0,.16)
    - type: custom:button-card
      entity: sensor.brewassistant_brewzilla_control_reason
      name: Mash-in and recirculation interlock
      icon: mdi:barley
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_brewzilla_control_reason
        - button.brewassistant_mash_in_started
        - button.brewassistant_mash_in_complete
        - binary_sensor.brewassistant_brewzilla_mash_in_gate_pending
        - sensor.brewassistant_brewday_runtime_source
      label: |
        [[[
          const a = entity?.attributes || {};
          const gate = a.mash_in_gate_state || states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending']?.attributes?.mash_in_gate_state || states['button.brewassistant_mash_in_started']?.attributes?.state || 'idle';
          const phase = a.mash_recirculation_phase;
          const time = s => `${Math.floor(Math.max(0,Number(s)||0)/60)}:${String(Math.floor(Math.max(0,Number(s)||0)%60)).padStart(2,'0')}`;
          const bf = states['sensor.brewassistant_brewday_runtime_source']?.state === 'Brewfather Brew Tracker';
          let msg = 'Waiting for READY. Press MASH-IN STARTED when grain addition begins.';
          if (gate === 'mash_in_started') msg = bf ? 'Grain addition in progress. After mixing, press CONTINUE in Brewfather. BA marks Mash-In Complete but does NOT start circulation.' : 'After mixing, press MASH-IN COMPLETE. Pump stays OFF.';
          if (phase === 'settling') msg = `Grain-bed settling: ${time(a.mash_settle_remaining_seconds)} left · pump OFF. This runs alongside the mash hold.`;
          if (phase === 'recirculation_ready') msg = 'Settling complete. Inspect grain bed and drainage, then explicitly confirm LOW FLOW (~25%) below.';
          if (phase === 'low_flow_pending') msg = 'LOW FLOW commanded; waiting for confirmed device readback.';
          if (phase === 'low_flow') msg = `LOW FLOW active · proposal for normal flow in ${time(a.mash_recirculation_ramp_remaining_seconds)}. Watch liquid level.`;
          if (phase === 'normal_ready') msg = 'Inspect drainage again. Confirm normal flow (~50%) below only if the bed is draining well.';
          if (phase === 'normal_pending') msg = 'Normal flow commanded; waiting for device readback.';
          if (phase === 'normal') msg = 'Normal circulation confirmed. Physical mash hold still owns the target until complete.';
          if (phase === 'blocked' || phase === 'recovery_required') msg = `⚠ Control blocked: ${a.mash_interlock_reason || phase}. No automatic restart; operator recovery required.`;
          return `${msg}<br>Gate ${gate} · phase ${phase || '—'} · physical target ${a.mash_physical_hold_target ?? '—'}°C · hold ${a.mash_physical_hold_complete ? 'complete' : 'pending'}`;
        ]]]
      styles:
        card:
          - border-radius: 18px
          - padding: 12px
          - background: rgba(127,127,127,.08)
        label:
          - white-space: normal
          - text-align: left
          - font-size: 12px
    - type: horizontal-stack
      cards:
        - type: custom:button-card
          entity: button.brewassistant_mash_in_started
          name: MASH-IN STARTED
          icon: mdi:barley
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_started
            confirmation:
              text: Begin grain addition? BrewAssistant releases the strike target and keeps the pump OFF.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    const g = states['binary_sensor.brewassistant_brewzilla_mash_in_gate_pending'];
                    return a.mash_in_gate_state === 'ready_for_mash_in' || g?.state === 'on' ? 'block' : 'none';
                  ]]]
              - border-radius: 16px
              - background: rgba(255,193,7,.14)
        - type: custom:button-card
          entity: button.brewassistant_mash_in_complete
          name: MASH-IN COMPLETE · FALLBACK
          icon: mdi:barley-off
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brewassistant_mash_in_complete
            confirmation:
              text: Grain mixed in? This STARTS 10-minute settling with pump OFF. Brewfather CONTINUE is the primary completion acknowledgement.
          styles:
            card:
              - display: |
                  [[[
                    const a = states['sensor.brewassistant_brewzilla_control_reason']?.attributes || {};
                    return a.mash_in_gate_state === 'mash_in_started' ? 'block' : 'none';
                  ]]]
              - border-radius: 16px
              - background: rgba(76,175,80,.12)
    - type: custom:button-card
      entity: button.brewassistant_start_mash_circulation
      name: CONFIRM RECIRCULATION STEP
      icon: mdi:pump
      show_state: false
      show_label: true
      label: |
        [[[
          const p = states['sensor.brewassistant_brewzilla_control_reason']?.attributes?.mash_recirculation_phase;
          return p === 'recirculation_ready' ? 'Step 1: LOW FLOW ~25%, inspect bed and drainage.' : 'Step 2: NORMAL FLOW ~50% after five minutes, only if draining well.';
        ]]]
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brewassistant_start_mash_circulation
        confirmation:
          text: Check the actual grain bed, liquid level and drainage. This sends a real pump command. Confirm this step only if conditions are safe; BA has no flow/level sensor.
      styles:
        card:
          - display: |
              [[[
                const p = states['sensor.brewassistant_brewzilla_control_reason']?.attributes?.mash_recirculation_phase;
                return ['recirculation_ready','normal_ready'].includes(p) ? 'block' : 'none';
              ]]]
          - border-radius: 16px
          - background: rgba(33,150,243,.13)
        label:
          - white-space: normal
          - text-align: left
