# HLT simulation-only dashboard. No actions and NO physical HLT actuation.
# Power data is observational; scenario headroom is not an electrical interlock.
type: custom:button-card
entity: sensor.brewassistant_hlt_status
name: HLT simulation
show_icon: false
show_name: false
show_state: false
show_label: true
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
triggers_update:
  - sensor.brewassistant_hlt_status
  - sensor.brewassistant_hlt_reason
  - sensor.brewassistant_hlt_power_owner
  - sensor.brewassistant_hlt_actual_energy_recipient
  - sensor.brewassistant_hlt_virtual_energy_recipient
  - sensor.brewassistant_hlt_brewzilla_power_observed
  - sensor.brewassistant_hlt_power_observed
  - sensor.brewassistant_hlt_power_virtual
  - sensor.brewassistant_hlt_total_power_observed
  - sensor.brewassistant_hlt_total_power_virtual_scenario
  - sensor.brewassistant_hlt_budget_scenario
  - sensor.brewassistant_hlt_headroom_observed
  - sensor.brewassistant_hlt_temperature
  - sensor.brewassistant_hlt_temperature_measured
  - sensor.brewassistant_hlt_temperature_estimated
  - sensor.brewassistant_hlt_temperature_source
  - sensor.brewassistant_hlt_target_temperature
  - sensor.brewassistant_hlt_volume
  - sensor.brewassistant_hlt_total_session_seconds
  - sensor.brewassistant_hlt_virtual_heating_seconds
  - sensor.brewassistant_hlt_observed_heating_estimate_seconds
  - sensor.brewassistant_hlt_waiting_seconds
  - sensor.brewassistant_hlt_yielding_seconds
  - sensor.brewassistant_hlt_unknown_sample_seconds
  - sensor.brewassistant_hlt_brewzilla_energy_estimate_wh
  - sensor.brewassistant_hlt_energy_estimate_wh
  - sensor.brewassistant_hlt_yield_count
  - sensor.brewassistant_hlt_reclaim_count
  - sensor.brewassistant_hlt_trace_path
label: |
  [[[
    // A state of unknown/unavailable is missing data, NEVER zero.
    const raw = (key) => {
      const value = states[`sensor.brewassistant_hlt_${key}`]?.state;
      return value == null || ['unknown', 'unavailable', 'none', ''].includes(String(value).toLowerCase())
        ? null : String(value);
    };
    const number = (key) => {
      const value = raw(key);
      if (value === null) return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    };
    const watts = (key) => {
      const n = number(key);
      return n === null ? '—' : `${n.toFixed(0)} W`;
    };
    const temperature = (key) => {
      const n = number(key);
      return n === null ? '—' : `${n.toFixed(1)} °C`;
    };
    const seconds = (key) => {
      const n = number(key);
      if (n === null) return '—';
      const s = Math.max(0, Math.round(n));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    };
    const statusLabels = {
      IDLE: 'Idle', WAITING_FOR_POWER: 'Waiting for BZ', HEATING: 'Virtual heating',
      YIELDING: 'Yielding to BZ', READY: 'Target reached (simulation)',
      waiting_for_data: 'No session data', waiting_for_brewday_recorder: 'Brewday inactive',
      brewday_inactive_or_aborted: 'Brewday stopped', waiting_for_sparge_volume: 'Missing sparge volume',
      error: 'Simulation error'
    };
    const reasons = {
      cruise_power_opportunity_simulated: 'BZ cruising · simulated HLT opportunity',
      brewzilla_ramp_priority: 'BZ ramp · virtual HLT yields',
      brewzilla_power_priority: 'BZ power demand · virtual HLT yields',
      brewzilla_ramp_or_not_cruising: 'BZ needs priority',
      not_enough_observed_capacity: 'No observed scenario headroom',
      brewzilla_power_or_request_unknown: 'BZ readings unavailable',
      awaiting_virtual_off_confirmation: 'Waiting for VIRTUAL release (not hardware readback)',
      disabled_or_no_sparge: 'No sparge / simulation disabled',
      target_reached_measured: 'Measured target reached',
      target_reached_estimated: 'Estimated target reached',
      heater_stop: 'Virtual heating stopped'
    };
    const recipients = {
      brewzilla: 'BZ', hlt: 'HLT', brewzilla_and_hlt: 'BZ + HLT', neither: 'Neither', unknown: 'Unknown'
    };
    const status = raw('status');
    const reason = raw('reason');
    const realRecipient = recipients[raw('actual_energy_recipient')] || 'Unknown';
    const virtualRecipient = raw('virtual_energy_recipient') === 'hlt' ? 'HLT (virtual)' :
      raw('virtual_energy_recipient') === 'none' ? 'None' : 'Unknown';
    const owner = raw('power_owner') === 'brewzilla_with_virtual_hlt'
      ? 'BZ priority · virtual HLT allowed' : 'BZ priority · HLT secondary';
    const source = raw('temperature_source');
    const sourceLabels = {
      measured: 'MEASURED', estimated: 'MODEL ESTIMATE',
      thermostat_calibrated_estimate: 'THERMOSTAT-CALIBRATED ESTIMATE'
    };
    const sourceText = sourceLabels[source] || 'NO TEMPERATURE SOURCE';
    const budget = number('budget_scenario');
    const bz = number('brewzilla_power_observed');
    const virtual = number('power_virtual');
    const bar = (value, color) => {
      if (value === null || budget === null || budget <= 0) return '<span style="opacity:.5;">No bar — missing readings</span>';
      const percent = Math.max(0, Math.min(100, value / budget * 100));
      return `<div style="height:7px;border-radius:99px;background:rgba(127,127,127,.19);overflow:hidden;margin:5px 0 0;"><div style="height:100%;width:${percent}%;background:${color};border-radius:99px;"></div></div>`;
    };
    const box = (title, value, note) => `<div style="padding:10px;border-radius:12px;border:1px solid rgba(127,127,127,.20);background:rgba(127,127,127,.05);min-width:0;"><div style="font-size:10px;letter-spacing:.04em;opacity:.68;font-weight:850;">${title}</div><div style="font-size:20px;font-weight:900;margin-top:4px;">${value}</div><div style="font-size:10px;opacity:.72;margin-top:4px;line-height:1.35;">${note}</div></div>`;
    const heading = (text) => `<div style="font-size:11px;font-weight:950;letter-spacing:.08em;opacity:.67;margin:14px 0 8px;text-transform:uppercase;">${text}</div>`;
    const row = (title, value) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(127,127,127,.12);font-size:11px;"><span style="opacity:.72;">${title}</span><b style="text-align:right;">${value}</b></div>`;
    const energy = (key) => {
      const n = number(key);
      return n === null ? '—' : `${n.toFixed(1)} Wh`;
    };
    const trace = raw('trace_path');
    const basename = trace && /^[/a-zA-Z0-9_.-]+$/.test(trace) ? trace.split('/').pop() : '—';
    return `<div style="width:100%;box-sizing:border-box;text-align:left;line-height:1.3;min-width:0;">
      <div style="display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
        <div><div style="font-size:18px;font-weight:950;">⚡ HLT · Power sharing</div><div style="font-size:12px;margin-top:4px;font-weight:850;">${statusLabels[status] || 'Waiting for telemetry'}</div></div>
        <span style="font-size:10px;font-weight:950;padding:5px 8px;border:1px solid rgba(255,193,7,.5);border-radius:99px;background:rgba(255,193,7,.12);">SIMULATION ONLY · NO CONTROL</span>
      </div>
      <div style="font-size:11px;opacity:.77;margin-top:9px;">${reasons[reason] || 'No current decision'} · ${owner}</div>
      ${heading('Who receives energy?')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">
        ${box('PHYSICAL · observed recipient',realRecipient,'Requires BOTH real wattmeters; unknown ≠ zero.')}
        ${box('SIMULATION · HLT recipient',virtualRecipient,'Virtual permission is NOT actual switching.')}
      </div>
      ${heading('Power now · observed vs virtual')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">
        <div style="padding:10px;border-radius:12px;border:1px solid rgba(33,150,243,.25);background:rgba(33,150,243,.055);"><b style="font-size:11px;">BrewZilla · measured candidate</b><div style="font-size:24px;font-weight:950;margin-top:5px;">${watts('brewzilla_power_observed')}</div>${bar(bz,'#2196f3')}</div>
        <div style="padding:10px;border-radius:12px;border:1px solid rgba(255,152,0,.28);background:rgba(255,152,0,.055);"><b style="font-size:11px;">HLT · hypothetical heater</b><div style="font-size:24px;font-weight:950;margin-top:5px;">${watts('power_virtual')}</div>${bar(virtual,'#ff9800')}</div>
      </div>
      <div style="margin-top:8px;">${row('HLT physical wattmeter',watts('power_observed'))}${row('Actual total (both meters)',watts('total_power_observed'))}${row('Scenario total (BZ + virtual HLT)',watts('total_power_virtual_scenario'))}${row('Scenario budget · NOT circuit rating',watts('budget_scenario'))}${row('Observed headroom · NOT authorization',watts('headroom_observed'))}</div>
      ${heading('HLT water temperature')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;">
        ${box('CURRENT · '+sourceText,temperature('temperature'), 'Source must be read alongside the value.')}
        ${box('TARGET · scenario',temperature('target_temperature'),`Water: ${number('volume') === null ? '—' : number('volume').toFixed(1)+' L'}`)}
      </div>
      <div style="margin-top:8px;">${row('Measured probe',temperature('temperature_measured'))}${row('Model / calibrated estimate',temperature('temperature_estimated'))}</div>
      ${heading('HLT session timers')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;">
        ${box('TOTAL · wall-clock',seconds('total_session_seconds'),'Since first active HLT request.')}
        ${box('EFFECTIVE · virtual heat',seconds('virtual_heating_seconds'),'Sample-derived simulated ON time.')}
        ${box('EFFECTIVE · observed estimate',seconds('observed_heating_estimate_seconds'),'Only when power + switch agree at both sample endpoints.')}
      </div>
      <div style="margin-top:8px;">${row('Waiting for BZ',seconds('waiting_seconds'))}${row('Yielding to BZ',seconds('yielding_seconds'))}${row('Unobserved gaps',seconds('unknown_sample_seconds'))}${row('Virtual yields / BZ reclaims',`${raw('yield_count') ?? '—'} / ${raw('reclaim_count') ?? '—'}`)}${row('Estimated BZ / physical HLT energy',`${energy('brewzilla_energy_estimate_wh')} / ${energy('energy_estimate_wh')}`)}</div>
      <div style="margin-top:12px;padding:9px;border-radius:10px;background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.24);font-size:10px;line-height:1.5;">⚠ 30 s snapshots are not an electrical interlock. BZ always has priority, never throttled. Source outlet must be verified during BZ testing. Timers/Wh are estimates and reset on HA restart. No physical HLT controls here.</div>
      <div style="font-size:10px;opacity:.58;margin-top:8px;">JSONL trace: ${basename} · open entity for full path: sensor.brewassistant_hlt_trace_path</div>
    </div>`;
  ]]]
styles:
  card:
    - border-radius: 20px
    - padding: 16px
    - background: rgba(18,30,43,.44)
    - border: 1px solid rgba(127,127,127,.24)
  label:
    - width: 100%
    - justify-self: stretch
    - text-align: left
    - white-space: normal
    - overflow: visible
    - font-size: 12px
