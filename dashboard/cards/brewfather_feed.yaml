# BF fermentation is independent of RAPT/BT brewing source selection.
# Show only during BA's normalized fermentation or cold-crash process.
type: conditional
conditions:
  - entity: switch.brewassistant_show_brewfather_feed
    state: "on"
  - condition: or
    conditions:
      - condition: state
        entity: sensor.brewassistant_process_current_action_stage
        state: "fermentation"
      - condition: state
        entity: sensor.brewassistant_process_current_action_stage
        state: "cold_crash"
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: climate.fermentation_chamber
      name: Brewfather · Fermentation
      icon: mdi:flask-outline
      show_state: false
      show_label: true
      triggers_update:
        - sensor.brewassistant_process_current_action_stage
        - sensor.brewfather_recipe_name
        - climate.fermentation_chamber
      tap_action:
        action: more-info
      label: |
        [[[
          const clean = (v) => {
            const text = String(v ?? '').trim();
            return text && !['unknown', 'unavailable', 'none'].includes(text.toLowerCase()) ? text : '—';
          };
          const recipe = clean(states['sensor.brewfather_recipe_name']?.state);
          const chamber = clean(states['climate.fermentation_chamber']?.state);
          return `Recipe: ${recipe} · Fermentation chamber: ${chamber}<br>Brewfather supplies the fermentation profile. BrewAssistant regulates the chamber independently of the Brewing source.`;
        ]]]
      styles:
        card:
          - border-radius: 18px
          - padding: 14px
          - background: linear-gradient(135deg, rgba(156,39,176,.10), rgba(127,127,127,.035))
          - border: 1px solid rgba(156,39,176,.20)
        label:
          - white-space: normal
          - text-align: left
          - font-size: 12px
    - type: entities
      show_header_toggle: false
      entities:
        - entity: sensor.brewfather_recipe_name
          name: Recipe
        - entity: climate.fermentation_chamber
          name: Fermentation chamber
