# Keep GitHub Actions and CI tooling current, matching the ha-garmin watchdog setup.
# Dependency update PRs enter the normal promotion flow through dev first.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: daily
      time: "20:00"
      timezone: "Europe/Stockholm"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: daily
      time: "20:00"
      timezone: "Europe/Stockholm"
