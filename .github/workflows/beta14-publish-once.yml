name: Publish beta.14 prerelease once

# One version, one tested target, one controlled beta-only publishing workflow.
on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/beta14-publish-once.yml

permissions:
  contents: write
  actions: read

jobs:
  publish-beta14:
    if: >-
      github.ref == 'refs/heads/beta' &&
      github.event.head_commit.message == 'fix(beta.14): validate one-time publisher YAML and exact commit chain'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 1a956c04044df870e005392b6bfe946097b9d440
      FIRST_WORKFLOW_SHA: 6fce635a2a39bd860f415c3eaa00940708432d51
      CANDIDATE_SHA: e87b319170ed1819bcce69c82f01c8fea3dbd1e3
      TAG: v0.2.0-beta.14
    steps:
      - name: Check out exact tested beta merge commit
        uses: actions/checkout@v4
        with:
          ref: 1a956c04044df870e005392b6bfe946097b9d440
          persist-credentials: false

      - name: Verify exact SHA, manifest, workflow chain and release checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(python3 -c 'import json; print(json.load(open("custom_components/brewassistant/manifest.json"))["version"])')" = '0.2.0-beta.14'
          test -f docs/beta14-prerelease-notes_sv.md
          live_beta="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/beta" --jq '.object.sha')"
          test "$live_beta" = "$GITHUB_SHA"
          parent="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq '.parents[0].sha')"
          test "$parent" = "$FIRST_WORKFLOW_SHA"
          original_parent="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${FIRST_WORKFLOW_SHA}" --jq '.parents[0].sha')"
          test "$original_parent" = "$EXPECTED_SHA"
          for run_id in 35538135365 35538135442 35538135409; do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha + ":" + .conclusion')"
            test "$result" = "$EXPECTED_SHA:success"
          done
          smoke="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/35536081305" --jq '.head_sha + ":" + .conclusion')"
          test "$smoke" = "$CANDIDATE_SHA:success"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi

      - name: Publish exact commit as GitHub pre-release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/beta14-release-notes.md <<'NOTES'
          BrewAssistant 0.2.0-beta.14 — beta för övervakad testning med vatten.

          **Inte fysiskt verifierad:** Använd endast under uppsikt och med separat möjlighet till fysisk avstängning. Ett ABORT-anrop bevisar inte fysisk avstängning.

          - En read-only-switch för BA:s styrbehörighet. Den gamla orchestration_enabled-entiteten avvecklas; uppdatera egna dashboards och automationer.
          - Oberoende ABORT försöker stoppa RAPT-profilen och skicka OFF/0; kontrollera fysisk återkoppling.
          - Separata svenska och engelska observationskort har direkta RCL-reglage för Manual Brewday. Lägg till observationskortet bredvid ditt befintliga Manual Brewday-kort.
          - CI för Python 3.11–3.13, HACS och Hassfest är gröna på exakt beta-merge-commit; HA/RCL-isolerad smoke är grön på den kodidentiska kandidaten, inte mot fysisk hårdvara.

          [Fullständiga svenska anteckningar och vattenprov](https://github.com/Jocke1970/brewassistant-beta/blob/v0.2.0-beta.14/docs/beta14-prerelease-notes_sv.md).
          NOTES
          gh release create "$TAG" --target "$EXPECTED_SHA" --title 'BrewAssistant 2026_09-20 — fix-beta (v0.2.0-beta.14)' --notes-file /tmp/beta14-release-notes.md --prerelease
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$EXPECTED_SHA"
          prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')"
          test "$prerelease" = true
          gh release view "$TAG" --json url,tagName,isPrerelease,targetCommitish
