name: Hassfest

on:
  push:
    branches: [dev, beta, main]
  pull_request:
    branches: [dev, beta, main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
