name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q custom_components/brewassistant tests

      - name: Check fatal Python lint errors
        run: ruff check custom_components/brewassistant tests --select E9,F63,F7,F82

      - name: Validate integration JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/brewassistant/manifest.json >/dev/null
          python -m json.tool custom_components/brewassistant/translations/en.json >/dev/null
          python -m json.tool custom_components/brewassistant/translations/sv.json >/dev/null

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
